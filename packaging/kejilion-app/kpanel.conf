# shellcheck shell=bash disable=SC2034,SC2168
# --- 基础信息 / Basic Information ---
local app_id="kpanel"
local app_name="KPanel"
local app_text="完全贴合 kejilion.sh 业务的现代化 Linux Web 管理面板"
local app_url="https://hub.docker.com/r/kjlion/kejilion-panel"
local docker_name="kejilion-panel"
local docker_port="8080"
local app_size="1"

kpanel_valid_release_version() {
    local value="$1"
    local core=""
    local candidate=""
    local major=""
    local minor=""
    local patch=""

    [[ "${value}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.([1-9][0-9]*))?$ ]] || return 1
    core="${value%%-rc.*}"
    IFS=. read -r major minor patch <<<"${core}"
    [ "${#major}" -le 6 ] && [ "${#minor}" -le 6 ] && [ "${#patch}" -le 6 ] || return 1
    [ "${major}" -le 999999 ] && [ "${minor}" -le 999999 ] && [ "${patch}" -le 999999 ] || return 1
    case "${value}" in
        *-rc.*)
            candidate="${value##*-rc.}"
            [ "${#candidate}" -le 6 ] && [ "${candidate}" -le 999999 ]
            ;;
        *) return 0 ;;
    esac
}

kpanel_write_compose() {
    local app_dir="/home/docker/kpanel"
    local panel_gid="$1"
    local panel_image="${2:-docker.io/kjlion/kejilion-panel:latest}"

    printf '%s\n' "${panel_image}" |
        grep -Eq '^docker\.io/kjlion/kejilion-panel:(latest|[0-9]+\.[0-9]+\.[0-9]+)$|^docker\.io/kjlion/kejilion-panel@sha256:[0-9a-f]{64}$' || {
        echo "KPanel 镜像引用无效，拒绝写入 Compose。" >&2
        return 1
    }

    cat <<EOF > "${app_dir}/docker-compose.yml"
services:
  panel:
    image: ${panel_image}
    container_name: kejilion-panel
    restart: unless-stopped
    user: "65532:65532"
    group_add:
      - "${panel_gid}"
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${docker_port}:8080"
    environment:
      KEJILION_PANEL_LISTEN: ":8080"
      KEJILION_PANEL_DATA_DIR: /var/lib/kejilion-panel
      KEJILION_PANEL_AGENT_SOCKET: /run/kejilion-panel/agent.sock
      KEJILION_PANEL_AGENT_TOKEN_FILE: /run/secrets/agent-token
      KEJILION_PANEL_WEB_ROOT: /app/web
      KEJILION_PANEL_PUBLIC_URL: \${KPANEL_PUBLIC_URL}
      KEJILION_PANEL_ALLOW_IP_HOSTS: \${KPANEL_ALLOW_IP_HOSTS:-true}
      KEJILION_PANEL_SECURE_COOKIE: \${KPANEL_SECURE_COOKIE:-false}
      KEJILION_PANEL_TRUSTED_PROXY_CIDRS: \${KPANEL_TRUSTED_PROXY_CIDRS}
      KEJILION_PANEL_CLUSTER_PRIVATE_CIDRS: \${KPANEL_CLUSTER_PRIVATE_CIDRS:-}
    volumes:
      - ./data/panel:/var/lib/kejilion-panel
      - ./run:/run/kejilion-panel:ro
      - ./secrets/agent.token:/run/secrets/agent-token:ro
    networks:
      - kpanel-internal
      - kpanel-egress
    healthcheck:
      test: ["CMD", "/paneld", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kpanel-internal:
    name: kejilion-panel-internal
    internal: true
  kpanel-egress:
    name: kejilion-panel-egress
EOF
}

kpanel_write_agent_service() {
    local app_dir="/home/docker/kpanel"

    cat <<EOF > "${app_dir}/kejilion-agent.service"
[Unit]
Description=KPanel Host Agent
Documentation=https://hub.docker.com/r/kjlion/kejilion-panel
After=local-fs.target docker.service

[Service]
Type=simple
User=root
Group=kejilion-panel
EnvironmentFile=${app_dir}/agent.env
ExecStart=${app_dir}/bin/kejilion-agent
Restart=on-failure
RestartSec=3s
UMask=0077

NoNewPrivileges=true
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_MODULE CAP_NET_ADMIN CAP_SYS_RESOURCE CAP_DAC_OVERRIDE CAP_CHOWN CAP_LINUX_IMMUTABLE CAP_SYS_PTRACE
AmbientCapabilities=CAP_SYS_ADMIN CAP_SYS_MODULE CAP_NET_ADMIN CAP_SYS_RESOURCE CAP_DAC_OVERRIDE CAP_CHOWN CAP_LINUX_IMMUTABLE CAP_SYS_PTRACE
PrivateTmp=true
PrivateDevices=true
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=false
ProtectKernelLogs=true
ProtectKernelModules=false
ProtectKernelTunables=false
ProtectProc=default
# KPanel file management is explicitly rooted at /. ProtectSystem=strict keeps
# that root read-only even with ReadWritePaths=/ on some supported systemd
# releases. The typed, audited file API remains the write boundary, while Panel
# state is protected explicitly below.
ProtectSystem=false
ProtectHome=false
ReadOnlyPaths=${app_dir}/data/panel
# File mutations still pass through the typed, audited file API, which rejects
# KPanel state and credential paths, symlinks and kernel virtual filesystems.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
SystemCallFilter=@system-service @module @swap sethostname
SystemCallErrorNumber=EPERM

[Install]
WantedBy=multi-user.target
EOF

    cat <<EOF > "${app_dir}/kejilion-agent.openrc"
