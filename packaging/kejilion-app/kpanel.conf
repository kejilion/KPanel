# shellcheck shell=bash disable=SC2034,SC2168
# --- 基础信息 / Basic Information ---
local app_id="kpanel"
local app_name="KPanel"
local app_text="完全贴合 kejilion.sh 业务的现代化 Linux Web 管理面板"
local app_url="https://hub.docker.com/r/kjlion/kejilion-panel"
local docker_name="kejilion-panel"
local docker_port="8080"
local app_size="1"

kpanel_write_compose() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:latest"
    local panel_gid="$1"

    cat <<EOF > "${app_dir}/docker-compose.yml"
services:
  panel:
    image: ${panel_image}
    container_name: kejilion-panel
    restart: unless-stopped
    user: "65532:65532"
    group_add:
      - "${panel_gid}"
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${docker_port}:8080"
    environment:
      KEJILION_PANEL_LISTEN: ":8080"
      KEJILION_PANEL_DATA_DIR: /var/lib/kejilion-panel
      KEJILION_PANEL_AGENT_SOCKET: /run/kejilion-panel/agent.sock
      KEJILION_PANEL_AGENT_TOKEN_FILE: /run/secrets/agent-token
      KEJILION_PANEL_WEB_ROOT: /app/web
      KEJILION_PANEL_PUBLIC_URL: \${KPANEL_PUBLIC_URL}
      KEJILION_PANEL_ALLOW_IP_HOSTS: \${KPANEL_ALLOW_IP_HOSTS:-true}
      KEJILION_PANEL_SECURE_COOKIE: \${KPANEL_SECURE_COOKIE:-false}
      KEJILION_PANEL_TRUSTED_PROXY_CIDRS: \${KPANEL_TRUSTED_PROXY_CIDRS}
      KEJILION_PANEL_CLUSTER_PRIVATE_CIDRS: \${KPANEL_CLUSTER_PRIVATE_CIDRS:-}
    volumes:
      - ./data/panel:/var/lib/kejilion-panel
      - ./run:/run/kejilion-panel:ro
      - ./secrets/agent.token:/run/secrets/agent-token:ro
    networks:
      - kpanel-internal
      - kpanel-egress
    healthcheck:
      test: ["CMD", "/paneld", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kpanel-internal:
    name: kejilion-panel-internal
    internal: true
  kpanel-egress:
    name: kejilion-panel-egress
EOF
}

kpanel_write_agent_service() {
    local app_dir="/home/docker/kpanel"

    cat <<EOF > "${app_dir}/kejilion-agent.service"
[Unit]
Description=KPanel Host Agent
Documentation=https://hub.docker.com/r/kjlion/kejilion-panel
After=local-fs.target docker.service

[Service]
Type=simple
User=root
Group=kejilion-panel
EnvironmentFile=${app_dir}/agent.env
ExecStart=${app_dir}/bin/kejilion-agent
Restart=on-failure
RestartSec=3s
UMask=0077

NoNewPrivileges=true
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_MODULE CAP_NET_ADMIN CAP_SYS_RESOURCE CAP_DAC_OVERRIDE CAP_CHOWN CAP_LINUX_IMMUTABLE CAP_SYS_PTRACE
AmbientCapabilities=CAP_SYS_ADMIN CAP_SYS_MODULE CAP_NET_ADMIN CAP_SYS_RESOURCE CAP_DAC_OVERRIDE CAP_CHOWN CAP_LINUX_IMMUTABLE CAP_SYS_PTRACE
PrivateTmp=true
PrivateDevices=true
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=false
ProtectKernelLogs=true
ProtectKernelModules=false
ProtectKernelTunables=false
ProtectProc=default
# KPanel file management is explicitly rooted at /. ProtectSystem=strict keeps
# that root read-only even with ReadWritePaths=/ on some supported systemd
# releases. The typed, audited file API remains the write boundary, while Panel
# state is protected explicitly below.
ProtectSystem=false
ProtectHome=false
ReadOnlyPaths=${app_dir}/data/panel
# File mutations still pass through the typed, audited file API, which rejects
# KPanel state and credential paths, symlinks and kernel virtual filesystems.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
SystemCallFilter=@system-service @module @swap sethostname
SystemCallErrorNumber=EPERM

[Install]
WantedBy=multi-user.target
EOF

    cat <<EOF > "${app_dir}/kejilion-agent.openrc"
#!/sbin/openrc-run

name="KPanel Host Agent"
description="Privileged, typed host API for KPanel"
command="${app_dir}/bin/kejilion-agent"
command_user="root:kejilion-panel"
directory="/"
pidfile="${app_dir}/run/agent.pid"
supervisor="supervise-daemon"
respawn_delay=3
respawn_max=10
respawn_period=60
retry="TERM/30/KILL/5"
stopgroup=true
umask=0077
output_logger="logger -t kejilion-agent"
error_logger="logger -t kejilion-agent"
no_new_privs=true

export KEJILION_AGENT_SOCKET="${app_dir}/run/agent.sock"
export KEJILION_AGENT_TOKEN_FILE="${app_dir}/secrets/agent.token"
export KEJILION_AGENT_STATE_DIR="${app_dir}/data/agent"
export KEJILION_WEB_ROOT="/home/web"
export KEJILION_DOCKER_SOCKET="/var/run/docker.sock"
export KEJILION_DOCKER_PID_FILE="/run/docker.pid"
export KEJILION_DOCKER_ALLOW_SOCKET_ACTIVATION="false"
export KEJILION_SYSTEM_WRITES_ENABLED="true"
export KEJILION_PUBLIC_NETWORK_LOOKUP_ENABLED="true"

depend() {
    need localmount docker
    use net logger
    after firewall
}

start_pre() {
    checkpath --directory --mode 0750 --owner root:kejilion-panel "${app_dir}/run"
}
EOF
	chmod 755 "${app_dir}/kejilion-agent.openrc"

    cat <<EOF > "${app_dir}/agent.env"
KEJILION_AGENT_SOCKET=${app_dir}/run/agent.sock
KEJILION_AGENT_TOKEN_FILE=${app_dir}/secrets/agent.token
KEJILION_AGENT_STATE_DIR=${app_dir}/data/agent
KEJILION_WEB_ROOT=/home/web
KEJILION_DOCKER_SOCKET=/var/run/docker.sock
KEJILION_DOCKER_PID_FILE=/run/docker.pid
KEJILION_DOCKER_ALLOW_SOCKET_ACTIVATION=false
KEJILION_SYSTEM_WRITES_ENABLED=true
KEJILION_PUBLIC_NETWORK_LOOKUP_ENABLED=true
EOF
    chmod 600 "${app_dir}/agent.env"
}

kpanel_inherit_script_preferences() {
    local destination="$1"
    local source=""
    local candidate=""
    local mode=""
    local owner=""
    local region="default"

    for candidate in \
        /home/docker/kpanel/bin/kejilion.sh \
        /usr/local/bin/k \
        /usr/bin/k \
        /root/kejilion.sh
    do
        [ "${candidate}" != "${destination}" ] || continue
        [ -f "${candidate}" ] && [ ! -L "${candidate}" ] || continue
        owner="$(stat -c '%u' "${candidate}" 2>/dev/null || true)"
        mode="$(stat -c '%a' "${candidate}" 2>/dev/null || true)"
        [ "${owner}" = "0" ] || continue
        case "${mode}" in
            *[2367][0-7]|*[0-7][2367]) continue ;;
        esac
        if grep -Fx 'permission_granted="true"' "${candidate}" >/dev/null 2>&1; then
            source="${candidate}"
            break
        fi
    done
    [ -n "${source}" ] || {
        echo "未找到已接受许可协议的可信 kejilion.sh，拒绝为 KPanel 自动授权。"
        return 1
    }

    sed -i 's/^permission_granted="false"$/permission_granted="true"/' "${destination}" || return 1
    if grep -Fx 'ENABLE_STATS="false"' "${source}" >/dev/null 2>&1; then
        sed -i 's/^ENABLE_STATS="true"$/ENABLE_STATS="false"/' "${destination}" || return 1
    fi
    region="$(sed -n 's/^canshu="\(CN\|V6\)"$/\1/p' "${source}" | head -n 1)"
    if [ -n "${region}" ]; then
        sed -i "s/^canshu=\"default\"$/canshu=\"${region}\"/" "${destination}" || return 1
    fi
    grep -Fx 'permission_granted="true"' "${destination}" >/dev/null || return 1
}

kpanel_extract_release() {
    local image="$1"
    local agent_destination="$2"
    local script_destination="$3"
    local release_container="kpanel-release-$$-$RANDOM"
    local release_version_destination="${agent_destination}.release-version.$$.$RANDOM"
    local image_version=""
    local image_revision=""
    local script_revision=""
    local script_sha256=""
    local release_version=""

    if ! image_version="$(docker image inspect --format \
        '{{index .Config.Labels "org.opencontainers.image.version"}}' "${image}" 2>/dev/null)" ||
        ! image_revision="$(docker image inspect --format \
            '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${image}" 2>/dev/null)" ||
        ! script_revision="$(docker image inspect --format \
            '{{index .Config.Labels "io.kejilion.script.revision"}}' "${image}" 2>/dev/null)" ||
        ! script_sha256="$(docker image inspect --format \
            '{{index .Config.Labels "io.kejilion.script.sha256"}}' "${image}" 2>/dev/null)"; then
        echo "KPanel 镜像发布元数据读取失败，拒绝继续。"
        return 1
    fi
    printf '%s\n' "${image_version}" |
        grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' &&
        printf '%s\n' "${image_revision}" | grep -Eq '^[0-9a-f]{40}$' &&
        printf '%s\n' "${script_revision}" | grep -Eq '^[0-9a-f]{40}$' &&
        printf '%s\n' "${script_sha256}" | grep -Eq '^[0-9a-f]{64}$' || {
        echo "KPanel 镜像发布元数据无效，拒绝继续。"
        return 1
    }

    docker create --name "${release_container}" "${image}" >/dev/null || return 1
    if ! docker cp "${release_container}:/release/kejilion-agent" "${agent_destination}" ||
        ! docker cp "${release_container}:/release/kejilion.sh" "${script_destination}" ||
        ! docker cp "${release_container}:/release/VERSION" "${release_version_destination}"; then
        docker rm -f "${release_container}" >/dev/null 2>&1
        rm -f "${agent_destination}" "${script_destination}" "${release_version_destination}"
        return 1
    fi
    if ! docker rm "${release_container}" >/dev/null ||
        ! release_version="$(tr -d '\r\n' <"${release_version_destination}")" ||
        ! rm -f "${release_version_destination}" ||
        ! chmod 755 "${agent_destination}" ||
        ! chmod 700 "${script_destination}"; then
        rm -f "${agent_destination}" "${script_destination}" "${release_version_destination}"
        return 1
    fi
    [ "${release_version}" = "${image_version}" ] &&
        [ "$("${agent_destination}" version 2>/dev/null)" = "${image_version} v1alpha1" ] || {
        echo "Agent 版本校验失败，拒绝继续。"
        rm -f "${agent_destination}" "${script_destination}"
        return 1
    }
    command -v sha256sum >/dev/null 2>&1 &&
        [ "$(sha256sum "${script_destination}" | awk '{print $1}')" = "${script_sha256}" ] || {
        echo "kejilion.sh 完整性校验失败，拒绝继续。"
        rm -f "${agent_destination}" "${script_destination}"
        return 1
    }
    kpanel_inherit_script_preferences "${script_destination}" || {
        rm -f "${agent_destination}" "${script_destination}"
        return 1
    }
}

kpanel_create_agent_token() {
    local app_dir="/home/docker/kpanel"
    local panel_gid="$1"
    local destination="${app_dir}/secrets/agent.token"
    local temporary=""
    local token=""

    [ ! -e "${destination}" ] || {
        echo "Agent Token 已存在，拒绝覆盖。"
        return 1
    }
    [ -r /dev/urandom ] && command -v od >/dev/null 2>&1 &&
        command -v tr >/dev/null 2>&1 || {
        echo "系统缺少安全随机数或必要的 coreutils 工具。"
        return 1
    }
    temporary="$(mktemp "${app_dir}/secrets/.agent.token.XXXXXX")" || return 1
    token="$(LC_ALL=C od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" || {
        rm -f "${temporary}"
        return 1
    }
    [ "${#token}" -eq 64 ] || {
        echo "Agent Token 生成失败。"
        rm -f "${temporary}"
        return 1
    }
    if ! printf '%s\n' "${token}" >"${temporary}" ||
        ! chown root:"${panel_gid}" "${temporary}" ||
        ! chmod 0640 "${temporary}" ||
        ! mv -f "${temporary}" "${destination}"; then
        rm -f "${temporary}"
        return 1
    fi
}

kpanel_systemctl() {
    local systemctl_bin=""

    if [ -x /bin/systemctl ]; then
        systemctl_bin=/bin/systemctl
    elif [ -x /usr/bin/systemctl ]; then
        systemctl_bin=/usr/bin/systemctl
    else
        echo "未找到 systemd systemctl，KPanel Host Agent 无法安装。"
        return 1
    fi
    "${systemctl_bin}" "$@"
}

kpanel_openrc_tool() {
    local name="$1"
    shift
    local candidate=""

    for candidate in "/sbin/${name}" "/usr/sbin/${name}"; do
        if [ -x "${candidate}" ]; then
            "${candidate}" "$@"
            return $?
        fi
    done
    echo "未找到 OpenRC ${name}，KPanel Host Agent 无法管理。"
    return 1
}

kpanel_system_group_add() {
    local name="$1"
    if command -v groupadd >/dev/null 2>&1; then
        groupadd --system "${name}"
    elif command -v addgroup >/dev/null 2>&1; then
        addgroup -S "${name}"
    else
        echo "缺少系统组创建工具 groupadd/addgroup。"
        return 1
    fi
}

kpanel_system_group_delete() {
    local name="$1"
    if command -v groupdel >/dev/null 2>&1; then
        groupdel "${name}"
    elif command -v delgroup >/dev/null 2>&1; then
        delgroup "${name}"
    else
        return 1
    fi
}

kpanel_detect_init_system() {
    if [ -d /run/systemd/system ] &&
        { [ -x /bin/systemctl ] || [ -x /usr/bin/systemctl ]; }; then
        KPANEL_INIT_SYSTEM=systemd
        return 0
    fi
    if [ -d /run/openrc ] &&
        { [ -x /sbin/rc-service ] || [ -x /usr/sbin/rc-service ]; } &&
        { [ -x /sbin/rc-update ] || [ -x /usr/sbin/rc-update ]; } &&
        { [ -x /sbin/start-stop-daemon ] || [ -x /usr/sbin/start-stop-daemon ]; } &&
        { [ -x /sbin/supervise-daemon ] || [ -x /usr/sbin/supervise-daemon ]; } &&
        command -v logger >/dev/null 2>&1; then
        KPANEL_INIT_SYSTEM=openrc
        return 0
    fi
    KPANEL_INIT_SYSTEM=
    return 1
}

kpanel_agent_service_managed() {
    local app_dir="/home/docker/kpanel"
    case "${KPANEL_INIT_SYSTEM:-}" in
        systemd)
            [ -L /etc/systemd/system/kejilion-agent.service ] &&
                [ "$(readlink -f /etc/systemd/system/kejilion-agent.service)" = "$(readlink -f "${app_dir}/kejilion-agent.service")" ]
            ;;
        openrc)
            [ -L /etc/init.d/kejilion-agent ] &&
                [ "$(readlink -f /etc/init.d/kejilion-agent)" = "$(readlink -f "${app_dir}/kejilion-agent.openrc")" ]
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_link() {
    local app_dir="/home/docker/kpanel"
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl link "${app_dir}/kejilion-agent.service" >/dev/null ;;
        openrc)
            [ ! -e /etc/init.d/kejilion-agent ] && [ ! -L /etc/init.d/kejilion-agent ] || return 1
            ln -s "${app_dir}/kejilion-agent.openrc" /etc/init.d/kejilion-agent
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_reload() {
    [ "${KPANEL_INIT_SYSTEM}" = systemd ] && kpanel_systemctl daemon-reload ||
        [ "${KPANEL_INIT_SYSTEM}" = openrc ]
}

kpanel_agent_service_enable_start() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl enable --now kejilion-agent.service ;;
        openrc)
            kpanel_openrc_tool rc-update add kejilion-agent default &&
                kpanel_openrc_tool rc-service kejilion-agent start
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_start() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl start kejilion-agent.service ;;
        openrc) kpanel_openrc_tool rc-service kejilion-agent start ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_stop() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl stop kejilion-agent.service ;;
        openrc) kpanel_openrc_tool rc-service kejilion-agent stop ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_disable_stop() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl disable --now kejilion-agent.service ;;
        openrc)
            kpanel_openrc_tool rc-service kejilion-agent stop >/dev/null 2>&1 || true
            kpanel_openrc_tool rc-update del kejilion-agent default
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_unlink() {
    local app_dir="/home/docker/kpanel"
    if [ "${KPANEL_INIT_SYSTEM}" = systemd ] &&
        [ -L /etc/systemd/system/kejilion-agent.service ] &&
        [ "$(readlink -f /etc/systemd/system/kejilion-agent.service)" = "$(readlink -f "${app_dir}/kejilion-agent.service")" ]; then
        rm -f /etc/systemd/system/kejilion-agent.service
    elif [ "${KPANEL_INIT_SYSTEM}" = openrc ] &&
        [ -L /etc/init.d/kejilion-agent ] &&
        [ "$(readlink -f /etc/init.d/kejilion-agent)" = "$(readlink -f "${app_dir}/kejilion-agent.openrc")" ]; then
        rm -f /etc/init.d/kejilion-agent
    fi
}

kpanel_restore_agent_definitions() {
    local app_dir="/home/docker/kpanel"
    local openrc_preexisted="$1"

    mv "${app_dir}/kejilion-agent.service.rollback" "${app_dir}/kejilion-agent.service" || return 1
    mv "${app_dir}/agent.env.rollback" "${app_dir}/agent.env" || return 1
    if [ "${openrc_preexisted}" = true ]; then
        mv "${app_dir}/kejilion-agent.openrc.rollback" "${app_dir}/kejilion-agent.openrc" || return 1
    else
        rm -f "${app_dir}/kejilion-agent.openrc" "${app_dir}/kejilion-agent.openrc.rollback"
    fi
}

kpanel_remove_agent_definition_backups() {
    local app_dir="/home/docker/kpanel"
    rm -f "${app_dir}/kejilion-agent.service.rollback" \
        "${app_dir}/kejilion-agent.openrc.rollback" "${app_dir}/agent.env.rollback"
}

kpanel_wait_ready() {
    local app_dir="/home/docker/kpanel"
    local attempt=0
    while [ "${attempt}" -lt 30 ]; do
        if KEJILION_AGENT_SOCKET="${app_dir}/run/agent.sock" \
            KEJILION_AGENT_TOKEN_FILE="${app_dir}/secrets/agent.token" \
            "${app_dir}/bin/kejilion-agent" healthcheck >/dev/null 2>&1 &&
            [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' kejilion-panel 2>/dev/null)" = "healthy" ]; then
            return 0
        fi
        attempt=$((attempt + 1))
        sleep 2
    done
    return 1
}

kpanel_running_image_id() {
    local image_id=""

    image_id="$(docker inspect --format '{{.Image}}' kejilion-panel 2>/dev/null)" || {
        echo "无法读取当前 KPanel 容器镜像，拒绝执行可能无法回滚的更新。" >&2
        return 1
    }
    printf '%s\n' "${image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
        echo "无法确认当前 KPanel 镜像 ID，拒绝执行可能无法回滚的更新。" >&2
        return 1
    }
    printf '%s\n' "${image_id}"
}

kpanel_running_host_port() {
    local host_port=""

    host_port="$(docker inspect --format \
        '{{with (index .HostConfig.PortBindings "8080/tcp")}}{{(index . 0).HostPort}}{{end}}' \
        kejilion-panel 2>/dev/null)" || {
        echo "无法读取当前 KPanel 端口映射，拒绝覆盖现有端口配置。" >&2
        return 1
    }
    case "${host_port}" in
        ''|*[!0-9]*)
            echo "无法确认当前 KPanel 访问端口，拒绝覆盖现有端口配置。" >&2
            return 1
            ;;
    esac
    [ "${host_port}" -ge 1 ] && [ "${host_port}" -le 65535 ] || {
        echo "当前 KPanel 访问端口无效，拒绝覆盖现有端口配置。" >&2
        return 1
    }
    printf '%s\n' "${host_port}"
}

kpanel_ensure_runtime_env() {
    local app_dir="/home/docker/kpanel"
    local write_changes="${1:-true}"
    local public_url=""
    local secure_cookie=""
    local secure_cookie_count=""

    [ "${write_changes}" = true ] || [ "${write_changes}" = false ] || return 1
    [ "$(grep -c '^KPANEL_PUBLIC_URL=' "${app_dir}/.env")" -eq 1 ] || {
        echo "KPANEL_PUBLIC_URL 必须且只能配置一次。" >&2
        return 1
    }
    public_url="$(sed -n 's/^KPANEL_PUBLIC_URL=//p' "${app_dir}/.env")"
    secure_cookie_count="$(grep -c '^KPANEL_SECURE_COOKIE=' "${app_dir}/.env" || true)"
    case "${secure_cookie_count}" in
        0)
            if printf '%s\n' "${public_url}" | grep -Eq '^https://[^/?#]+$'; then
                secure_cookie=true
            else
                secure_cookie=false
            fi
            if [ "${write_changes}" = true ]; then
                printf 'KPANEL_SECURE_COOKIE=%s\n' "${secure_cookie}" >>"${app_dir}/.env" || return 1
            fi
            ;;
        1)
            secure_cookie="$(sed -n 's/^KPANEL_SECURE_COOKIE=//p' "${app_dir}/.env")"
            ;;
        *)
            echo "KPANEL_SECURE_COOKIE 必须且只能配置一次。" >&2
            return 1
            ;;
    esac
    case "${secure_cookie}" in
        true|false) ;;
        *)
            echo "KPANEL_SECURE_COOKIE 只允许 true 或 false。" >&2
            return 1
            ;;
    esac
}

kpanel_preflight_docker_port_publish() {
    local image_id="$1"
    local container_name="kpanel-network-preflight-$$-${RANDOM}"
    local container_id=""
    local network_name=""

    network_name="$(docker inspect --format \
        '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' \
        kejilion-panel 2>/dev/null | sed -n '1p')" || return 1
    [ -n "${network_name}" ] || {
        echo "无法确认当前 KPanel Docker 网络，更新尚未切换任何文件或服务。" >&2
        return 1
    }

    container_id="$(docker container create \
        --name "${container_name}" \
        --label io.kejilion.kpanel.network-preflight=true \
        --network "${network_name}" \
        --publish '127.0.0.1::8080' \
        --entrypoint /paneld \
        "${image_id}" healthcheck)" || {
        echo "Docker 端口映射预检无法创建临时容器，更新尚未切换任何文件或服务。" >&2
        return 1
    }

    if ! docker container start "${container_id}" >/dev/null; then
        docker container rm -f "${container_id}" >/dev/null 2>&1 || true
        echo "Docker 端口映射预检失败，更新尚未切换任何文件或服务。" >&2
        echo "请先修复 Docker 防火墙状态（例如缺失的 DOCKER iptables 链），确认其他容器正常后重试。" >&2
        return 1
    fi
    docker container rm -f "${container_id}" >/dev/null 2>&1 || {
        echo "Docker 端口映射预检容器无法清理，拒绝继续更新。" >&2
        return 1
    }
}

kpanel_restore_image_tag() {
    local image_id="$1"
    local image="$2"

    docker image tag "${image_id}" "${image}"
}

kpanel_abort_update() {
    local image_id="$1"
    local image="$2"

    if ! kpanel_restore_image_tag "${image_id}" "${image}"; then
        echo "KPanel 更新未切换服务，但旧镜像标签恢复失败；当前容器仍保持运行，请人工检查。" >&2
    fi
    return 0
}

kpanel_cleanup_old_images() {
    local current_image_id="$1"
    local image_id=""
    local container_ids=""

    printf '%s\n' "${current_image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || return 0

    docker image ls --all --no-trunc --quiet \
        --filter 'label=org.opencontainers.image.title=KPanel' \
        --filter 'label=org.opencontainers.image.source=https://github.com/kejilion/KPanel' \
        2>/dev/null | sort -u | while IFS= read -r image_id; do
        printf '%s\n' "${image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || continue
        [ "${image_id}" != "${current_image_id}" ] || continue
        container_ids="$(docker ps -aq --filter "ancestor=${image_id}" 2>/dev/null)" || continue
        [ -z "${container_ids}" ] || continue
        docker image rm "${image_id}" >/dev/null 2>&1 || true
    done
}

kpanel_trusted_proxy_cidrs() {
    local internal_subnet=""
    local egress_gateway=""
    local gateway_prefix=""

    internal_subnet="$(docker network inspect --format '{{(index .IPAM.Config 0).Subnet}}' \
        kejilion-panel-internal 2>/dev/null)" || return 1
    egress_gateway="$(docker network inspect --format '{{(index .IPAM.Config 0).Gateway}}' \
        kejilion-panel-egress 2>/dev/null)" || return 1
    [ -n "${internal_subnet}" ] && [ -n "${egress_gateway}" ] || return 1
    case "${egress_gateway}" in
        *:*) gateway_prefix="128" ;;
        *.*) gateway_prefix="32" ;;
        *) return 1 ;;
    esac
    printf '127.0.0.0/8,::1/128,%s,%s/%s\n' \
        "${internal_subnet}" "${egress_gateway}" "${gateway_prefix}"
}

kpanel_refresh_trusted_proxy_network() {
    local app_dir="/home/docker/kpanel"
    local trusted_proxy_cidrs=""
    local env_tmp="${app_dir}/.env.new.$$"

    trusted_proxy_cidrs="$(kpanel_trusted_proxy_cidrs)" || return 1
    awk -v cidrs="${trusted_proxy_cidrs}" '
        BEGIN { replaced = 0 }
        /^KPANEL_TRUSTED_PROXY_CIDRS=/ {
            print "KPANEL_TRUSTED_PROXY_CIDRS=" cidrs
            replaced = 1
            next
        }
        { print }
        END {
            if (!replaced) print "KPANEL_TRUSTED_PROXY_CIDRS=" cidrs
        }
    ' "${app_dir}/.env" >"${env_tmp}" || {
        rm -f "${env_tmp}"
        return 1
    }
    if ! chmod 600 "${env_tmp}" || ! mv "${env_tmp}" "${app_dir}/.env"; then
        rm -f "${env_tmp}"
        return 1
    fi
}

kpanel_report_failed_install() {
    local app_dir="/home/docker/kpanel"

    echo "KPanel 健康检查失败，以下为安装清理前的诊断信息："
    echo "----- Agent readiness -----"
    if [ -x "${app_dir}/bin/kejilion-agent" ]; then
        KEJILION_AGENT_SOCKET="${app_dir}/run/agent.sock" \
            KEJILION_AGENT_TOKEN_FILE="${app_dir}/secrets/agent.token" \
            "${app_dir}/bin/kejilion-agent" healthcheck 2>&1 || true
    fi
    echo "----- Agent service status -----"
    if [ "${KPANEL_INIT_SYSTEM:-}" = systemd ]; then
        kpanel_systemctl --no-pager --full status kejilion-agent.service 2>&1 || true
    else
        kpanel_openrc_tool rc-service kejilion-agent status 2>&1 || true
    fi
    if [ "${KPANEL_INIT_SYSTEM:-}" = systemd ] && command -v journalctl >/dev/null 2>&1; then
        echo "----- recent Agent journal -----"
        journalctl --no-pager -n 40 -u kejilion-agent.service 2>&1 || true
    elif [ -f /var/log/messages ]; then
        echo "----- recent Agent syslog -----"
        grep -F 'kejilion-agent' /var/log/messages 2>/dev/null | tail -n 40 || true
    fi
    echo "----- Panel container status -----"
    docker inspect --format \
        'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
        kejilion-panel 2>&1 || true
}

kpanel_direct_public_host() {
    if declare -F ip_address >/dev/null 2>&1; then
        ip_address >/dev/null 2>&1 || true
    fi
    if [ -n "${ipv4_address:-}" ]; then
        printf '%s\n' "${ipv4_address}"
    elif [ -n "${ipv6_address:-}" ]; then
        printf '[%s]\n' "${ipv6_address}"
    else
        printf '%s\n' '127.0.0.1'
    fi
}

kpanel_cleanup_failed_install() {
    local app_dir="/home/docker/kpanel"
    local remove_group="${1:-false}"

    if [ -f "${app_dir}/docker-compose.yml" ]; then
        (
            cd "${app_dir}" &&
                docker compose --env-file .env down >/dev/null 2>&1
        ) || true
    fi
    if [ -n "${KPANEL_INIT_SYSTEM:-}" ]; then
        kpanel_agent_service_disable_stop >/dev/null 2>&1 || true
        kpanel_agent_service_unlink
        kpanel_agent_service_reload >/dev/null 2>&1 || true
    fi
    rm -rf "${app_dir}"
    if [ "${remove_group}" = true ]; then
        kpanel_system_group_delete kejilion-panel >/dev/null 2>&1 || true
    fi
}

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:latest"
    local bootstrap_token=""
    local panel_gid=""
    local trusted_proxy_cidrs=""
    local public_host=""
    local group_created=false

    [ "$(id -u)" -eq 0 ] || {
        echo "KPanel 安装需要 root 权限。"
        return 1
    }
    kpanel_detect_init_system || {
        echo "KPanel Host Agent 需要 systemd 或 OpenRC，当前系统不支持。"
        return 1
    }
    if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
        echo "请先安装 Docker 与 Docker Compose 插件。"
        return 1
    fi
    [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ] || {
        echo "KPanel 当前仅支持 amd64 与 arm64。"
        return 1
    }
    [ ! -e "${app_dir}" ] &&
        [ ! -e /etc/systemd/system/kejilion-agent.service ] &&
        [ ! -L /etc/systemd/system/kejilion-agent.service ] &&
        [ ! -e /etc/init.d/kejilion-agent ] && [ ! -L /etc/init.d/kejilion-agent ] || {
        echo "检测到既有 KPanel 或 Agent，请使用更新功能，避免覆盖现有业务。"
        return 1
    }
    [ -z "$(docker ps -a --filter name='^/kejilion-panel$' --format '{{.Names}}')" ] || {
        echo "检测到同名容器，拒绝覆盖。"
        return 1
    }
    for panel_network in kejilion-panel-network kejilion-panel-internal kejilion-panel-egress; do
        ! docker network inspect "${panel_network}" >/dev/null 2>&1 || {
            echo "检测到同名 Docker 网络，拒绝覆盖。"
            return 1
        }
    done
    [[ "${docker_port}" =~ ^[0-9]+$ ]] && [ "${docker_port}" -ge 1 ] && [ "${docker_port}" -le 65535 ] || {
        echo "端口必须是 1-65535 的整数。"
        return 1
    }

    if ! getent group kejilion-panel >/dev/null 2>&1; then
        kpanel_system_group_add kejilion-panel || return 1
        group_created=true
    fi
    panel_gid="$(getent group kejilion-panel | cut -d: -f3)"
    [ -n "${panel_gid}" ] || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }

    if ! mkdir -p "${app_dir}/bin" "${app_dir}/data/panel" "${app_dir}/data/agent" \
        "${app_dir}/run" "${app_dir}/secrets"
    then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    if ! touch "${app_dir}/.managed-by-kejilion-app" ||
        ! chmod 600 "${app_dir}/.managed-by-kejilion-app"; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    if ! chown -R 65532:65532 "${app_dir}/data/panel" ||
        ! chown -R root:"${panel_gid}" "${app_dir}/data/agent" "${app_dir}/run" "${app_dir}/secrets" ||
        ! chmod 750 "${app_dir}" "${app_dir}/bin" "${app_dir}/data" \
            "${app_dir}/data/agent" "${app_dir}/run" "${app_dir}/secrets" ||
        ! chmod 700 "${app_dir}/data/panel"; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    if ! docker pull "${panel_image}" ||
        ! kpanel_extract_release "${panel_image}" \
            "${app_dir}/bin/kejilion-agent" "${app_dir}/bin/kejilion.sh" ||
        ! kpanel_create_agent_token "${panel_gid}" ||
        ! kpanel_write_compose "${panel_gid}" ||
        ! kpanel_write_agent_service; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    public_host="$(kpanel_direct_public_host)" || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }

    cat <<EOF > "${app_dir}/.env"
KPANEL_PUBLIC_URL=http://${public_host}:${docker_port}
KPANEL_SECURE_COOKIE=false
KPANEL_ALLOW_IP_HOSTS=true
KPANEL_TRUSTED_PROXY_CIDRS=127.0.0.0/8,::1/128
EOF
    chmod 600 "${app_dir}/.env"

    cd "${app_dir}" || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    if ! docker compose --env-file .env create; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    trusted_proxy_cidrs="$(kpanel_trusted_proxy_cidrs)" || {
        echo "无法识别 KPanel Docker 网络，安装已停止。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    cat <<EOF > "${app_dir}/.env"
KPANEL_PUBLIC_URL=http://${public_host}:${docker_port}
KPANEL_SECURE_COOKIE=false
KPANEL_ALLOW_IP_HOSTS=true
KPANEL_TRUSTED_PROXY_CIDRS=${trusted_proxy_cidrs}
EOF
    chmod 600 "${app_dir}/.env"

    if ! kpanel_agent_service_link ||
        ! kpanel_agent_service_reload ||
        ! kpanel_agent_service_enable_start ||
        ! docker compose --env-file .env up -d --force-recreate; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    if ! kpanel_wait_ready; then
        kpanel_report_failed_install
        kpanel_cleanup_failed_install "${group_created}"
        echo "KPanel 安装失败，已清理本次创建的服务和文件；请根据上方诊断修复后重试。"
        return 1
    fi
    bootstrap_token="$(tr -d '\r\n' < "${app_dir}/data/panel/bootstrap.token" 2>/dev/null)" || {
        echo "KPanel 初始化凭证读取失败，安装已停止。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    [ -n "${bootstrap_token}" ] || {
        echo "KPanel 初始化凭证为空，安装已停止。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }

    echo "KPanel 安装完成 / Install Complete"
    check_docker_app_ip
    echo "首次初始化 Token：${bootstrap_token}"
    echo "请复制此 Token 完成管理员账户初始化；初始化成功后 Token 自动失效。"
    echo "添加 HTTPS 域名：k fd panel.example.com 127.0.0.1 ${docker_port}"
}

docker_app_update() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:latest"
    local panel_gid=""
    local previous_image_id=""
    local previous_host_port=""
    local script_preexisted=false
    local openrc_service_preexisted=false

    kpanel_detect_init_system || {
        echo "KPanel Host Agent 需要 systemd 或 OpenRC，当前系统不支持。"
        return 1
    }
    [ -f "${app_dir}/.managed-by-kejilion-app" ] &&
        [ -f "${app_dir}/docker-compose.yml" ] && kpanel_agent_service_managed || {
        echo "当前 KPanel 不是由 kejilion.sh 应用市场安装，拒绝更新。"
        return 1
    }
    panel_gid="$(getent group kejilion-panel | cut -d: -f3)"
    [ -n "${panel_gid}" ] || return 1
    previous_image_id="$(kpanel_running_image_id)" || return 1
    previous_host_port="$(kpanel_running_host_port)" || return 1
    docker_port="${previous_host_port}"
    kpanel_ensure_runtime_env false || return 1
    kpanel_preflight_docker_port_publish "${previous_image_id}" || return 1

    cd "${app_dir}" || return 1
    rm -f "${app_dir}/bin/kejilion-agent.new" \
        "${app_dir}/bin/kejilion-agent.rollback" \
        "${app_dir}/bin/kejilion.sh.new" \
        "${app_dir}/bin/kejilion.sh.rollback" \
        "${app_dir}/docker-compose.yml.rollback" \
        "${app_dir}/.env.rollback" \
        "${app_dir}/kejilion-agent.service.rollback" \
        "${app_dir}/kejilion-agent.openrc.rollback" \
        "${app_dir}/agent.env.rollback"
    if ! docker pull "${panel_image}"; then
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    fi
    kpanel_extract_release "${panel_image}" \
        "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion.sh.new" || {
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }
    cp -p "${app_dir}/bin/kejilion-agent" "${app_dir}/bin/kejilion-agent.rollback" || {
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }
    if [ -f "${app_dir}/bin/kejilion.sh" ]; then
        cp -p "${app_dir}/bin/kejilion.sh" "${app_dir}/bin/kejilion.sh.rollback" || {
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
            return 1
        }
        script_preexisted=true
    fi
    cp -p "${app_dir}/docker-compose.yml" "${app_dir}/docker-compose.yml.rollback" || {
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }
    cp -p "${app_dir}/.env" "${app_dir}/.env.rollback" || {
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }
    cp -p "${app_dir}/kejilion-agent.service" "${app_dir}/kejilion-agent.service.rollback" || {
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }
    if [ -f "${app_dir}/kejilion-agent.openrc" ]; then
        cp -p "${app_dir}/kejilion-agent.openrc" "${app_dir}/kejilion-agent.openrc.rollback" || {
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
            return 1
        }
        openrc_service_preexisted=true
    fi
    cp -p "${app_dir}/agent.env" "${app_dir}/agent.env.rollback" || {
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }

    if ! kpanel_ensure_runtime_env ||
        ! kpanel_write_compose "${panel_gid}" ||
        ! kpanel_write_agent_service; then
        mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
        mv "${app_dir}/.env.rollback" "${app_dir}/.env"
        kpanel_restore_agent_definitions "${openrc_service_preexisted}"
        rm -f "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent.rollback" \
            "${app_dir}/bin/kejilion.sh.new" "${app_dir}/bin/kejilion.sh.rollback"
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    fi
    if ! kpanel_agent_service_stop; then
        mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
        mv "${app_dir}/.env.rollback" "${app_dir}/.env"
        kpanel_restore_agent_definitions "${openrc_service_preexisted}"
        rm -f "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent.rollback" \
            "${app_dir}/bin/kejilion.sh.new" "${app_dir}/bin/kejilion.sh.rollback"
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    fi
    mv "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent" || {
        mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
        mv "${app_dir}/.env.rollback" "${app_dir}/.env"
        kpanel_restore_agent_definitions "${openrc_service_preexisted}"
        rm -f "${app_dir}/bin/kejilion-agent.rollback"
        kpanel_agent_service_start
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }
    mv "${app_dir}/bin/kejilion.sh.new" "${app_dir}/bin/kejilion.sh" || {
        mv "${app_dir}/bin/kejilion-agent.rollback" "${app_dir}/bin/kejilion-agent"
        mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
        mv "${app_dir}/.env.rollback" "${app_dir}/.env"
        kpanel_restore_agent_definitions "${openrc_service_preexisted}"
        rm -f "${app_dir}/bin/kejilion.sh.rollback"
        kpanel_agent_service_start
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        return 1
    }

    if kpanel_agent_service_reload &&
        kpanel_agent_service_start &&
        docker compose --env-file .env up -d --force-recreate --remove-orphans &&
        kpanel_refresh_trusted_proxy_network &&
        docker compose --env-file .env up -d --force-recreate --remove-orphans &&
        kpanel_wait_ready; then
        rm -f "${app_dir}/bin/kejilion-agent.rollback" \
            "${app_dir}/bin/kejilion.sh.rollback" \
            "${app_dir}/docker-compose.yml.rollback" \
            "${app_dir}/.env.rollback" \
            "${app_dir}/kejilion-agent.service.rollback" \
            "${app_dir}/kejilion-agent.openrc.rollback" \
            "${app_dir}/agent.env.rollback"
        docker network rm kejilion-panel-network >/dev/null 2>&1 || true
        kpanel_cleanup_old_images "$(kpanel_running_image_id 2>/dev/null || true)"
        echo "KPanel 更新完成 / Update Complete"
        return 0
    fi

    echo "更新失败，正在自动回滚..."
    kpanel_agent_service_stop >/dev/null 2>&1
    mv "${app_dir}/bin/kejilion-agent.rollback" "${app_dir}/bin/kejilion-agent"
    if [ "${script_preexisted}" = true ]; then
        mv "${app_dir}/bin/kejilion.sh.rollback" "${app_dir}/bin/kejilion.sh"
    else
        rm -f "${app_dir}/bin/kejilion.sh"
    fi
    mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
    mv "${app_dir}/.env.rollback" "${app_dir}/.env"
    kpanel_restore_agent_definitions "${openrc_service_preexisted}"
    if ! kpanel_restore_image_tag "${previous_image_id}" "${panel_image}"; then
        echo "旧 KPanel 镜像标签恢复失败，请人工使用镜像 ID ${previous_image_id} 恢复。"
    fi
    if ! kpanel_agent_service_reload ||
        ! kpanel_agent_service_start ||
        ! docker compose --env-file .env up -d --force-recreate ||
        ! kpanel_wait_ready; then
        echo "回滚后的服务仍未就绪，请人工检查。"
    else
        echo "更新未完成，已恢复原 KPanel 版本与访问端口。"
    fi
    return 1
}

docker_app_uninstall() {
    local app_dir="/home/docker/kpanel"

    kpanel_detect_init_system || {
        echo "KPanel Host Agent 需要 systemd 或 OpenRC，当前系统不支持。"
        return 1
    }
    [ -f "${app_dir}/.managed-by-kejilion-app" ] &&
        [ -f "${app_dir}/docker-compose.yml" ] && kpanel_agent_service_managed || {
        echo "当前 KPanel 不是由 kejilion.sh 应用市场安装，拒绝卸载。"
        return 1
    }
    cd "${app_dir}" || return 1
    docker compose --env-file .env down --rmi all
    kpanel_agent_service_disable_stop >/dev/null 2>&1 || true
    kpanel_agent_service_unlink
    kpanel_agent_service_reload
    rm -rf "${app_dir}"
    kpanel_system_group_delete kejilion-panel >/dev/null 2>&1 || true
    echo "KPanel 已卸载，配置、审计记录与面板数据已清理。"
}

# --- 注册 / Registration ---
docker_app_plus
