kpanel_write_update_units() {
    local app_dir="/home/docker/kpanel"

    [ "${KPANEL_INIT_SYSTEM:-}" = systemd ] || return 0

    cat <<EOF > "${app_dir}/kejilion-panel-update.service"
[Unit]
Description=KPanel Managed Release Update
Documentation=https://github.com/kejilion/KPanel
After=network-online.target docker.service kejilion-agent.service
