kpanel_inherit_script_preferences() {
    local destination="$1"
    local source=""
    local candidate=""
    local mode=""
    local owner=""
    local region="default"

    for candidate in \
        /home/docker/kpanel/bin/kejilion.sh \
        /usr/local/bin/k \
        /usr/bin/k \
        /root/kejilion.sh
    do
        [ "${candidate}" != "${destination}" ] || continue
        [ -f "${candidate}" ] && [ ! -L "${candidate}" ] || continue
        owner="$(stat -c '%u' "${candidate}" 2>/dev/null || true)"
        mode="$(stat -c '%a' "${candidate}" 2>/dev/null || true)"
        [ "${owner}" = "0" ] || continue
        case "${mode}" in
            *[2367][0-7]|*[0-7][2367]) continue ;;
        esac
        if grep -Fx 'permission_granted="true"' "${candidate}" >/dev/null 2>&1; then
            source="${candidate}"
            break
        fi
    done
    [ -n "${source}" ] || {
        echo "未找到已接受许可协议的可信 kejilion.sh，拒绝为 KPanel 自动授权。"
        return 1
    }

    sed -i 's/^permission_granted="false"$/permission_granted="true"/' "${destination}" || return 1
    if grep -Fx 'ENABLE_STATS="false"' "${source}" >/dev/null 2>&1; then
        sed -i 's/^ENABLE_STATS="true"$/ENABLE_STATS="false"/' "${destination}" || return 1
    fi
    region="$(sed -n 's/^canshu="\(CN\|V6\)"$/\1/p' "${source}" | head -n 1)"
    if [ -n "${region}" ]; then
        sed -i "s/^canshu=\"default\"$/canshu=\"${region}\"/" "${destination}" || return 1
    fi
    grep -Fx 'permission_granted="true"' "${destination}" >/dev/null || return 1
}

kpanel_extract_release() {
    local image="$1"
    local agent_destination="$2"
    local script_destination="$3"
    local lifecycle_destination="${4:-}"
    local expected_version="${5:-}"
    local release_container="kpanel-release-$$-$RANDOM"
    local release_version_destination="${agent_destination}.release-version.$$.$RANDOM"
    local image_version=""
    local image_revision=""
    local script_revision=""
    local script_sha256=""
    local release_version=""

    if ! image_version="$(docker image inspect --format \
        '{{index .Config.Labels "org.opencontainers.image.version"}}' "${image}" 2>/dev/null)" ||
        ! image_revision="$(docker image inspect --format \
            '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${image}" 2>/dev/null)" ||
        ! script_revision="$(docker image inspect --format \
            '{{index .Config.Labels "io.kejilion.script.revision"}}' "${image}" 2>/dev/null)" ||
        ! script_sha256="$(docker image inspect --format \
            '{{index .Config.Labels "io.kejilion.script.sha256"}}' "${image}" 2>/dev/null)"; then
        echo "KPanel 镜像发布元数据读取失败，拒绝继续。"
        return 1
    fi
    kpanel_valid_release_version "${image_version}" &&
        printf '%s\n' "${image_revision}" | grep -Eq '^[0-9a-f]{40}$' &&
        printf '%s\n' "${script_revision}" | grep -Eq '^[0-9a-f]{40}$' &&
        printf '%s\n' "${script_sha256}" | grep -Eq '^[0-9a-f]{64}$' || {
        echo "KPanel 镜像发布元数据无效，拒绝继续。"
        return 1
    }

    docker create --name "${release_container}" "${image}" >/dev/null || return 1
    if ! docker cp "${release_container}:/release/kejilion-agent" "${agent_destination}" ||
        ! docker cp "${release_container}:/release/kejilion.sh" "${script_destination}" ||
        ! docker cp "${release_container}:/release/VERSION" "${release_version_destination}" ||
        ! { [ -z "${lifecycle_destination}" ] ||
            docker cp "${release_container}:/release/kpanel.conf" "${lifecycle_destination}"; }; then
        docker rm -f "${release_container}" >/dev/null 2>&1
        rm -f "${agent_destination}" "${script_destination}" "${lifecycle_destination}" \
            "${release_version_destination}"
        return 1
    fi
    if ! docker rm "${release_container}" >/dev/null ||
        ! release_version="$(tr -d '\r\n' <"${release_version_destination}")" ||
        ! rm -f "${release_version_destination}" ||
        ! chmod 755 "${agent_destination}" ||
        ! chmod 700 "${script_destination}" ||
        ! { [ -z "${lifecycle_destination}" ] || chmod 600 "${lifecycle_destination}"; }; then
        rm -f "${agent_destination}" "${script_destination}" "${lifecycle_destination}" \
            "${release_version_destination}"
        return 1
    fi
    if [ -n "${expected_version}" ] && [ "${release_version}" != "${expected_version}" ]; then
        echo "KPanel 镜像版本与自动更新目标不一致，拒绝继续。"
        rm -f "${agent_destination}" "${script_destination}" "${lifecycle_destination}"
        return 1
    fi
    [ "${release_version}" = "${image_version}" ] &&
        [ "$("${agent_destination}" version 2>/dev/null)" = "${image_version} v1alpha1" ] || {
        echo "Agent 版本校验失败，拒绝继续。"
        rm -f "${agent_destination}" "${script_destination}" "${lifecycle_destination}"
        return 1
    }
    command -v sha256sum >/dev/null 2>&1 &&
        [ "$(sha256sum "${script_destination}" | awk '{print $1}')" = "${script_sha256}" ] || {
        echo "kejilion.sh 完整性校验失败，拒绝继续。"
        rm -f "${agent_destination}" "${script_destination}" "${lifecycle_destination}"
        return 1
    }
    kpanel_inherit_script_preferences "${script_destination}" || {
        rm -f "${agent_destination}" "${script_destination}" "${lifecycle_destination}"
        return 1
    }
}

kpanel_create_agent_token() {
    local app_dir="/home/docker/kpanel"
    local panel_gid="$1"
    local destination="${app_dir}/secrets/agent.token"
    local temporary=""
    local token=""

    [ ! -e "${destination}" ] || {
        echo "Agent Token 已存在，拒绝覆盖。"
        return 1
    }
    [ -r /dev/urandom ] && command -v od >/dev/null 2>&1 &&
        command -v tr >/dev/null 2>&1 || {
        echo "系统缺少安全随机数或必要的 coreutils 工具。"
        return 1
    }
    temporary="$(mktemp "${app_dir}/secrets/.agent.token.XXXXXX")" || return 1
    token="$(LC_ALL=C od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" || {
        rm -f "${temporary}"
        return 1
    }
    [ "${#token}" -eq 64 ] || {
        echo "Agent Token 生成失败。"
        rm -f "${temporary}"
        return 1
    }
    if ! printf '%s\n' "${token}" >"${temporary}" ||
        ! chown root:"${panel_gid}" "${temporary}" ||
        ! chmod 0640 "${temporary}" ||
        ! mv -f "${temporary}" "${destination}"; then
        rm -f "${temporary}"
        return 1
    fi
}

kpanel_systemctl() {
    local systemctl_bin=""

    if [ -x /bin/systemctl ]; then
        systemctl_bin=/bin/systemctl
    elif [ -x /usr/bin/systemctl ]; then
        systemctl_bin=/usr/bin/systemctl
    else
        echo "未找到 systemd systemctl，KPanel Host Agent 无法安装。"
        return 1
    fi
    "${systemctl_bin}" "$@"
}

kpanel_openrc_tool() {
    local name="$1"
    shift
    local candidate=""

    for candidate in "/sbin/${name}" "/usr/sbin/${name}"; do
        if [ -x "${candidate}" ]; then
            "${candidate}" "$@"
            return $?
        fi
    done
    echo "未找到 OpenRC ${name}，KPanel Host Agent 无法管理。"
    return 1
}

kpanel_system_group_add() {
    local name="$1"
    if command -v groupadd >/dev/null 2>&1; then
        groupadd --system "${name}"
    elif command -v addgroup >/dev/null 2>&1; then
        addgroup -S "${name}"
    else
        echo "缺少系统组创建工具 groupadd/addgroup。"
        return 1
    fi
}

kpanel_system_group_delete() {
    local name="$1"
    if command -v groupdel >/dev/null 2>&1; then
        groupdel "${name}"
    elif command -v delgroup >/dev/null 2>&1; then
        delgroup "${name}"
    else
        return 1
    fi
}

kpanel_detect_init_system() {
    if [ -d /run/systemd/system ] &&
        { [ -x /bin/systemctl ] || [ -x /usr/bin/systemctl ]; }; then
        KPANEL_INIT_SYSTEM=systemd
        return 0
    fi
    if [ -d /run/openrc ] &&
        { [ -x /sbin/rc-service ] || [ -x /usr/sbin/rc-service ]; } &&
        { [ -x /sbin/rc-update ] || [ -x /usr/sbin/rc-update ]; } &&
        { [ -x /sbin/start-stop-daemon ] || [ -x /usr/sbin/start-stop-daemon ]; } &&
        { [ -x /sbin/supervise-daemon ] || [ -x /usr/sbin/supervise-daemon ]; } &&
        command -v logger >/dev/null 2>&1; then
        KPANEL_INIT_SYSTEM=openrc
        return 0
    fi
    KPANEL_INIT_SYSTEM=
    return 1
}

kpanel_agent_service_managed() {
    local app_dir="/home/docker/kpanel"
    case "${KPANEL_INIT_SYSTEM:-}" in
        systemd)
            [ -L /etc/systemd/system/kejilion-agent.service ] &&
                [ "$(readlink -f /etc/systemd/system/kejilion-agent.service)" = "$(readlink -f "${app_dir}/kejilion-agent.service")" ]
            ;;
        openrc)
            [ -L /etc/init.d/kejilion-agent ] &&
                [ "$(readlink -f /etc/init.d/kejilion-agent)" = "$(readlink -f "${app_dir}/kejilion-agent.openrc")" ]
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_link() {
    local app_dir="/home/docker/kpanel"
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl link "${app_dir}/kejilion-agent.service" >/dev/null ;;
        openrc)
            [ ! -e /etc/init.d/kejilion-agent ] && [ ! -L /etc/init.d/kejilion-agent ] || return 1
            ln -s "${app_dir}/kejilion-agent.openrc" /etc/init.d/kejilion-agent
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_reload() {
    [ "${KPANEL_INIT_SYSTEM}" = systemd ] && kpanel_systemctl daemon-reload ||
        [ "${KPANEL_INIT_SYSTEM}" = openrc ]
}

kpanel_agent_service_enable_start() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl enable --now kejilion-agent.service ;;
        openrc)
            kpanel_openrc_tool rc-update add kejilion-agent default &&
                kpanel_openrc_tool rc-service kejilion-agent start
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_start() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl start kejilion-agent.service ;;
        openrc) kpanel_openrc_tool rc-service kejilion-agent start ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_stop() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl stop kejilion-agent.service ;;
        openrc) kpanel_openrc_tool rc-service kejilion-agent stop ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_disable_stop() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl disable --now kejilion-agent.service ;;
        openrc)
            kpanel_openrc_tool rc-service kejilion-agent stop >/dev/null 2>&1 || true
            kpanel_openrc_tool rc-update del kejilion-agent default
            ;;
        *) return 1 ;;
    esac
}

kpanel_agent_service_unlink() {
    local app_dir="/home/docker/kpanel"
    if [ "${KPANEL_INIT_SYSTEM}" = systemd ] &&
        [ -L /etc/systemd/system/kejilion-agent.service ] &&
        [ "$(readlink -f /etc/systemd/system/kejilion-agent.service)" = "$(readlink -f "${app_dir}/kejilion-agent.service")" ]; then
        rm -f /etc/systemd/system/kejilion-agent.service
    elif [ "${KPANEL_INIT_SYSTEM}" = openrc ] &&
        [ -L /etc/init.d/kejilion-agent ] &&
        [ "$(readlink -f /etc/init.d/kejilion-agent)" = "$(readlink -f "${app_dir}/kejilion-agent.openrc")" ]; then
        rm -f /etc/init.d/kejilion-agent
    fi
}

kpanel_update_service_link() {
    local app_dir="/home/docker/kpanel"
    case "${KPANEL_INIT_SYSTEM}" in
        systemd)
            kpanel_systemctl link "${app_dir}/kejilion-panel-update.service" >/dev/null &&
                kpanel_systemctl link "${app_dir}/kejilion-panel-update.timer" >/dev/null
            ;;
        openrc) return 0 ;;
        *) return 1 ;;
    esac
}

kpanel_update_service_enable_start() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl enable --now kejilion-panel-update.timer ;;
        openrc) return 0 ;;
        *) return 1 ;;
    esac
}

kpanel_update_service_disable_stop() {
    case "${KPANEL_INIT_SYSTEM}" in
        systemd) kpanel_systemctl disable --now kejilion-panel-update.timer ;;
        openrc) return 0 ;;
        *) return 1 ;;
    esac
}

kpanel_update_service_unlink() {
    local app_dir="/home/docker/kpanel"
    case "${KPANEL_INIT_SYSTEM}" in
        systemd)
            kpanel_remove_managed_unit_link kejilion-panel-update.timer \
                "${app_dir}/kejilion-panel-update.timer"
            kpanel_remove_managed_unit_link kejilion-panel-update.service \
                "${app_dir}/kejilion-panel-update.service"
            ;;
        openrc) return 0 ;;
        *) return 1 ;;
    esac
}

kpanel_restore_agent_definitions() {
    local app_dir="/home/docker/kpanel"
    local openrc_preexisted="$1"

    mv "${app_dir}/kejilion-agent.service.rollback" "${app_dir}/kejilion-agent.service" || return 1
    mv "${app_dir}/agent.env.rollback" "${app_dir}/agent.env" || return 1
    if [ "${openrc_preexisted}" = true ]; then
        mv "${app_dir}/kejilion-agent.openrc.rollback" "${app_dir}/kejilion-agent.openrc" || return 1
    else
        rm -f "${app_dir}/kejilion-agent.openrc" "${app_dir}/kejilion-agent.openrc.rollback"
    fi
}

kpanel_remove_agent_definition_backups() {
    local app_dir="/home/docker/kpanel"
    rm -f "${app_dir}/kejilion-agent.service.rollback" \
        "${app_dir}/kejilion-agent.openrc.rollback" "${app_dir}/agent.env.rollback"
}

kpanel_wait_ready() {
    local app_dir="/home/docker/kpanel"
    local attempt=0
    while [ "${attempt}" -lt 30 ]; do
        if KEJILION_AGENT_SOCKET="${app_dir}/run/agent.sock" \
            KEJILION_AGENT_TOKEN_FILE="${app_dir}/secrets/agent.token" \
            "${app_dir}/bin/kejilion-agent" healthcheck >/dev/null 2>&1 &&
            [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' kejilion-panel 2>/dev/null)" = "healthy" ]; then
            return 0
        fi
        attempt=$((attempt + 1))
        sleep 2
    done
    return 1
}

kpanel_running_image_id() {
    local image_id=""

    image_id="$(docker inspect --format '{{.Image}}' kejilion-panel 2>/dev/null)" || {
        echo "无法读取当前 KPanel 容器镜像，拒绝执行可能无法回滚的更新。" >&2
        return 1
    }
    printf '%s\n' "${image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
        echo "无法确认当前 KPanel 镜像 ID，拒绝执行可能无法回滚的更新。" >&2
        return 1
    }
    printf '%s\n' "${image_id}"
}

kpanel_running_host_port() {
    local host_port=""

    host_port="$(docker inspect --format \
        '{{with (index .HostConfig.PortBindings "8080/tcp")}}{{(index . 0).HostPort}}{{end}}' \
        kejilion-panel 2>/dev/null)" || {
        echo "无法读取当前 KPanel 端口映射，拒绝覆盖现有端口配置。" >&2
        return 1
    }
    case "${host_port}" in
        ''|*[!0-9]*)
            echo "无法确认当前 KPanel 访问端口，拒绝覆盖现有端口配置。" >&2
            return 1
            ;;
    esac
    [ "${host_port}" -ge 1 ] && [ "${host_port}" -le 65535 ] || {
        echo "当前 KPanel 访问端口无效，拒绝覆盖现有端口配置。" >&2
        return 1
    }
    printf '%s\n' "${host_port}"
}

kpanel_ensure_runtime_env() {
    local app_dir="/home/docker/kpanel"
    local write_changes="${1:-true}"
    local public_url=""
    local secure_cookie=""
    local secure_cookie_count=""

    [ "${write_changes}" = true ] || [ "${write_changes}" = false ] || return 1
    [ "$(grep -c '^KPANEL_PUBLIC_URL=' "${app_dir}/.env")" -eq 1 ] || {
        echo "KPANEL_PUBLIC_URL 必须且只能配置一次。" >&2
        return 1
    }
    public_url="$(sed -n 's/^KPANEL_PUBLIC_URL=//p' "${app_dir}/.env")"
    secure_cookie_count="$(grep -c '^KPANEL_SECURE_COOKIE=' "${app_dir}/.env" || true)"
    case "${secure_cookie_count}" in
        0)
            if printf '%s\n' "${public_url}" | grep -Eq '^https://[^/?#]+$'; then
                secure_cookie=true
            else
                secure_cookie=false
            fi
            if [ "${write_changes}" = true ]; then
                printf 'KPANEL_SECURE_COOKIE=%s\n' "${secure_cookie}" >>"${app_dir}/.env" || return 1
            fi
            ;;
        1)
            secure_cookie="$(sed -n 's/^KPANEL_SECURE_COOKIE=//p' "${app_dir}/.env")"
            ;;
        *)
            echo "KPANEL_SECURE_COOKIE 必须且只能配置一次。" >&2
            return 1
            ;;
    esac
    case "${secure_cookie}" in
        true|false) ;;
        *)
            echo "KPANEL_SECURE_COOKIE 只允许 true 或 false。" >&2
            return 1
            ;;
    esac
}

kpanel_preflight_docker_port_publish() {
    local image_id="$1"
    local container_name="kpanel-network-preflight-$$-${RANDOM}"
    local container_id=""
    local network_name=""

    network_name="$(docker inspect --format \
        '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' \
        kejilion-panel 2>/dev/null | sed -n '1p')" || return 1
    [ -n "${network_name}" ] || {
        echo "无法确认当前 KPanel Docker 网络，更新尚未切换任何文件或服务。" >&2
        return 1
    }

    container_id="$(docker container create \
        --name "${container_name}" \
        --label io.kejilion.kpanel.network-preflight=true \
        --network "${network_name}" \
        --publish '127.0.0.1::8080' \
        --entrypoint /paneld \
        "${image_id}" healthcheck)" || {
        echo "Docker 端口映射预检无法创建临时容器，更新尚未切换任何文件或服务。" >&2
        return 1
    }

    if ! docker container start "${container_id}" >/dev/null; then
        docker container rm -f "${container_id}" >/dev/null 2>&1 || true
        echo "Docker 端口映射预检失败，更新尚未切换任何文件或服务。" >&2
        echo "请先修复 Docker 防火墙状态（例如缺失的 DOCKER iptables 链），确认其他容器正常后重试。" >&2
        return 1
    fi
    docker container rm -f "${container_id}" >/dev/null 2>&1 || {
        echo "Docker 端口映射预检容器无法清理，拒绝继续更新。" >&2
        return 1
    }
}

kpanel_restore_image_tag() {
    local image_id="$1"
    local image="$2"

    docker image tag "${image_id}" "${image}"
}

kpanel_abort_update() {
    local image_id="$1"
    local image="$2"

    if ! kpanel_restore_image_tag "${image_id}" "${image}"; then
        echo "KPanel 更新未切换服务，但旧镜像标签恢复失败；当前容器仍保持运行，请人工检查。" >&2
    fi
    return 0
}

kpanel_cleanup_old_images() {
    local current_image_id="$1"
    local image_id=""
    local container_ids=""

    printf '%s\n' "${current_image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || return 0

    docker image ls --all --no-trunc --quiet \
        --filter 'label=org.opencontainers.image.title=KPanel' \
        --filter 'label=org.opencontainers.image.source=https://github.com/kejilion/KPanel' \
        2>/dev/null | sort -u | while IFS= read -r image_id; do
        printf '%s\n' "${image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || continue
        [ "${image_id}" != "${current_image_id}" ] || continue
        container_ids="$(docker ps -aq --filter "ancestor=${image_id}" 2>/dev/null)" || continue
        [ -z "${container_ids}" ] || continue
        docker image rm "${image_id}" >/dev/null 2>&1 || true
    done
}

kpanel_with_lifecycle_lock() {
    local lock_file="/run/lock/kejilion-kpanel-lifecycle.lock"
    local lock_fd=""
    local status=0

    command -v flock >/dev/null 2>&1 || {
        echo "系统缺少 flock，拒绝执行无法串行化的 KPanel 生命周期操作。" >&2
        return 1
    }
    mkdir -p /run/lock || return 1
    exec {lock_fd}>"${lock_file}" || return 1
    if ! flock -w 300 "${lock_fd}"; then
        echo "另一个 KPanel 安装、更新或卸载任务仍在运行。" >&2
        exec {lock_fd}>&-
        return 1
    fi
    local KJ_KPANEL_LIFECYCLE_LOCK_HELD=1
    if "$@"; then
        status=0
    else
        status=$?
    fi
    flock -u "${lock_fd}" >/dev/null 2>&1 || true
    exec {lock_fd}>&-
    return "${status}"
}

kpanel_remove_managed_unit_link() {
    local unit_name="$1"
    local source_path="$2"
    local link_path="/etc/systemd/system/${unit_name}"

    if [ -L "${link_path}" ] && [ -e "${source_path}" ] &&
        [ "$(readlink -f "${link_path}")" = "$(readlink -f "${source_path}")" ]; then
        rm -f "${link_path}"
    fi
}

kpanel_link_managed_unit() {
    local unit_name="$1"
    local source_path="$2"
    local link_path="/etc/systemd/system/${unit_name}"

    [ -f "${source_path}" ] && [ ! -L "${source_path}" ] || return 1
    if [ -L "${link_path}" ]; then
        [ "$(readlink -f "${link_path}")" = "$(readlink -f "${source_path}")" ]
        return $?
    fi
    [ ! -e "${link_path}" ] || return 1
    kpanel_systemctl link "${source_path}" >/dev/null
}

kpanel_clear_update_files() {
    local app_dir="/home/docker/kpanel"

    rm -f \
        "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent.rollback" \
        "${app_dir}/bin/kejilion.sh.new" "${app_dir}/bin/kejilion.sh.rollback" \
        "${app_dir}/bin/kpanel.conf.new" "${app_dir}/bin/kpanel.conf.rollback" \
        "${app_dir}/docker-compose.yml.rollback" "${app_dir}/.env.rollback" \
        "${app_dir}/kejilion-agent.service.rollback" "${app_dir}/agent.env.rollback" \
        "${app_dir}/kejilion-agent.openrc.rollback" \
        "${app_dir}/kejilion-panel-update.service.rollback" \
        "${app_dir}/kejilion-panel-update.timer.rollback"
}

kpanel_validate_automatic_storage() {
    local state_dir="/home/docker/kpanel/update-state"
    local backup_dir="${state_dir}/backups"
    local path=""
    local owner=""
    local mode=""

    for path in "${state_dir}" "${backup_dir}"; do
        [ -d "${path}" ] && [ ! -L "${path}" ] || return 1
        owner="$(stat -c '%u' "${path}" 2>/dev/null)" || return 1
        mode="$(stat -c '%a' "${path}" 2>/dev/null)" || return 1
        [ "${owner}" = 0 ] && [ "${mode}" = 700 ] || {
            echo "KPanel 更新状态目录必须由 root 独占（0700）。" >&2
            return 1
        }
    done
}

kpanel_prepare_automatic_storage() {
    local state_dir="/home/docker/kpanel/update-state"
    local backup_dir="${state_dir}/backups"
    local path=""
    local parent=""
    local owner=""
    local mode=""

    for path in "${state_dir}" "${backup_dir}"; do
        parent="$(dirname "${path}")" || return 1
        if [ -e "${path}" ] || [ -L "${path}" ]; then
            [ -d "${path}" ] && [ ! -L "${path}" ] || {
                echo "KPanel 更新状态路径不安全，拒绝覆盖。" >&2
                return 1
            }
            owner="$(stat -c '%u' "${path}" 2>/dev/null)" || return 1
            mode="$(stat -c '%a' "${path}" 2>/dev/null)" || return 1
            [ "${owner}" = 0 ] && [ "${mode}" = 700 ] || {
                echo "KPanel 更新状态目录必须由 root 独占（0700）。" >&2
                return 1
            }
        else
            [ -d "${parent}" ] && [ ! -L "${parent}" ] || return 1
            mkdir -m 700 "${path}" || return 1
            chown root:root "${path}" || return 1
        fi
    done
    kpanel_validate_automatic_storage
}

kpanel_restore_file() {
    local source="$1"
    local destination="$2"
    local temporary="${destination}.restore.$$.$RANDOM"

    [ -f "${source}" ] && [ ! -L "${source}" ] || return 1
    rm -f "${temporary}"
    if ! cp -p "${source}" "${temporary}" ||
        ! mv -f "${temporary}" "${destination}"; then
        rm -f "${temporary}"
        return 1
    fi
}

kpanel_restore_runtime_rollbacks() {
    local script_preexisted="$1"
    local lifecycle_preexisted="$2"
    local update_units_preexisted="$3"
    local app_dir="/home/docker/kpanel"
    local required=""

    for required in \
        "${app_dir}/bin/kejilion-agent.rollback" \
        "${app_dir}/docker-compose.yml.rollback" \
        "${app_dir}/.env.rollback" \
        "${app_dir}/kejilion-agent.service.rollback" \
        "${app_dir}/agent.env.rollback"
    do
        [ -f "${required}" ] && [ ! -L "${required}" ] || {
            echo "更新缺少必要的运行时回退文件，已停止恢复。" >&2
            return 1
        }
    done
    if [ "${KPANEL_INIT_SYSTEM}" = openrc ]; then
        [ -f "${app_dir}/kejilion-agent.openrc.rollback" ] &&
            [ ! -L "${app_dir}/kejilion-agent.openrc.rollback" ] || return 1
    fi
    if [ "${script_preexisted}" = true ]; then
        [ -f "${app_dir}/bin/kejilion.sh.rollback" ] &&
            [ ! -L "${app_dir}/bin/kejilion.sh.rollback" ] || return 1
    fi
    if [ "${lifecycle_preexisted}" = true ]; then
        [ -f "${app_dir}/bin/kpanel.conf.rollback" ] &&
            [ ! -L "${app_dir}/bin/kpanel.conf.rollback" ] || return 1
    fi
    if [ "${update_units_preexisted}" = true ]; then
        [ -f "${app_dir}/kejilion-panel-update.service.rollback" ] &&
            [ ! -L "${app_dir}/kejilion-panel-update.service.rollback" ] &&
            [ -f "${app_dir}/kejilion-panel-update.timer.rollback" ] &&
            [ ! -L "${app_dir}/kejilion-panel-update.timer.rollback" ] || return 1
    fi

    kpanel_restore_file "${app_dir}/bin/kejilion-agent.rollback" \
        "${app_dir}/bin/kejilion-agent" || return 1
    if [ "${script_preexisted}" = true ]; then
        kpanel_restore_file "${app_dir}/bin/kejilion.sh.rollback" \
            "${app_dir}/bin/kejilion.sh" || return 1
    else
        rm -f "${app_dir}/bin/kejilion.sh"
    fi
    if [ "${lifecycle_preexisted}" = true ]; then
        kpanel_restore_file "${app_dir}/bin/kpanel.conf.rollback" \
            "${app_dir}/bin/kpanel.conf" || return 1
    else
        rm -f "${app_dir}/bin/kpanel.conf"
    fi
    kpanel_restore_file "${app_dir}/docker-compose.yml.rollback" \
        "${app_dir}/docker-compose.yml" || return 1
    kpanel_restore_file "${app_dir}/.env.rollback" "${app_dir}/.env" || return 1
    kpanel_restore_file "${app_dir}/kejilion-agent.service.rollback" \
        "${app_dir}/kejilion-agent.service" || return 1
    kpanel_restore_file "${app_dir}/agent.env.rollback" "${app_dir}/agent.env" || return 1
    if [ "${KPANEL_INIT_SYSTEM}" = openrc ]; then
        kpanel_restore_file "${app_dir}/kejilion-agent.openrc.rollback" \
            "${app_dir}/kejilion-agent.openrc" || return 1
    fi
    if [ "${update_units_preexisted}" = true ]; then
        kpanel_restore_file "${app_dir}/kejilion-panel-update.service.rollback" \
            "${app_dir}/kejilion-panel-update.service" || return 1
        kpanel_restore_file "${app_dir}/kejilion-panel-update.timer.rollback" \
            "${app_dir}/kejilion-panel-update.timer" || return 1
    elif [ "${KPANEL_INIT_SYSTEM}" = systemd ]; then
        kpanel_systemctl disable --now kejilion-panel-update.timer >/dev/null 2>&1 || true
        kpanel_remove_managed_unit_link kejilion-panel-update.timer \
            "${app_dir}/kejilion-panel-update.timer"
        kpanel_remove_managed_unit_link kejilion-panel-update.service \
            "${app_dir}/kejilion-panel-update.service"
        rm -f "${app_dir}/kejilion-panel-update.service" \
            "${app_dir}/kejilion-panel-update.timer"
    fi
    rm -f "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion.sh.new" \
        "${app_dir}/bin/kpanel.conf.new"
}

kpanel_transaction_value() {
    local field="$1"
    local transaction_dir="/home/docker/kpanel/update-state/transaction"
    local value=""

    case "${field}" in
        id|phase|previous-image-id|target-image-id|target-version|target-image|script-preexisted|lifecycle-preexisted|update-units-preexisted) ;;
        *) return 1 ;;
    esac
    [ -f "${transaction_dir}/${field}" ] && [ ! -L "${transaction_dir}/${field}" ] || return 1
    value="$(tr -d '\r\n' <"${transaction_dir}/${field}")" || return 1
    case "${field}" in
        id) printf '%s\n' "${value}" | grep -Eq '^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$' ;;
        phase) printf '%s\n' "${value}" | grep -Eq '^(preparing|prepared|swapping|verifying|restoring-data)$' ;;
        previous-image-id|target-image-id) printf '%s\n' "${value}" | grep -Eq '^sha256:[0-9a-f]{64}$' ;;
        target-version) kpanel_valid_release_version "${value}" ;;
        target-image) printf '%s\n' "${value}" | grep -Eq '^docker\.io/kjlion/kejilion-panel(:latest|@sha256:[0-9a-f]{64})$' ;;
        script-preexisted|lifecycle-preexisted|update-units-preexisted)
            printf '%s\n' "${value}" | grep -Eq '^(true|false)$'
            ;;
    esac >/dev/null || return 1
    printf '%s\n' "${value}"
}

kpanel_set_transaction_phase() {
    local phase="$1"
    local transaction_dir="/home/docker/kpanel/update-state/transaction"
    local temporary=""

    printf '%s\n' "${phase}" | grep -Eq '^(preparing|prepared|swapping|verifying|restoring-data)$' || return 1
    [ -d "${transaction_dir}" ] && [ ! -L "${transaction_dir}" ] || return 1
    temporary="$(mktemp "${transaction_dir}/.phase.XXXXXX")" || return 1
    if ! printf '%s\n' "${phase}" >"${temporary}" ||
        ! chmod 600 "${temporary}" ||
        ! mv -f "${temporary}" "${transaction_dir}/phase" ||
        ! sync; then
        rm -f "${temporary}"
        return 1
    fi
}

kpanel_begin_automatic_transaction() {
    local previous_image_id="$1"
    local target_version="$2"
    local target_image="$3"
    local script_preexisted="$4"
    local lifecycle_preexisted="$5"
    local update_units_preexisted="$6"
    local state_dir="/home/docker/kpanel/update-state"
    local transaction_dir="${state_dir}/transaction"
    local temporary=""
    local transaction_id=""
    local field=""
    local target_image_id=""

    target_image_id="$(docker image inspect --format '{{.Id}}' "${target_image}" 2>/dev/null)" || return 1
    printf '%s\n' "${target_image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || return 1
    [ ! -e "${transaction_dir}" ] || {
        echo "检测到尚未恢复的更新事务，拒绝覆盖。" >&2
        return 1
    }
    kpanel_validate_automatic_storage || return 1
    transaction_id="$(date -u +%Y%m%dT%H%M%SZ)-$$-${RANDOM}"
    printf '%s\n' "${transaction_id}" | grep -Eq '^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$' || return 1
    mkdir -p "${state_dir}/backups" || return 1
    chmod 700 "${state_dir}" "${state_dir}/backups" || return 1
    temporary="$(mktemp -d "${state_dir}/.transaction.XXXXXX")" || return 1
    if ! printf '%s\n' "${transaction_id}" >"${temporary}/id" ||
        ! printf '%s\n' preparing >"${temporary}/phase" ||
        ! printf '%s\n' "${previous_image_id}" >"${temporary}/previous-image-id" ||
        ! printf '%s\n' "${target_version}" >"${temporary}/target-version" ||
        ! printf '%s\n' "${target_image}" >"${temporary}/target-image" ||
        ! printf '%s\n' "${target_image_id}" >"${temporary}/target-image-id" ||
        ! printf '%s\n' "${script_preexisted}" >"${temporary}/script-preexisted" ||
        ! printf '%s\n' "${lifecycle_preexisted}" >"${temporary}/lifecycle-preexisted" ||
        ! printf '%s\n' "${update_units_preexisted}" >"${temporary}/update-units-preexisted"; then
        rm -rf "${temporary}"
        return 1
    fi
    for field in "${temporary}"/*; do
        chmod 600 "${field}" || {
            rm -rf "${temporary}"
            return 1
        }
    done
    chmod 700 "${temporary}" || {
        rm -rf "${temporary}"
        return 1
    }
    mv "${temporary}" "${transaction_dir}" && sync
}

kpanel_discard_automatic_transaction() {
    local state_dir="/home/docker/kpanel/update-state"
    local transaction_id=""
    local snapshot_dir=""

    [ -e "${state_dir}/transaction" ] || return 0
    transaction_id="$(kpanel_transaction_value id)" || return 1
    snapshot_dir="${state_dir}/backups/${transaction_id}"
    case "${snapshot_dir}" in
        "${state_dir}/backups/"*) ;;
        *) return 1 ;;
    esac
    rm -rf "${snapshot_dir}" || return 1
    kpanel_detach_automatic_transaction
}

kpanel_detach_automatic_transaction() {
    local state_dir="/home/docker/kpanel/update-state"
    local transaction_dir="${state_dir}/transaction"
    local detached="${state_dir}/.completed-transaction-$$-$RANDOM"

    [ -d "${transaction_dir}" ] && [ ! -L "${transaction_dir}" ] || return 1
    [ ! -e "${detached}" ] || return 1
    mv "${transaction_dir}" "${detached}" || return 1
    rm -rf "${detached}" || true
}

kpanel_prepare_automatic_snapshot() {
    local previous_image_id="$1"
    local target_version="$2"
    local target_image="$3"
    local script_preexisted="$4"
    local lifecycle_preexisted="$5"
    local update_units_preexisted="$6"
    local app_dir="/home/docker/kpanel"
    local transaction_id=""
    local snapshot_dir=""
    local data_kib=""
    local available_kib=""
    local required_kib=""
    local command_name=""

    for command_name in tar sha256sum du df awk date mktemp sync; do
        command -v "${command_name}" >/dev/null 2>&1 || {
            echo "更新缺少 ${command_name}，拒绝执行无法回退的数据变更。" >&2
            return 1
        }
    done
    kpanel_validate_automatic_storage || return 1
    [ -d "${app_dir}/data/panel" ] && [ ! -L "${app_dir}/data/panel" ] &&
        [ -d "${app_dir}/data/agent" ] && [ ! -L "${app_dir}/data/agent" ] || {
        echo "KPanel 数据目录不完整或不安全，拒绝更新。" >&2
        return 1
    }
    data_kib="$(du -sk "${app_dir}/data/panel" "${app_dir}/data/agent" 2>/dev/null |
        awk '{ total += $1 } END { print total + 0 }')" || return 1
    available_kib="$(df -Pk "${app_dir}" 2>/dev/null | awk 'END { print $4 }')" || return 1
    case "${data_kib}" in ''|*[!0-9]*) return 1 ;; esac
    case "${available_kib}" in ''|*[!0-9]*) return 1 ;; esac
    required_kib=$((data_kib + 65536))
    [ "${available_kib}" -ge "${required_kib}" ] || {
        echo "更新需要至少一份完整数据快照和 64 MiB 安全余量，当前磁盘空间不足。" >&2
        return 1
    }
    kpanel_begin_automatic_transaction "${previous_image_id}" "${target_version}" \
        "${target_image}" "${script_preexisted}" "${lifecycle_preexisted}" \
        "${update_units_preexisted}" || return 1
    transaction_id="$(kpanel_transaction_value id)" || return 1
    snapshot_dir="${app_dir}/update-state/backups/${transaction_id}"
    mkdir -m 700 "${snapshot_dir}" || return 1

    # Both writers must be stopped before reading SQLite/WAL and credential files.
    # Leave failed preparation attached: recovery restores a pulled latest tag before restart.
    kpanel_agent_service_stop && docker compose --env-file .env stop panel || return 1
    tar -C "${app_dir}" -cpf "${snapshot_dir}/data.tar" data/panel data/agent &&
        chmod 600 "${snapshot_dir}/data.tar" &&
        sha256sum "${snapshot_dir}/data.tar" >"${snapshot_dir}/data.sha256" &&
        chmod 600 "${snapshot_dir}/data.sha256" &&
        sha256sum -c "${snapshot_dir}/data.sha256" >/dev/null &&
        kpanel_set_transaction_phase prepared
}

kpanel_restore_automatic_data() {
    local app_dir="/home/docker/kpanel"
    local transaction_id=""
    local snapshot_dir=""
    local restore_root=""
    local rollback_root=""
    local expected_digest=""
    local actual_digest=""
    local name=""
    local entry=""

    transaction_id="$(kpanel_transaction_value id)" || return 1
    snapshot_dir="${app_dir}/update-state/backups/${transaction_id}"
    restore_root="${app_dir}/update-state/.restore-${transaction_id}"
    rollback_root="${app_dir}/update-state/.restore-previous-${transaction_id}"
    [ -d "${snapshot_dir}" ] && [ ! -L "${snapshot_dir}" ] &&
        [ -f "${snapshot_dir}/data.tar" ] && [ ! -L "${snapshot_dir}/data.tar" ] &&
        [ -f "${snapshot_dir}/data.sha256" ] && [ ! -L "${snapshot_dir}/data.sha256" ] || return 1
    expected_digest="$(awk 'NR == 1 { print $1 }' "${snapshot_dir}/data.sha256")" || return 1
    printf '%s\n' "${expected_digest}" | grep -Eq '^[0-9a-f]{64}$' || return 1
    actual_digest="$(sha256sum "${snapshot_dir}/data.tar" | awk '{ print $1 }')" || return 1
    [ "${actual_digest}" = "${expected_digest}" ] || {
        echo "更新数据快照校验失败，拒绝使用损坏的备份。" >&2
        return 1
    }
    kpanel_set_transaction_phase restoring-data || return 1
    rm -rf "${restore_root}" || return 1
    mkdir -m 700 "${restore_root}" || return 1
    tar -C "${restore_root}" -xpf "${snapshot_dir}/data.tar" || return 1
    [ -d "${restore_root}/data" ] && [ ! -L "${restore_root}/data" ] &&
        [ -d "${restore_root}/data/panel" ] && [ ! -L "${restore_root}/data/panel" ] &&
        [ -d "${restore_root}/data/agent" ] && [ ! -L "${restore_root}/data/agent" ] || return 1
    for entry in "${restore_root}"/*; do
        [ "${entry}" = "${restore_root}/data" ] || return 1
    done
    for entry in "${restore_root}/data"/*; do
        case "${entry}" in
            "${restore_root}/data/panel"|"${restore_root}/data/agent") ;;
            *) return 1 ;;
        esac
    done
    if [ -e "${rollback_root}" ]; then
        [ -d "${rollback_root}" ] && [ ! -L "${rollback_root}" ] || return 1
    else
        mkdir -m 700 "${rollback_root}" || return 1
    fi
    for name in panel agent; do
        if [ ! -e "${rollback_root}/${name}" ]; then
            [ -d "${app_dir}/data/${name}" ] && [ ! -L "${app_dir}/data/${name}" ] || return 1
            mv "${app_dir}/data/${name}" "${rollback_root}/${name}" || return 1
        fi
        if [ ! -e "${app_dir}/data/${name}" ]; then
            mv "${restore_root}/data/${name}" "${app_dir}/data/${name}" || return 1
        fi
    done
    [ -d "${app_dir}/data/panel" ] && [ ! -L "${app_dir}/data/panel" ] &&
        [ -d "${app_dir}/data/agent" ] && [ ! -L "${app_dir}/data/agent" ] || return 1
    rm -rf "${restore_root}" "${rollback_root}"
}

kpanel_wait_stable() {
    local pass=0

    while [ "${pass}" -lt 3 ]; do
        kpanel_wait_ready || return 1
        pass=$((pass + 1))
        [ "${pass}" -ge 3 ] || sleep 5
    done
}

kpanel_automatic_target_ready() {
    local target_version="$1"
    local target_image="$2"
    local app_dir="/home/docker/kpanel"
    local agent_version=""
    local container_version=""
    local expected_image_id=""
    local running_image_id=""

    printf '%s\n' "${target_image}" |
        grep -Eq '^docker\.io/kjlion/kejilion-panel(:latest|@sha256:[0-9a-f]{64})$' || return 1
    [ "$(grep -Fxc "    image: ${target_image}" "${app_dir}/docker-compose.yml")" -eq 1 ] || return 1
    expected_image_id="$(docker image inspect --format '{{.Id}}' "${target_image}" 2>/dev/null)" || return 1
    # New transactions freeze the pulled image ID; legacy digest transactions remain readable.
    if [ -e "${app_dir}/update-state/transaction/target-image-id" ] ||
        [ -L "${app_dir}/update-state/transaction/target-image-id" ]; then
        expected_image_id="$(kpanel_transaction_value target-image-id)" || return 1
    fi
    running_image_id="$(docker inspect --format '{{.Image}}' kejilion-panel 2>/dev/null)" || return 1
    printf '%s\n' "${expected_image_id}" | grep -Eq '^sha256:[0-9a-f]{64}$' || return 1
    [ "${running_image_id}" = "${expected_image_id}" ] || return 1
    agent_version="$("${app_dir}/bin/kejilion-agent" version 2>/dev/null | awk '{ print $1 }')" || return 1
    container_version="$(docker inspect --format \
        '{{index .Config.Labels "org.opencontainers.image.version"}}' \
        kejilion-panel 2>/dev/null)" || return 1
    [ "${agent_version}" = "${target_version}" ] &&
        [ "${container_version}" = "${target_version}" ] &&
        kpanel_wait_stable
}

kpanel_prune_automatic_backups() {
    local backup_root="/home/docker/kpanel/update-state/backups"
    local directory=""
    local name=""
    local retained=0
    local listing=""

    [ -d "${backup_root}" ] && [ ! -L "${backup_root}" ] || return 1
    listing="$(mktemp "${backup_root}/.prune.XXXXXX")" || return 1
    if ! find "${backup_root}" -mindepth 1 -maxdepth 1 -type d 2>/dev/null |
        sort -r >"${listing}"; then
        rm -f "${listing}"
        return 1
    fi
    while IFS= read -r directory; do
        [ -n "${directory}" ] || continue
        name="$(basename "${directory}")"
        printf '%s\n' "${name}" | grep -Eq '^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$' || continue
        retained=$((retained + 1))
        [ "${retained}" -le 2 ] || rm -rf "${backup_root:?}/${name}"
    done <"${listing}"
    rm -f "${listing}"
}

kpanel_complete_automatic_transaction() {
    local transaction_dir="/home/docker/kpanel/update-state/transaction"

    [ -d "${transaction_dir}" ] && [ ! -L "${transaction_dir}" ] || return 1
    kpanel_transaction_value id >/dev/null || return 1
    command -v sync >/dev/null 2>&1 && sync || return 1
    kpanel_detach_automatic_transaction || return 1
    kpanel_prune_automatic_backups || true
}

kpanel_recover_automatic_update() {
    local app_dir="/home/docker/kpanel"
    local transaction_dir="${app_dir}/update-state/transaction"
    local phase=""
    local target_version=""
    local target_image=""
    local previous_image_id=""
    local script_preexisted=""
    local lifecycle_preexisted=""
    local update_units_preexisted=""

    if [ "${KJ_KPANEL_LIFECYCLE_LOCK_HELD:-0}" != 1 ]; then
        kpanel_with_lifecycle_lock kpanel_recover_automatic_update
        return $?
    fi
    [ -e "${transaction_dir}" ] || return 0
    kpanel_detect_init_system && kpanel_validate_automatic_storage || return 1
    [ -d "${transaction_dir}" ] && [ ! -L "${transaction_dir}" ] || return 1
    phase="$(kpanel_transaction_value phase)" || return 1
    target_version="$(kpanel_transaction_value target-version)" || return 1
    previous_image_id="$(kpanel_transaction_value previous-image-id)" || return 1
    target_image="$(kpanel_transaction_value target-image)" || return 1
    script_preexisted="$(kpanel_transaction_value script-preexisted)" || return 1
    lifecycle_preexisted="$(kpanel_transaction_value lifecycle-preexisted)" || return 1
    update_units_preexisted="$(kpanel_transaction_value update-units-preexisted)" || return 1

    if [ "${phase}" = verifying ] && [ "${KJ_KPANEL_FORCE_ROLLBACK:-0}" != 1 ] &&
        kpanel_automatic_target_ready "${target_version}" "${target_image}"; then
        kpanel_complete_automatic_transaction || return 1
        kpanel_clear_update_files || true
        echo "已确认中断前的 KPanel 更新实际完成。"
        return 0
    fi

    echo "检测到未完成的 KPanel 更新，正在恢复更新前版本与数据..."
    cd "${app_dir}" || return 1
    if ! kpanel_agent_service_stop || ! docker compose --env-file .env stop panel; then
        echo "无法停止 KPanel 数据写入，事务与备份已保留，拒绝恢复数据。" >&2
        return 1
    fi
    # Once rollback starts, a retry must not mistake a healthy old runtime for
    # a completed same-version update while data restoration is still pending.
    if [ "${phase}" != preparing ]; then
        kpanel_set_transaction_phase restoring-data || return 1
    fi
    kpanel_restore_runtime_rollbacks "${script_preexisted}" "${lifecycle_preexisted}" \
        "${update_units_preexisted}" || return 1
    if [ "${phase}" != preparing ]; then
        kpanel_restore_automatic_data || return 1
    fi
    if [ "${target_image}" = docker.io/kjlion/kejilion-panel:latest ]; then
        kpanel_restore_image_tag "${previous_image_id}" "${target_image}" || return 1
    fi
    if ! kpanel_agent_service_reload ||
        ! kpanel_agent_service_start ||
        ! docker compose --env-file .env up -d --force-recreate ||
        ! kpanel_wait_stable; then
        echo "自动回退未能恢复健康状态，事务快照已保留，请人工检查。" >&2
        return 1
    fi
    if [ "${phase}" = preparing ]; then
        kpanel_discard_automatic_transaction || return 1
    else
        kpanel_complete_automatic_transaction || return 1
    fi
    kpanel_clear_update_files || true
    echo "更新未完成，已恢复原 KPanel 版本与更新前数据。"
}

kpanel_trusted_proxy_cidrs() {
    local internal_subnet=""
    local egress_gateway=""
    local gateway_prefix=""

    internal_subnet="$(docker network inspect --format '{{(index .IPAM.Config 0).Subnet}}' \
        kejilion-panel-internal 2>/dev/null)" || return 1
    egress_gateway="$(docker network inspect --format '{{(index .IPAM.Config 0).Gateway}}' \
        kejilion-panel-egress 2>/dev/null)" || return 1
    [ -n "${internal_subnet}" ] && [ -n "${egress_gateway}" ] || return 1
    case "${egress_gateway}" in
        *:*) gateway_prefix="128" ;;
        *.*) gateway_prefix="32" ;;
        *) return 1 ;;
    esac
    printf '127.0.0.0/8,::1/128,%s,%s/%s\n' \
        "${internal_subnet}" "${egress_gateway}" "${gateway_prefix}"
}

kpanel_refresh_trusted_proxy_network() {
    local app_dir="/home/docker/kpanel"
    local trusted_proxy_cidrs=""
    local env_tmp="${app_dir}/.env.new.$$"

    trusted_proxy_cidrs="$(kpanel_trusted_proxy_cidrs)" || return 1
    awk -v cidrs="${trusted_proxy_cidrs}" '
        BEGIN { replaced = 0 }
        /^KPANEL_TRUSTED_PROXY_CIDRS=/ {
            print "KPANEL_TRUSTED_PROXY_CIDRS=" cidrs
            replaced = 1
            next
        }
        { print }
        END {
            if (!replaced) print "KPANEL_TRUSTED_PROXY_CIDRS=" cidrs
        }
    ' "${app_dir}/.env" >"${env_tmp}" || {
        rm -f "${env_tmp}"
        return 1
    }
    if ! chmod 600 "${env_tmp}" || ! mv "${env_tmp}" "${app_dir}/.env"; then
        rm -f "${env_tmp}"
        return 1
    fi
}

kpanel_report_failed_install() {
    local app_dir="/home/docker/kpanel"

    echo "KPanel 健康检查失败，以下为安装清理前的诊断信息："
    echo "----- Agent readiness -----"
    if [ -x "${app_dir}/bin/kejilion-agent" ]; then
        KEJILION_AGENT_SOCKET="${app_dir}/run/agent.sock" \
            KEJILION_AGENT_TOKEN_FILE="${app_dir}/secrets/agent.token" \
            "${app_dir}/bin/kejilion-agent" healthcheck 2>&1 || true
    fi
    echo "----- Agent service status -----"
    if [ "${KPANEL_INIT_SYSTEM:-}" = systemd ]; then
        kpanel_systemctl --no-pager --full status kejilion-agent.service 2>&1 || true
    else
        kpanel_openrc_tool rc-service kejilion-agent status 2>&1 || true
    fi
    if [ "${KPANEL_INIT_SYSTEM:-}" = systemd ] && command -v journalctl >/dev/null 2>&1; then
        echo "----- recent Agent journal -----"
        journalctl --no-pager -n 40 -u kejilion-agent.service 2>&1 || true
    elif [ -f /var/log/messages ]; then
        echo "----- recent Agent syslog -----"
        grep -F 'kejilion-agent' /var/log/messages 2>/dev/null | tail -n 40 || true
    fi
    echo "----- Panel container status -----"
    docker inspect --format \
        'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
        kejilion-panel 2>&1 || true
}

kpanel_direct_public_host() {
    if declare -F ip_address >/dev/null 2>&1; then
        ip_address >/dev/null 2>&1 || true
    fi
    if [ -n "${ipv4_address:-}" ]; then
        printf '%s\n' "${ipv4_address}"
    elif [ -n "${ipv6_address:-}" ]; then
        printf '[%s]\n' "${ipv6_address}"
    else
        printf '%s\n' '127.0.0.1'
    fi
}

kpanel_cleanup_failed_install() {
    local app_dir="/home/docker/kpanel"
    local remove_group="${1:-false}"

    if [ -f "${app_dir}/docker-compose.yml" ]; then
        (
            cd "${app_dir}" &&
                docker compose --env-file .env down >/dev/null 2>&1
        ) || true
    fi
    if [ -n "${KPANEL_INIT_SYSTEM:-}" ]; then
        kpanel_update_service_disable_stop >/dev/null 2>&1 || true
        kpanel_update_service_unlink
        kpanel_agent_service_disable_stop >/dev/null 2>&1 || true
        kpanel_agent_service_unlink
        kpanel_agent_service_reload >/dev/null 2>&1 || true
    fi
    rm -rf "${app_dir}"
    if [ "${remove_group}" = true ]; then
        kpanel_system_group_delete kejilion-panel >/dev/null 2>&1 || true
    fi
}

# --- 核心逻辑 / Core Logic ---
kpanel_docker_app_install_unlocked() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:latest"
    local bootstrap_token=""
    local panel_gid=""
    local trusted_proxy_cidrs=""
    local public_host=""
    local group_created=false

    [ "$(id -u)" -eq 0 ] || {
        echo "KPanel 安装需要 root 权限。"
        return 1
    }
    kpanel_detect_init_system || {
        echo "KPanel Host Agent 需要 systemd 或 OpenRC，当前系统不支持。"
        return 1
    }
    if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
        echo "请先安装 Docker 与 Docker Compose 插件。"
        return 1
    fi
    [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ] || {
        echo "KPanel 当前仅支持 amd64 与 arm64。"
        return 1
    }
    # Only an empty real directory is safe to discard before a fresh install.
    if [ -d "${app_dir}" ] && [ ! -L "${app_dir}" ]; then
        rmdir "${app_dir}" 2>/dev/null || true
    fi
    [ ! -e "${app_dir}" ] && [ ! -L "${app_dir}" ] &&
        [ ! -e /etc/systemd/system/kejilion-agent.service ] &&
        [ ! -L /etc/systemd/system/kejilion-agent.service ] &&
        [ ! -e /etc/init.d/kejilion-agent ] && [ ! -L /etc/init.d/kejilion-agent ] || {
        echo "检测到 KPanel 数据目录或 Agent 服务残留。保留数据请选择更新；重新安装请先卸载。"
        return 1
    }
    [ -z "$(docker ps -a --filter name='^/kejilion-panel$' --format '{{.Names}}')" ] || {
        echo "检测到同名容器，拒绝覆盖。"
        return 1
    }
    for panel_network in kejilion-panel-network kejilion-panel-internal kejilion-panel-egress; do
        ! docker network inspect "${panel_network}" >/dev/null 2>&1 || {
            echo "检测到同名 Docker 网络，拒绝覆盖。"
            return 1
        }
    done
    [[ "${docker_port}" =~ ^[0-9]+$ ]] && [ "${docker_port}" -ge 1 ] && [ "${docker_port}" -le 65535 ] || {
        echo "端口必须是 1-65535 的整数。"
        return 1
    }

    if ! getent group kejilion-panel >/dev/null 2>&1; then
        kpanel_system_group_add kejilion-panel || return 1
        group_created=true
    fi
    panel_gid="$(getent group kejilion-panel | cut -d: -f3)"
    [ -n "${panel_gid}" ] || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }

    if ! mkdir -p "${app_dir}/bin" "${app_dir}/data/panel" "${app_dir}/data/agent" \
        "${app_dir}/run" "${app_dir}/secrets" "${app_dir}/update-state/backups"
    then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    if ! touch "${app_dir}/.managed-by-kejilion-app" ||
        ! chmod 600 "${app_dir}/.managed-by-kejilion-app"; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    if ! chown -R 65532:65532 "${app_dir}/data/panel" ||
        ! chown -R root:"${panel_gid}" "${app_dir}/data/agent" "${app_dir}/run" "${app_dir}/secrets" ||
        ! chown -R root:root "${app_dir}/update-state" ||
        ! chmod 750 "${app_dir}" "${app_dir}/bin" "${app_dir}/data" \
            "${app_dir}/data/agent" "${app_dir}/run" "${app_dir}/secrets" ||
        ! chmod 700 "${app_dir}/update-state" "${app_dir}/update-state/backups" ||
        ! chmod 700 "${app_dir}/data/panel"; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    if ! docker pull "${panel_image}" ||
        ! kpanel_extract_release "${panel_image}" \
            "${app_dir}/bin/kejilion-agent" "${app_dir}/bin/kejilion.sh" \
            "${app_dir}/bin/kpanel.conf" ||
        ! kpanel_create_agent_token "${panel_gid}" ||
        ! kpanel_write_compose "${panel_gid}" "${panel_image}" ||
        ! kpanel_write_agent_service ||
        ! kpanel_write_update_units; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    public_host="$(kpanel_direct_public_host)" || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }

    cat <<EOF > "${app_dir}/.env"
KPANEL_PUBLIC_URL=http://${public_host}:${docker_port}
KPANEL_SECURE_COOKIE=false
KPANEL_ALLOW_IP_HOSTS=true
KPANEL_TRUSTED_PROXY_CIDRS=127.0.0.0/8,::1/128
EOF
    chmod 600 "${app_dir}/.env"

    cd "${app_dir}" || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    if ! docker compose --env-file .env create; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    trusted_proxy_cidrs="$(kpanel_trusted_proxy_cidrs)" || {
        echo "无法识别 KPanel Docker 网络，安装已停止。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    cat <<EOF > "${app_dir}/.env"
KPANEL_PUBLIC_URL=http://${public_host}:${docker_port}
KPANEL_SECURE_COOKIE=false
KPANEL_ALLOW_IP_HOSTS=true
KPANEL_TRUSTED_PROXY_CIDRS=${trusted_proxy_cidrs}
EOF
    chmod 600 "${app_dir}/.env"

    if ! kpanel_agent_service_link ||
        ! kpanel_update_service_link ||
        ! kpanel_agent_service_reload ||
        ! kpanel_agent_service_enable_start ||
        ! kpanel_update_service_enable_start ||
        ! docker compose --env-file .env up -d --force-recreate; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    if ! kpanel_wait_ready; then
        kpanel_report_failed_install
        kpanel_cleanup_failed_install "${group_created}"
        echo "KPanel 安装失败，已清理本次创建的服务和文件；请根据上方诊断修复后重试。"
        return 1
    fi
    bootstrap_token="$(tr -d '\r\n' < "${app_dir}/data/panel/bootstrap.token" 2>/dev/null)" || {
        echo "KPanel 初始化凭证读取失败，安装已停止。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    [ -n "${bootstrap_token}" ] || {
        echo "KPanel 初始化凭证为空，安装已停止。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }

    echo "KPanel 安装完成 / Install Complete"
    check_docker_app_ip
    echo "首次初始化 Token：${bootstrap_token}"
    echo "请复制此 Token 完成管理员账户初始化；初始化成功后 Token 自动失效。"
    echo "添加 HTTPS 域名：k fd panel.example.com 127.0.0.1 ${docker_port}"
}

kpanel_docker_app_update_common_unlocked() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:latest"
    local panel_gid=""
    local previous_image_id=""
    local previous_host_port=""
    local automatic=false
    local target_version=""
    local script_preexisted=false
    local lifecycle_preexisted=false
    local update_units_preexisted=false
    local required_file=""

    [ "$(id -u)" -eq 0 ] || {
        echo "KPanel 更新需要 root 权限。"
        return 1
    }
    case "${KJ_KPANEL_AUTOMATIC:-0}" in
        0)
            [ -z "${KJ_KPANEL_TARGET_VERSION:-}" ] &&
                [ -z "${KJ_KPANEL_TARGET_IMAGE:-}" ] || {
                echo "非自动更新拒绝接收自动更新目标参数。" >&2
                return 1
            }
            ;;
        1)
            [ "${KPANEL_INIT_SYSTEM}" = systemd ] || {
                echo "自动更新调度仅支持 systemd。" >&2
                return 1
            }
            target_version="${KJ_KPANEL_TARGET_VERSION:-}"
            panel_image="${KJ_KPANEL_TARGET_IMAGE:-}"
            kpanel_valid_release_version "${target_version}" &&
                printf '%s\n' "${panel_image}" |
                    grep -Eq '^docker\.io/kjlion/kejilion-panel@sha256:[0-9a-f]{64}$' || {
                echo "更新目标必须是官方不可变的稳定版或 RC 预览版镜像。" >&2
                return 1
            }
            automatic=true
            ;;
        *)
            echo "KJ_KPANEL_AUTOMATIC 只允许 0 或 1。" >&2
            return 1
            ;;
    esac

    if [ -e "${app_dir}/update-state/transaction" ]; then
        kpanel_recover_automatic_update || return 1
    fi

    [ -f "${app_dir}/.managed-by-kejilion-app" ] &&
        [ ! -L "${app_dir}/.managed-by-kejilion-app" ] &&
        [ -f "${app_dir}/docker-compose.yml" ] &&
        [ ! -L "${app_dir}/docker-compose.yml" ] &&
        kpanel_agent_service_managed || {
        echo "当前 KPanel 不是由 kejilion.sh 应用市场安装，拒绝更新。"
        return 1
    }
    kpanel_prepare_automatic_storage || return 1
    panel_gid="$(getent group kejilion-panel | cut -d: -f3)"
    [ -n "${panel_gid}" ] || return 1
    previous_image_id="$(kpanel_running_image_id)" || return 1
    previous_host_port="$(kpanel_running_host_port)" || return 1
    docker_port="${previous_host_port}"
    kpanel_ensure_runtime_env false || return 1
    kpanel_preflight_docker_port_publish "${previous_image_id}" || return 1

    cd "${app_dir}" || return 1
    kpanel_clear_update_files || return 1
    if ! docker pull "${panel_image}"; then
        if [ "${automatic}" = false ]; then
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
        fi
        return 1
    fi
    kpanel_extract_release "${panel_image}" \
        "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion.sh.new" \
        "${app_dir}/bin/kpanel.conf.new" "${target_version}" || {
        if [ "${automatic}" = false ]; then
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
        fi
        return 1
    }

    if [ "${automatic}" = false ]; then
        target_version="$("${app_dir}/bin/kejilion-agent.new" version | awk '{ print $1 }')"
        kpanel_valid_release_version "${target_version}" || {
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
            kpanel_clear_update_files || true
            return 1
        }
    fi

    for required_file in \
        "${app_dir}/bin/kejilion-agent" \
        "${app_dir}/docker-compose.yml" \
        "${app_dir}/.env" \
        "${app_dir}/kejilion-agent.service" \
        "${app_dir}/agent.env"
    do
        [ -f "${required_file}" ] && [ ! -L "${required_file}" ] || {
            echo "KPanel 运行时文件不完整或不安全，拒绝更新。" >&2
            kpanel_clear_update_files || true
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            return 1
        }
    done
    cp -p "${app_dir}/bin/kejilion-agent" "${app_dir}/bin/kejilion-agent.rollback" || {
        kpanel_clear_update_files || true
        if [ "${automatic}" = false ]; then
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
        fi
        return 1
    }
    if [ -e "${app_dir}/bin/kejilion.sh" ]; then
        [ -f "${app_dir}/bin/kejilion.sh" ] && [ ! -L "${app_dir}/bin/kejilion.sh" ] || {
            kpanel_clear_update_files || true
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            return 1
        }
        cp -p "${app_dir}/bin/kejilion.sh" "${app_dir}/bin/kejilion.sh.rollback" || {
            kpanel_clear_update_files || true
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            return 1
        }
        script_preexisted=true
    fi
    if [ -e "${app_dir}/bin/kpanel.conf" ]; then
        [ -f "${app_dir}/bin/kpanel.conf" ] && [ ! -L "${app_dir}/bin/kpanel.conf" ] || {
            kpanel_clear_update_files || true
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            return 1
        }
        cp -p "${app_dir}/bin/kpanel.conf" "${app_dir}/bin/kpanel.conf.rollback" || {
            kpanel_clear_update_files || true
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            return 1
        }
        lifecycle_preexisted=true
    fi
    if [ -e "${app_dir}/kejilion-panel-update.service" ] ||
        [ -e "${app_dir}/kejilion-panel-update.timer" ]; then
        [ -f "${app_dir}/kejilion-panel-update.service" ] &&
            [ ! -L "${app_dir}/kejilion-panel-update.service" ] &&
            [ -f "${app_dir}/kejilion-panel-update.timer" ] &&
            [ ! -L "${app_dir}/kejilion-panel-update.timer" ] || {
            echo "KPanel 自动更新 systemd 单元不完整或不安全，拒绝覆盖。" >&2
            kpanel_clear_update_files || true
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            return 1
        }
        if ! cp -p "${app_dir}/kejilion-panel-update.service" \
            "${app_dir}/kejilion-panel-update.service.rollback" ||
            ! cp -p "${app_dir}/kejilion-panel-update.timer" \
                "${app_dir}/kejilion-panel-update.timer.rollback"; then
            kpanel_clear_update_files || true
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            return 1
        fi
        update_units_preexisted=true
    fi
    cp -p "${app_dir}/docker-compose.yml" "${app_dir}/docker-compose.yml.rollback" || {
        kpanel_clear_update_files || true
        if [ "${automatic}" = false ]; then
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
        fi
        return 1
    }
    cp -p "${app_dir}/.env" "${app_dir}/.env.rollback" || {
        kpanel_clear_update_files || true
        if [ "${automatic}" = false ]; then
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
        fi
        return 1
    }
    cp -p "${app_dir}/kejilion-agent.service" "${app_dir}/kejilion-agent.service.rollback" || {
        kpanel_clear_update_files || true
        if [ "${automatic}" = false ]; then
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
        fi
        return 1
    }
    cp -p "${app_dir}/agent.env" "${app_dir}/agent.env.rollback" || {
        kpanel_clear_update_files || true
        if [ "${automatic}" = false ]; then
            kpanel_abort_update "${previous_image_id}" "${panel_image}"
        fi
        return 1
    }

    if [ "${KPANEL_INIT_SYSTEM}" = openrc ] &&
        { [ ! -f "${app_dir}/kejilion-agent.openrc" ] ||
          [ -L "${app_dir}/kejilion-agent.openrc" ] ||
          ! cp -p "${app_dir}/kejilion-agent.openrc" "${app_dir}/kejilion-agent.openrc.rollback"; }; then
        kpanel_abort_update "${previous_image_id}" "${panel_image}"
        kpanel_clear_update_files || true
        return 1
    fi

    if ! kpanel_prepare_automatic_snapshot "${previous_image_id}" "${target_version}" \
        "${panel_image}" "${script_preexisted}" "${lifecycle_preexisted}" \
        "${update_units_preexisted}"; then
        if [ -e "${app_dir}/update-state/transaction" ]; then
            local KJ_KPANEL_FORCE_ROLLBACK=1
            kpanel_recover_automatic_update ||
                echo "更新备份准备失败，事务已保留，请人工检查。" >&2
        else
            if [ "${automatic}" = false ]; then
                kpanel_abort_update "${previous_image_id}" "${panel_image}"
            fi
            kpanel_clear_update_files || true
        fi
        return 1
    fi

    if kpanel_set_transaction_phase swapping &&
        kpanel_ensure_runtime_env &&
        kpanel_write_compose "${panel_gid}" "${panel_image}" &&
        kpanel_write_agent_service &&
        kpanel_write_update_units &&
        mv -f "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent" &&
        mv -f "${app_dir}/bin/kejilion.sh.new" "${app_dir}/bin/kejilion.sh" &&
        mv -f "${app_dir}/bin/kpanel.conf.new" "${app_dir}/bin/kpanel.conf" &&
        kpanel_set_transaction_phase verifying &&
        kpanel_enable_update_timer &&
        kpanel_agent_service_reload &&
        kpanel_agent_service_start &&
        docker compose --env-file .env up -d --force-recreate --remove-orphans &&
        kpanel_refresh_trusted_proxy_network &&
        docker compose --env-file .env up -d --force-recreate --remove-orphans &&
        kpanel_automatic_target_ready "${target_version}" "${panel_image}" &&
        kpanel_complete_automatic_transaction; then
        kpanel_clear_update_files || true
        docker network rm kejilion-panel-network >/dev/null 2>&1 || true
        kpanel_cleanup_old_images "$(kpanel_running_image_id 2>/dev/null || true)"
        if [ "${automatic}" = true ]; then
            echo "KPanel 自动更新完成 / Automatic Update Complete"
        else
            echo "KPanel 更新完成 / Update Complete"
        fi
        return 0
    fi

    echo "更新失败，正在恢复运行时与更新前数据..."
    local KJ_KPANEL_FORCE_ROLLBACK=1
    kpanel_recover_automatic_update ||
        echo "回退未能恢复健康状态，事务和快照已保留，请人工检查。" >&2
    return 1
}

kpanel_enable_update_timer() {
    local app_dir="/home/docker/kpanel"

    [ "${KPANEL_INIT_SYSTEM}" = systemd ] || return 0
    kpanel_link_managed_unit kejilion-panel-update.service \
        "${app_dir}/kejilion-panel-update.service" &&
        kpanel_link_managed_unit kejilion-panel-update.timer \
            "${app_dir}/kejilion-panel-update.timer" &&
        kpanel_systemctl daemon-reload &&
        kpanel_systemctl enable --now kejilion-panel-update.timer
}

kpanel_docker_app_update_unlocked() {
    kpanel_detect_init_system || {
        echo "KPanel Host Agent 需要 systemd 或 OpenRC，当前系统不支持。"
        return 1
    }
    case "${KPANEL_INIT_SYSTEM}" in
        openrc|systemd) kpanel_docker_app_update_common_unlocked "$@" ;;
        *) return 1 ;;
    esac
}

kpanel_docker_app_uninstall_unlocked() {
    local app_dir="/home/docker/kpanel"
    local agent_service="/etc/systemd/system/kejilion-agent.service"
    local existing_container=""
    local existing_networks="" panel_network="" network_state=""

    kpanel_detect_init_system || {
        echo "KPanel Host Agent 需要 systemd 或 OpenRC，当前系统不支持。"
        return 1
    }
    [ -f "${app_dir}/.managed-by-kejilion-app" ] && [ ! -L "${app_dir}" ] || {
        echo "无法确认 ${app_dir} 的安装归属，未删除文件。"
        return 1
    }
    [ "${KPANEL_INIT_SYSTEM}" != openrc ] || agent_service="/etc/init.d/kejilion-agent"
    if [ -e "${agent_service}" ] || [ -L "${agent_service}" ]; then
        kpanel_agent_service_managed || {
            echo "${agent_service} 不属于当前 KPanel，未执行卸载。"
            return 1
        }
    fi
    cd "${app_dir}" || return 1
    if [ -f docker-compose.yml ] && [ -f .env ]; then
        docker compose --env-file .env down --rmi all || {
            echo "KPanel 容器清理失败，已保留数据，请修复 Docker 后重试卸载。"
            return 1
        }
    else
        existing_container="$(docker ps -a --filter name='^/kejilion-panel$' --format '{{.Names}}')" || return 1
        [ -z "${existing_container}" ] || {
            echo "KPanel 容器仍存在但 Compose 配置不完整，已保留数据，请恢复配置后重试卸载。"
            return 1
        }
        existing_networks="$(docker network ls --format '{{.Name}}')" || return 1
        for panel_network in kejilion-panel-network kejilion-panel-internal kejilion-panel-egress; do
            grep -Fxq "${panel_network}" <<<"${existing_networks}" || continue
            network_state="$(docker network inspect --format '{{index .Labels "com.docker.compose.project"}}|{{len .Containers}}' "${panel_network}")" || return 1
            [ "${network_state}" = 'kpanel|0' ] || {
                echo "网络 ${panel_network} 归属不明或仍在使用，已保留数据。"
                return 1
            }
            docker network rm "${panel_network}" >/dev/null || {
                echo "网络 ${panel_network} 清理失败，已保留数据，请重试卸载。"
                return 1
            }
        done
    fi
    kpanel_update_service_disable_stop >/dev/null 2>&1 || true
    kpanel_update_service_unlink
    kpanel_agent_service_disable_stop >/dev/null 2>&1 || true
    kpanel_agent_service_unlink
    kpanel_agent_service_reload
    rm -rf "${app_dir}"
    kpanel_system_group_delete kejilion-panel >/dev/null 2>&1 || true
    echo "KPanel 已卸载，配置、审计记录与面板数据已清理。"
}

docker_app_install() {
    kpanel_with_lifecycle_lock kpanel_docker_app_install_unlocked "$@"
}

docker_app_update() {
    kpanel_with_lifecycle_lock kpanel_docker_app_update_unlocked "$@"
}

docker_app_uninstall() {
    kpanel_with_lifecycle_lock kpanel_docker_app_uninstall_unlocked "$@"
}

