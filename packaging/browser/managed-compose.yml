# Agent-managed optional component. No published ports or Docker socket access.
services:
  browser:
    image: docker.io/kjlion/kpanel-browser@sha256:37c0eb1c4a0e6408fe395e699687d405fe78d052669c32625e09a17a7e3165af
    container_name: kpanel-browser
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser-seccomp.json
    pids_limit: 512
    mem_limit: 1536m
    cpus: 1.5
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - type: bind
        source: __BROWSER_RUNTIME_DIRECTORY__
        target: /run/secrets
        read_only: true
    networks:
      browser-control:
        aliases: [browser]
      browser-egress: {}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  browser-control:
    external: true
    name: kejilion-panel-browser-control
  browser-egress: {}
