# Release KPanel

## Purpose

把 KPanel 的 L3 发布链路固化为可重复执行、可验证、可回滚的流程。链路包括发布画像、版本准备、
发布候选与主仓库 CI、GitHub Release、Docker Hub 多架构镜像、`latest` 提升、
`kejilion/apps` 应用市场契约核对、公开镜像端到端验收，以及隔离真机/生产证据和统一验收记录。

## Prerequisites

- 已阅读 `AGENTS.md`、`PROJECT_RULES.md` 和 `docs/project-management.md`，并取得用户对本次
  发布、推送的明确授权。
- 发布范围已经由协调中心按精确提交哈希确认；当前只有一个发布任务、一个候选 worktree 和
  一个候选分支。新功能继续在独立分支开发，不得进入已冻结候选。
- 发布任务已在协调中心声明唯一负责人、候选分支和精确提交清单；主要实现任务与最终验证/发布任务
  相互独立。多个 AI 可用时，优先由另一种智能体复核提交清单、风险和回滚点。
- 源码 fetch/push 统一使用 SSH 远端；GitHub Issue、PR、API、插件和 `gh` 登录不是发布候选分支的
  前置条件。GitHub Actions/Release 继续使用仓库内置临时 Token 完成远端自动化。
- `${{project_dir}}` 是本次发布使用的独立、干净 KPanel 工作树，远端为
  `kejilion/KPanel`；不得切换到其他并发会话的工作树执行。
- `${{apps_repo}}` 指向 `kejilion/apps` 本地仓库，默认 `C:\GitHub\kejilion\apps`；只有
  `packaging/kejilion-app/kpanel.conf` 的安装/更新契约发生变化时才需要写入该仓库。
- GitHub 仓库已配置 `DOCKERHUB_TOKEN` Secret；Token 对 `${{image}}` 具有 Read & Write 权限。
- GitHub 仓库变量 `DOCKERHUB_IMAGE`、`DOCKERHUB_USERNAME` 与目标 Docker Hub 仓库一致。
- `release.yml` 的 Docker 登录不得限定仅 push 的 Buildx `scope`，因为 `latest` 提升同时需要
  拉取和推送清单的权限。
- 保留所有无关未提交改动；只提交本次发布范围内的文件。
- `${{validation_environment}}` 和 `${{production_environment}}` 必须登记在 `environment-policy.json`；
  两者默认均为 `arena-154`。`prod-108`/`108` 已禁用全部 KPanel 操作，任何步骤都不得连接该目标。

## Steps

### 1. 预检发布状态

先列出活跃 KPanel 任务和 `git worktree list`，确认候选 worktree 未被其他任务使用，且发布范围
只包含协调中心批准的提交。再确认目标版本尚未作为正式 Release 发布、目标镜像标签尚未被占用，
并记录回滚点：

```bash
git fetch origin --no-tags refs/heads/main:refs/remotes/origin/main
git ls-remote origin refs/heads/main "refs/tags/v${{version}}" "refs/tags/v${{previous_version}}"
git status --short
git rev-parse HEAD
git rev-parse origin/main
git tag --list "v${{version}}"
node scripts/check-collaboration-state.mjs \
  --repo "${{project_dir}}" \
  --role writer \
  --base-ref origin/main \
  --require-clean
node scripts/check-environment-policy.mjs \
  --environment "${{validation_environment}}" \
  --purpose candidate-validation
```

同时检查 GitHub Release、Actions 和 Docker Hub 标签。不得覆盖已经发布的 Release、镜像或
可追溯版本；若版本已占用，必须提升版本号。把 `origin/main` 的提交记为发布基线；
正式推送前若远端已前移，必须停止并重新审计，不得顺带合入其他会话或功能的代码。

在冻结候选前按 `docs/release-acceptance-template.md` 建立发布画像，至少写明：

- 业务域和变更面（展示、只读、宿主机写入、协议/数据、部署）；
- 受影响核心用户旅程和未变化契约；
- 业务正确性、安全、稳定、性能/资源、用户体验、数据/迁移分别需要的证据；
- 哪些危险、付费或耗流量场景只在隔离真机执行，哪些生产动作已获得授权。

**Expected output:** 发布单写者成立，候选提交清单和基线明确，目标版本未占用，记录
`${{previous_version}}` 对应源码和镜像回滚点；发布画像能够解释必测项和不适用维度。

同时建立本次冻结执行方案：列出生产写前后实际调用的唯一仓库脚本、Runner/镜像、SSH 身份、必需
运行时、跨 Shell 参数承载方式和证据解析入口。所有必需项先在非生产环境预检；优先使用参数文件、
JSON 或仓库脚本传值，不在生产命令中嵌套临时 PowerShell/SSH/Shell 转义。未被固定入口声明和预检的
可选本机工具不得成为生产验收依赖。

预检按实际阶段一次列全必需能力并整体报告缺失项，避免执行到一半才逐个发现 `gofmt`、`jq`、
`sqlite3`、Shell 或解析器不存在。Go/Node/扫描器证据由固定 Linux Runner 产生，不要求 Windows 本机
临时补齐；最小容器不假设存在 Shell 或 `jq`；SQLite 校验必须在生产写前确认 `sqlite3` 或 Python
`sqlite3` 至少一条固定实现可用。读取 JSON/JSONL/审计证据前先保存一个真实脱敏样本并确认顶层类型、
字段和权威文件路径，再由仓库脚本或 Runner 解析，禁止在远端命令中猜字段名、文件名或拼接临时查询。

### 2. 准备一致的版本变更

将 `${{version}}` 同步到以下位置，并补充 `CHANGELOG.md`：

- `VERSION`
- `internal/version/version.go`（开发态使用 `${{version}}-dev`）
- `web/package.json`
- `web/package-lock.json`

检查：

```bash
git diff --check
git diff -- VERSION internal/version/version.go web/package.json \
  web/package-lock.json CHANGELOG.md
```

**Expected output:** 所有发行版本字段均为 `${{version}}`，没有空白错误或无关修改。

执行统一检查，禁止只靠人工比对：

```bash
bash scripts/check-version-consistency.sh
```

### 3. 执行 L3 发布前核验

进入本步骤即冻结候选。此后新增功能默认进入下一版本；若候选文件、分支或 `HEAD` 发生任何变化，
本轮 L3 结果作废，必须先按 `docs/project-management.md` 的冲突恢复流程重建候选，再重新核验。
冻结同时覆盖步骤 1 的执行方案；生产写操作开始后不得现场发明新 wrapper、首次引入本机 CLI 或改变
跨 Shell 参数格式。入口失效时先停止并保持/恢复服务健康，在非生产环境修复唯一入口和回归测试后，
从受影响层重跑；一次现场绕行不构成可复用流程。

远程 L3 只使用仓库外层入口 `scripts/run-release-l3.mjs`。它以无 Shell 拼接的进程参数完成：候选
SHA/干净状态、`origin` 稳定 Tag 与业务基线核对；自包含 bundle 的本地验证和离线克隆；固定摘要的
计划、bundle 与受检远端脚本上传；在临时 bare repository 内执行远端 bundle verify；解析不可变
Runner image ID，并调用内部唯一门禁 `scripts/run-release-gate.sh`。禁止另写本地 PowerShell/SSH
包装器或远端 L3 脚本：

```bash
node scripts/run-release-l3.mjs \
  --repo "${{project_dir}}" \
  --candidate <冻结的完整提交> \
  --base-tag "v${{previous_version}}" \
  --runner-image "${{runner_image}}" \
  --run-id "v${{version}}-<短SHA>-l3-r1" \
  --artifact-dir "<仓库外绝对路径>/v${{version}}-<短SHA>-l3-r1" \
  --target "${{validation_environment}}"
```

每次尝试使用新 `run-id` 和新证据目录，旧计划、日志和失败状态原样保留；不得覆盖后重写成首轮成功。
入口在任何前置条件失败时 fail-closed，候选代码未执行时记为流程异常而非产品失败。入口脚本自身需要
修复时先形成仓库提交与回归，再对新候选从受影响层重跑；不能在候选外现场改一份 wrapper 继续发布。

`make verify-release` 必须实际覆盖核心特权包 race、固定摘要 Trivy 源码/最终镜像扫描，以及
最终镜像构建；Release 工作流还必须在 `256 MiB`、`1 CPU`、`128 PID`、非 root、只读根、
`cap-drop ALL` 条件下启动候选镜像。任何一步未执行或失败都不得进入标签和发布阶段。

另外解析 `.github/workflows/ci.yml` 和 `.github/workflows/release.yml`，确认 YAML 有效，并复核：

- Release tag 必须与 `VERSION` 完全一致；
- Release 先保持 draft，镜像成功后才公开；
- 镜像平台包含 `linux/amd64` 和 `linux/arm64`；
- 稳定版本才提升 `latest`；
- Release action 和 Docker action 使用固定提交摘要。

按发布画像补充自动门禁不能代替的证据：受影响性能基准、桌面/窄视口、浅/深色、键盘/焦点、
多语言、失败状态、`kejilion.sh` 双向互通，以及 L2/L3 写路径的失败注入、重启恢复和回滚。
危险或破坏性写操作优先使用隔离真机，不为了生产形式完整主动改变无关业务数据。

界面变化同时按本地预览标准选择 `interaction`、`visual` 或 `visual-composition`。当多种实体、选中/加载
状态、徽章/浮层/固定栏会共存，或上一版本曾发生视觉逃逸时必须使用 `visual-composition`，在同一浏览器
场景验证受影响组合并保留自动回归；不接受把各元素分开截图后推断组合正确，也不要求无关页面跑全矩阵。

隔离容器网络默认让 Docker 自动分配，并读取实际 subnet/IP 生成受信边界；只有完成现有网络清单冲突
检查后才允许固定子网。不得因硬编码测试网段与并发任务冲突而把候选误判为失败。

真实 API/浏览器证据必须先校验响应 schema，再选择业务字段；页面优先提供稳定 `data-testid` 或结构化
状态。只能使用文案时必须精确匹配并断言唯一。业务成功以服务端状态、目标文件/数据库记录等
**持久业务结果**为主证据，Toast/瞬时浮层只作辅助；浏览器差异导致提示提前消失时，不得覆盖已经验证的
持久结果，但至少一个浏览器和自动回归仍须覆盖成功反馈，且各浏览器控制台错误必须为 0。

若发布画像需要本地或远程长时间浏览器 E2E、跨视口回归或稳定性验收，使用登记的
`${{validation_environment}}` 后台执行，前台发布任务只记录 job ID 并由监控任务读取终态：

> Invoke workflow: `background-browser-validation` with params:
> project_dir=${{project_dir}}, candidate_ref=<步骤 1 冻结的完整提交>, test_environment=${{validation_environment}},
> evidence_dir=<本次唯一持久化证据目录>, timeout_seconds=<风险窗口加清理余量>,
> command_spec=<无秘密、已哈希的仓库测试命令规格>

六项输入必须在启动前一次固定；不得由后续监控会话自行补默认值。没有仓库稳定用例入口的新旅程可在
本次任务中形成最小命令规格；同类旅程第二次出现时应沉淀为仓库测试入口，避免每次发布临时重写。

普通确定性交互不机械执行 soak；生命周期、重连、并发、流式或资源趋势风险按画像选择窗口或循环数。
后台化不减少断言，未获得 `passed` 终态、完整用例、资源保护和清理证据时不得继续发布。

**Expected output:** L3 测试、构建、安装安全、应用配置生命周期和工作流静态检查全部通过。

### 4. 提交发布候选并等待 CI

仅暂存发布范围文件，提交后先推送 `release/v${{version}}-candidate`，让 Linux CI
独立验证准确的待发布提交：

```bash
git add VERSION CHANGELOG.md internal/version/version.go \
  web/package.json web/package-lock.json
git commit -m "chore: prepare KPanel ${{version}}"
git push origin HEAD:refs/heads/release/v${{version}}-candidate
```

如果发布工作流本身需要修复，应将 `.github/workflows/release.yml` 纳入同一独立修复提交。
推送候选前再次核对本地 `HEAD`、候选提交清单和 `origin/main`。等待候选 CI 成功，不得只依据
本地测试继续发布。随后再次读取远端 `main`；只有它仍与步骤 1
记录的基线完全一致，才允许安全快进并等待 `main` CI：

```bash
git push origin HEAD:main
```

**Expected output:** 候选与 `main` CI 均成功，远端提交哈希与本地待发布提交一致，未夹带
其他会话的提交。

### 5. 创建不可变版本标签并监控 Release

打标签前第三次核对 `main`、候选和已通过 CI 的提交哈希完全一致，再创建 annotated tag 并推送：

```bash
git tag -a "v${{version}}" -m "KPanel ${{version}}"
git push origin "v${{version}}"
```

持续检查对应 Release run，直到所有步骤完成：

1. 源码验证；
2. Agent 双架构二进制和校验文件；
3. 原生镜像运行时契约；
4. draft GitHub Release；
5. Docker Hub 登录；
6. 多架构版本镜像；
7. 稳定版 `latest` 提升；
8. GitHub Release 正式公开；
9. 确认候选分支提交已包含于发布标签后自动删除候选分支。

**Expected output:** Release workflow 全绿，GitHub Release 为非 draft、非 prerelease。

### 6. 验证 GitHub Release 和 Docker Hub

核对 Release 附件至少包含：

- `kejilion-agent-linux-amd64`
- `kejilion-agent-linux-arm64`
- `kejilion-panel-deploy-${{version}}.tar.gz`
- `SHA256SUMS`

核对 `${{image}}:${{version}}` 与稳定版 `${{image}}:latest` 的清单摘要完全一致，并确认
`linux/amd64`、`linux/arm64` 均存在。额外的 `unknown/unknown` 条目可为 provenance/SBOM
attestation，不能误判为架构缺失。

**Expected output:** Release 附件完整，版本镜像与 `latest` 指向同一摘要，双架构齐全。

### 7. 核对应用市场契约，必要时同步

当前 `kpanel.conf` 使用 `latest`，并从镜像 OCI 标签和内置 `/release/VERSION` 动态校验
Panel/Agent 版本；普通 KPanel 版本发布不再同步硬编码版本。先把本仓库
`packaging/kejilion-app/kpanel.conf` 与 `${{apps_repo}}/kpanel.conf` 归一化对比：

```bash
git diff --quiet "v${{previous_version}}..HEAD" -- \
  packaging/kejilion-app/kpanel.conf
```

- 若安装/更新契约没有变化，记录“无需应用市场提交”，禁止制造空提交；
- 若契约发生变化，只有正式 Release 和镜像验证成功后，才同步配置、运行 Bash 语法和
  生命周期检查，并在 `kejilion/apps` 仓库独立提交推送：

```bash
git add kpanel.conf
git commit -m "chore: update KPanel to ${{version}}"
git push origin HEAD:main
```

生产 apps 工作树显示 dirty 时先比较目标文件的 Git blob、工作文件 blob 与最新远端真源。未知内容或
blob 不一致必须停止；若仅因旧基线/换行表现导致状态差异且三方业务 blob 完全一致，则先按原权限备份
该文件，只恢复明确文件的旧索引状态，使用 `git pull --ff-only` 更新，并再次确认 blob、权限和工作树
干净。不得重置整个仓库、覆盖其他文件或把同内容状态差异提交为空变更。

**Expected output:** 应用市场配置与发布契约一致；无变化时工作树干净且无提交，有变化时
`kejilion/apps` 的 `main` 已更新且工作树干净。

### 8. 从公开仓库完成最终验收

不得复用本地构建缓存作为线上证据。显式拉取公开镜像并运行端到端测试：

```bash
docker pull "${{image}}:${{version}}"
KPANEL_EXPECTED_VERSION="${{version}}" \
  sh packaging/tests/image-e2e.sh "${{image}}:${{version}}"
```

再次核对 GitHub Release 页面、Actions 结果、Docker Hub 摘要和应用市场契约；只有步骤 7
实际产生配置差异时才核对 `kejilion/apps` 提交。

**Expected output:** 输出 `image_e2e=pass`，Release、Actions 和 Docker Hub 均与
`${{version}}` 一致；应用市场为“同哈希且无需提交”或“配置已同步并提交”。

### 9. 在明确授权范围内完成生产部署安全核对

生产操作必须有本次明确授权。先再次检查环境用途：

```bash
node scripts/check-environment-policy.mjs \
  --environment "${{production_environment}}" \
  --purpose production-deploy
node scripts/check-environment-policy.mjs \
  --environment "${{production_environment}}" \
  --purpose production-safety-check
```

部署前记录当前版本、Panel/Agent 健康、镜像摘要、数据/配置位置和可恢复备份。生产证据与停写备份
只使用仓库固定入口 `scripts/run-production-evidence.mjs`，由它通过无 Shell 拼接的进程参数上传固定
远端脚本和哈希计划；禁止另写 PowerShell/SSH/Shell wrapper。每个阶段使用同一 run ID、独立证据目录：

```bash
node scripts/run-production-evidence.mjs \
  --repo "${{project_dir}}" --target "${{production_environment}}" \
  --phase preflight --run-id "v${{version}}-production" \
  --expected-version "${{previous_version}}" \
  --artifact-dir "<仓库外绝对路径>/v${{version}}-production-preflight"
node scripts/run-production-evidence.mjs \
  --repo "${{project_dir}}" --target "${{production_environment}}" \
  --phase backup --run-id "v${{version}}-production" \
  --expected-version "${{version}}" --baseline-run-id "v${{version}}-production" \
  --artifact-dir "<仓库外绝对路径>/v${{version}}-production-backup"
```

备份门禁通过后使用 KPanel 标准应用市场更新入口，不直接改正式数据或绕过安装事务：

```bash
ssh "${{production_environment}}" env KJ_APP_NONINTERACTIVE=1 KJ_APP_ACTION=update \
  bash /home/docker/kpanel/bin/kejilion.sh app kpanel
```

部署后以正式 OCI revision 和 manifest digest 再运行 `postdeploy` 阶段；它必须核对版本、OCI、
Panel/Agent 健康、restart/OOM、受保护配置哈希、SQLite quick_check 与近 10 分钟致命日志。入口、计划或
解析失败时停止，不得现场回退到内联远端命令。

固定环境边界：`prod-108`（含别名 `108`）已禁用全部 KPanel 操作。不得连接该主机执行测试、只读检查、
备份、部署、升级、回滚演练、健康采样、日志读取或清理，也不存在临时授权或稳定版本部署例外。
发布验证和唯一正式部署默认都使用 `${{production_environment}}=arena-154`；需要迁移到其他主机时，
必须先由用户明确指定并登记新的环境，不能回退到 108。

若用户只授权发布正式产物而未授权生产部署，停止在此步骤并明确记录“正式产物已发布，生产未部署”，
不得复用上一版本现场结果或把公开镜像 E2E 写成生产成功。

若生产部署安全核对失败并执行回滚，恢复生产实例后必须继续完成公共分发审计：核对 GitHub Latest、
`${{image}}:latest` 和 `kpanel.conf` 标准更新入口实际指向。历史 tag、Release 和不可变版本镜像不得
删除或改写，但失败版本不得无提示继续作为公共默认更新；应恢复上一稳定默认版本，或在 Release 与
验收记录中明确已知问题、影响范围、负责人和修复期限后短期保留。生产写操作后若造成服务退化、回滚、
紧急热修复或重复发布，该事件按变更失败计入；若同时由发布基础设施、执行器、验证通道或无效证据触发，
还必须同时计入流程异常。首次生产写操作前被门禁拦截的流程异常只计流程指标，不计变更失败。

**Expected output:** 已授权时 154（或用户新指定并登记的非 108 目标）运行版本与正式 digest/commit 一致、
备份和回滚可执行；未授权时没有生产状态变化；108 没有连接或操作记录；发生回滚时，生产实例和公共
默认更新通道均有明确、可复核状态。

### 10. 形成统一验收记录并交付

从 `docs/release-acceptance-template.md` 创建 `docs/release-v${{version}}-acceptance.md`，记录精确提交、
发布画像、多维质量状态、候选/主线/Release、公开产物、隔离真机、生产部署安全核对、回滚和遗留风险。
自动测试、隔离真机、公开产物和生产部署安全核对必须分层填写；生产未执行的管理员写操作不得写成
已验证。108 固定记录为“禁用全部 KPanel 操作，本次未连接、未部署、未核对”，不得把它写成测试覆盖、
部署目标或发布门禁缺失。

分别记录稳定标签形成的正式发布频率和有生产完成证据的部署频率；记录候选冻结和生产完成时间、
提交到生产用时、是否发生回滚/紧急热修复/重复发布及原因；另行记录
使必需步骤无效、失败或需要重试的发布基础设施、执行器、验证通道和无效证据次数，以及其中发生在
首次生产写操作之后的次数。流程异常不得歪曲为产品变更失败，缺失事实不得推断为零，供滚动
14 天和最近 20 个版本的发布节奏复核。验收记录在获得相应提交/推送授权后形成独立聚焦提交；
未获授权时保留工作树差异并回传，不得擅自更新 `main`。

异常计数大于零时按模板补“流程异常明细”：每个事件或同根因批次使用“阶段/权威入口/根因类别”
稳定指纹，记录生产写前后位置、实际影响、恢复证据、历史复发和永久处置。同一指纹在滚动 5 个正式
版本内出现 2 次，或生产写后发生可由预检发现的本地流程异常，下一次 L3 生产写前必须修复唯一脚本、
Runner、夹具或预检并补回归；不可控上游瞬时故障只能使用有负责人、复核日期和退出条件的期限例外。
`v0.90.2` 起按模板填写 `kpanel-release-process-incidents:start/end` JSON 区块；即使计数为 0 或未记录也
保留空数组，使校验器能够核对明细总数和生产写后总数。

提交验收记录前执行机器校验；同一命令既校验六个交付字段和两个流程指标，也核对时间顺序、十进制用时、计数和失败恢复
语义，禁止使用语义相近的自由文本代替字段。发生失败时必须按模板分别填写“发现时间”“恢复时间”
和具体“逃逸门禁”，后者必须明确选择“已逃逸”或“未逃逸”并给出依据，不得使用“待确认”“无”
“TBD”等占位值；机器校验不能替代发布复核者对原始失败证据和根因完整性的独立核对。
没有生产授权时按模板明确写“未验证”，不得虚构时间或成功：

```bash
node scripts/report-release-metrics.mjs \
  --validate-acceptance "docs/release-v${{version}}-acceptance.md"
```

最终回传必须包含：

- 主仓库提交和 tag；
- CI、Release run、GitHub Release、Docker Hub 链接；
- 版本镜像和 `latest` 摘要；
- 支持的平台；
- `kejilion/apps` 契约核对结果，以及有变更时的提交；
- 公开镜像 E2E 结果；
- 多维质量状态、受影响用户旅程和证据层级；
- 生产部署安全核对动作与仅在隔离真机验证的动作；
- 发布节奏、产品变更失败和独立流程异常数据，以及重复发布原因（如有）；
- 流程异常指纹、复发判断和永久处置（计数大于零时）；
- L3 外层入口的 run ID、计划/脚本/bundle 摘要、不可变 Runner ID、终态与证据目录；
- 保留的无关本地改动；
- `${{previous_version}}` 回滚点及任何未验证风险。

**Expected output:** 验收文档结构完整且机器校验通过，用户无需查看其他会话即可区分已验证、不适用和
未验证风险；后续 `make release-metrics` 能读取实际记录，而不是把已有生产事实显示为“未报告”。

## Parameters

- `${{project_dir}}`：本次发布候选所在的独立 KPanel 工作树绝对路径。
- `${{version}}`：不含 `v` 的目标语义版本，例如 `0.20.2`。
- `${{previous_version}}`：发布前稳定源码或镜像版本，用于回滚说明。
- `${{image}}`：完整镜像仓库，默认 `docker.io/kjlion/kejilion-panel`。
- `${{runner_image}}`：Linux L3 工具链 Runner；版本随依赖策略更新，执行时记录解析后的不可变 image ID。
- `${{apps_repo}}`：`kejilion/apps` 本地路径，默认 `C:\GitHub\kejilion\apps`。
- `${{validation_environment}}`：登记的隔离验收环境，默认 `arena-154`。
- `${{production_environment}}`：登记的稳定生产部署环境，默认 `arena-154`；禁止填写 `prod-108`/`108`。
- 浏览器验收的证据目录、硬超时和命令规格仅在发布画像要求真实浏览器时固定，并完整传给
  `background-browser-validation`；无浏览器影响时标记不适用，不创建空作业。

## Verification

```bash
py -3 "${CODEX_WORKFLOWS_CLI:-$HOME/.codex/skills/codex-workflows/scripts/workflow.py}" \
  validate release-kpanel --project-dir "${{project_dir}}"
py -3 "${CODEX_WORKFLOWS_CLI:-$HOME/.codex/skills/codex-workflows/scripts/workflow.py}" \
  run release-kpanel --project-dir "${{project_dir}}" \
  --param project_dir="${{project_dir}}" \
  --param version=0.0.0-test \
  --param previous_version=0.0.0 \
  --param image=docker.io/example/kpanel \
  --param runner_image=kpanel-release-gate:go1.26.7-node24 \
  --param apps_repo=C:/tmp/apps \
  --param validation_environment=arena-154 \
  --param production_environment=arena-154
```

确认渲染结果中不存在未替换参数，并执行 `git diff --check`。

## Notes

- 工作流负责指导执行，不保存 GitHub、Docker Hub Token 或任何会话 ID。
- Release 失败时先定位精确失败步骤；不得把登录成功等同于推送和提升 `latest` 成功。
- 若失败发生在正式产物生成之后，修复后发布新的 patch 版本，不移动或覆盖旧 tag。
- 若仅生成 draft Release，不得手工公开；镜像成功且线上验收通过后才允许公开。
- 高频发布不自动视为失败，也不自动豁免门禁；同一问题的候选冻结前连续微调应尽量聚合，
  冻结后的独立修复使用新 patch 版本并记录原因。
- 源码回滚与镜像回滚分别记录；历史源码 tag 不代表一定存在可用 Docker 镜像。
- 发布 worktree 的分支、`HEAD` 或文件被外部任务改变时立即停止；不得重置他人改动，迁移到新的
  专用候选 worktree 并重新执行受影响门禁。
- 浏览器后台作业可以跨会话继续，但候选 `HEAD`、命令规格、环境或资源参数变化时证据作废；禁止用
  旧 job 的通过结果覆盖新候选。
- `prod-108`/`108` 是 KPanel 永久 no-touch 目标；发布、部署、安全核对和故障恢复都不得连接。
