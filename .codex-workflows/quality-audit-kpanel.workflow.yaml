# KPanel Quality Audit

## Purpose

在不改业务、不发布的前提下，对高频迭代后的 KPanel 做可重复健康审计。按项目真实业务域和用户
旅程收集业务正确性、体验、性能、稳定、安全与交付节奏证据，再只修复可复现缺陷或缺失门禁，
避免把一次性人工检查、发布次数或测试退出码误当成长期质量结论。

## Prerequisites

- 已阅读 `AGENTS.md`、`PROJECT_RULES.md`、`docs/development-quality-standard.md` 和当前事实入口
  `docs/product-quality-review-current.md`；历史审计只用于对应时点比较。
- `${{project_dir}}` 是独立或无并发写入的 KPanel worktree。
- 未经用户明确授权，不提交、推送、发布或修改正式服务器状态。
- `${{test_host}}` 必须登记在 `environment-policy.json` 且允许候选/性能/浏览器验证；`prod-108` 禁用全部 KPanel 操作。

## Steps

### 1. 固定范围与回滚点

```bash
cd "${{project_dir}}"
git status --short
git branch --show-current
git rev-parse HEAD
git diff --stat "${{baseline_ref}}..HEAD"
node scripts/check-business-context-freshness.mjs
```

**Expected output:** 工作树、基线、改动规模和允许修改范围明确，当前业务事实入口未超过机器门槛，
用户已有修改已保留。

### 2. 审计规范与架构不变量

```bash
rg -n "任意 Shell|真实状态|Unix Socket|Origin|CSRF|性能预算|发布前至少执行" \
  PROJECT_RULES.md docs/development-quality-standard.md
rg -n "docker.sock|InsecureSkipVerify|Access-Control-Allow-Origin|/bin/sh -lc" \
  Dockerfile deploy internal web
```

人工复核 Panel/Agent 边界、真实状态来源、固定动作枚举、输入/并发/响应上限、敏感信息
处理和回滚路径。命中危险关键词不等同漏洞，必须结合调用入口和信任边界判断。

**Expected output:** 不变量仍成立；例外均有具体文件、调用链和可利用性结论。

### 3. 执行完整功能与构建门禁

```bash
make verify-release
docker run --rm \
  -e KPANEL_APP_CONF_TEST_ROOTFS=1 \
  -v "$PWD:/src:ro" \
  bash:5.2.37-alpine3.22@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324 \
  bash /src/packaging/tests/app-conf-lifecycle.sh /src
```

**Expected output:** Go/Web/Shell、race、版本一致性、源码与镜像扫描、Linux 构建和应用生命周期全部通过。

同时选择本轮改动影响的核心用户旅程，核对真实状态来源、`kejilion.sh`/Web 双向继续管理、
Agent 离线降级和长任务恢复。没有影响的旅程记录不适用依据，不无差别制造生产写操作。

### 4. 验证性能预算

在 `${{test_host}}` 的隔离目录和端口，以以下限制启动 `${{candidate_image}}`：

```bash
node scripts/check-environment-policy.mjs \
  --environment "${{test_host}}" \
  --purpose performance-validation
```

```text
memory=256 MiB, cpu=1, pids=128, read-only, non-root, cap-drop=ALL
```

测量冷启动、预热后 RSS、健康与会话接口延迟和错误率、登录并发峰值、Agent 混合读取、
文件归档与历史监控基准。与最近稳定报告使用相同机器、数据量和并发比较。

**Expected output:** 满足文档预算；单次波动不得直接定性为回归，超预算必须复跑并保留原始证据。

### 5. 验证用户体验与可访问性

按 `docs/ui-visual-language.md` 和 `docs/development-quality-standard.md` 在真实浏览器验证受影响页面的桌面/窄视口、
浅/深色、键盘与焦点、100%/125%/200% 缩放、多语言、加载/空/失败态、长文本和控制台错误。终端、对话框、
固定底栏和桌面窗口不得遮挡焦点或输入；点击目标、焦点可见和无意外上下文切换按两份规范的 WCAG 2.2 目标复核；
有语义文字低于 12px 或正文/控件低于 14px 时必须记录为失败或迁移债务。

预计超过普通交互反馈窗口的浏览器 E2E/稳定性测试必须调用 `background-browser-validation`，以后台
job 和证据目录跨会话恢复；普通 UI 审计不机械增加 soak，生命周期/资源风险按画像确定窗口或循环数。

**Expected output:** 受影响用户旅程能够完成，问题有视口、主题、语言、步骤和截图/浏览器证据；
未登录或未执行写操作的范围明确标记，不用登录页正常代替登录后功能结论。

### 6. 验证网络入侵与供应链安全

```bash
make security-audit
bash scripts/security-scan.sh source
bash scripts/security-scan.sh image "${{candidate_image}}"
```

同时验证 Host、Origin、CSRF、Cookie、方法、Content-Type、请求上限、伪造代理头、
Unix Socket 鉴权和最终容器限制。记录 Docker、containerd、runc、内核版本，并只依据
官方公告核对当前 High/Critical 风险。扫描告警必须按调用可达性人工复核，不得无证据 suppress。

**Expected output:** 无可达 High/Critical；不可达项有版本、调用路径和复核日期证据。

### 7. 复核发布节奏与证据质量

从标签、验收记录和发布结果统计滚动 14 天及最近 20 个正式版本的部署频率、提交到生产用时、
变更失败/回滚/紧急热修复、恢复时间和重复发布原因，并独立统计使必需步骤无效或需要重试的发布流程
异常/无效证据及其中发生在生产写操作后的数量。检查验收记录是否区分自动测试、隔离真机、
公开产物和生产部署安全核对，是否把未验证项、部署健康或历史版本结果误写为当前质量通过。
对计数大于零的记录按“阶段/权威入口/根因类别”比较流程异常指纹：同一指纹在滚动 5 个正式版本内
出现 2 次，或生产写后发生可由预检发现的本地异常，必须形成唯一入口的修复/回归或有期限的上游例外；
不得以减少计数为目标合并事件、漏记异常或放宽 fail-closed。

```bash
make release-metrics
```

**Expected output:** 同时报告交付速度、产品稳定性和流程可靠性；两类失败不混算，数据不足时先形成基线，
不以高频或低频单独定性；重复指纹、处置状态和观察窗口可追溯。

### 8. 只修复可复现缺陷或自动门禁

优先级：可利用安全缺陷、数据完整性、错误成功判定、资源无界、竞态、发布门禁缺失、性能回归。
只修改最小范围并重跑受影响测试，不顺带重构或发布。

如果问题属于重复缺陷、指标持续恶化或规范/门禁缺口，先按
`docs/quality-improvement-proposal-template.md` 形成提案，再运行 `evolve-kpanel` 工作流；一次偶发环境失败
只记录证据，不直接改写永久规范。

**Expected output:** 修复可回滚，自动测试能阻止同类问题再次进入主线。

## Parameters

- `${{project_dir}}`：待审计 KPanel worktree 绝对路径。
- `${{baseline_ref}}`：最近稳定 tag 或审计开始时的 `origin/main`。
- `${{candidate_image}}`：候选或公开版本镜像完整引用。
- `${{test_host}}`：登记的隔离性能与运行时验收主机；为空时明确列出未验证项，不得连接 108。

## Verification

```bash
git diff --check
py -3 "${CODEX_WORKFLOWS_CLI:-$HOME/.codex/skills/codex-workflows/scripts/workflow.py}" \
  validate quality-audit-kpanel --project-dir "${{project_dir}}"
```

最终报告必须包含：项目/版本基线、已验证事实、修改文件、受影响用户旅程、体验与性能原始结果、
安全可达性、稳定/恢复、交付节奏、证据层级、回滚点、无法验证部分，以及是否提交、推送或发布。

## Notes

- Windows 本机只执行可稳定复现的前端与静态检查；race、Linux 构建、容器限制和 Trivy
  应在 Linux、CI 或隔离主机执行。
- 远程传输出现 CRLF、网络超时或测试环境冲突时，先识别环境失败，不得写成代码失败。
- 快速迭代数量只能提高审计优先级，不能单独证明质量下降。
