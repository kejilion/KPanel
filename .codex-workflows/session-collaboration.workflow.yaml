# KPanel Session Collaboration

## Purpose

Safely route KPanel work across Codex, Claude, or another agent, enforce the shared Definition of Ready/Done,
isolate every writer in its own worktree, and keep cross-tool state in SSH remote branches, focused commits, and evidence.

## Prerequisites

- Read `AGENTS.md`, `PROJECT_RULES.md`, `docs/project-management.md`, and `docs/multi-agent-collaboration.md`.
- The user request defines a concrete goal and does not implicitly authorize push, release, or deployment.
- `${{base_ref}}` resolves to an approved KPanel baseline; default to `origin/main`.
- `origin` is `git@github.com:kejilion/KPanel.git`; fetch and push use the repository's local SSH configuration.
- GitHub Issue, PR, API, plugin, and `gh` authentication are optional and must not block Git work.

## Steps

### 1. Discover current work

Fetch over SSH, list remote task branches, then list KPanel Codex tasks when `${{agent_provider}}` is Codex. Inspect the repository without changing branches:

```powershell
git fetch origin --prune
git status --short --branch
git worktree list
git branch -vv
git remote get-url origin
```

Expected: active tasks, owned worktrees, remote branches, dirty state, current release lane, and the SSH remote are known.

### 2. Route or create the task

- Reuse an unfinished task only when its scope, role, provider, branch, and domain match and its worktree is not owned by another writer.
- For Codex create `KPanel · Codex · ${{role}} · ${{scope}}`; for another provider use its own orchestrator. The remote branch and focused commits are the session-neutral state.
- Read-only analysis may share the project directory.
- Before any write, create a dedicated worktree and pass its absolute path to the task.

Expected: one task owns one worktree and one branch; no writer uses the management worktree.

### 3. Send the task contract

Use the exact shared contract from `docs/project-management.md`. It must include `${{scope}}`, provider/role, user
value, allowed/forbidden paths and shared contracts, business truth source and affected user journeys, worktree, branch,
base/rollback, dependencies/conflicts, verification level and evidence, permissions, completion criteria, and deliverables.

Expected: Definition of Ready is satisfied; the task can act without guessing ownership, quality scope, or authority.

### 4. Wait and inspect the result

Use provider-specific waiting only as a local optimization. The agent must meet Definition of Done and return the
standard delivery package. When commit/push is authorized, form a focused commit and push the task branch over SSH;
without commit authority keep the diff in the dedicated worktree and do not classify it ready for integration. Then inspect:

```powershell
git status --short --branch
git log -3 --oneline --decorate
git diff --check ${{base_ref}}...HEAD
git diff --stat ${{base_ref}}...HEAD
```

Reuse successful evidence only when commit, environment, tools and parameters are unchanged. Run the required
repository-native check for `${{verification_level}}` when evidence is incomplete or invalidated; complement it with
affected business, browser, real-machine, performance, or production evidence rather than repeating identical commands.

Visible feature work must invoke `local-feature-preview` and return its standard preview card. Use `draft` for a dirty
working tree and `acceptance` only for a clean checkpoint; mock, local integration, and isolated real-host evidence remain
distinct. On handoff, pass the manifest path and stop responsibility instead of leaving an undocumented dev server.

Long-running browser E2E or soak uses `background-browser-validation`: record its job ID and evidence directory, release
the foreground task, and let a monitor/read-only task consume the terminal state. Validate remote purposes through
`environment-policy.json`; never connect to `prod-108` for any KPanel operation.

Expected: the diff matches the requested scope, quality dimensions and user journeys are classified, and the reported
tests and evidence are reproducible.

### 5. Classify the delivery

Set the outcome to one of: executing, awaiting-input, awaiting-commit-authorization, awaiting-verification,
ready-for-integration, blocked, or abandoned. Report exact Git state, quality/evidence status, remaining risk, target
version recommendation, rollback point, and whether anything was committed, pushed, released, or deployed.

## Parameters

- `${{role}}`: analysis, development, verification, integration, or release.
- `${{scope}}`: stable short domain name.
- `${{agent_provider}}`: Codex, Claude, or another authorized provider.
- `${{base_ref}}`: approved baseline; default `origin/main`.
- `${{verification_level}}`: L0, L1, L2, or L3 under `PROJECT_RULES.md`.

## Verification

- No two write tasks own the same worktree or branch.
- The management worktree was not used for feature or release writes.
- The delivery package contains exact Git state and reproducible verification evidence.
- Definition of Ready and Definition of Done were applied from `docs/project-management.md`, not redefined locally.
- Existing evidence was reused only for an unchanged commit/environment/parameter tuple.
- Visible feature work returned a reproducible local preview or stated why it was not applicable; no preview process was orphaned.
- No push, tag, release, or deployment occurred without explicit authority.

## Notes

- Do not store provider-specific session IDs in the repository. SSH remote branches, focused commits, CI, and release records are the cross-provider truth.
- If branch or worktree ownership changes unexpectedly, follow the conflict recovery procedure in `docs/project-management.md`.
