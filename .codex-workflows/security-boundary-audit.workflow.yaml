# KPanel Security Boundary Audit

## Purpose

对 KPanel 执行跨信任边界的逻辑不变量安全审计，补充 `make security-audit`
（govulncheck/npm audit）和 Trivy 只覆盖已知依赖漏洞的盲区：验证入口校验、
授权绑定、写路径隔离和跨组件契约不变量。审计只读源码并产出结构化账本与
findings；不修改业务代码，不替代 L0-L3，也不替代人工安全复核。

三档模式按 `PROJECT_RULES.md` 5.4 选择：

- **guidance**：回答安全问题或复查单个改动，不写任何文件，不编排子代理；
- **scoped**：从 `${{scope_paths}}` 当前源码派生单元，复验相关旧单元并补充新入口、新边界与生命周期；
- **full**：全量重建账本（通常仅在稳定版列车发车前）。

## Prerequisites

- 已阅读 `PROJECT_RULES.md` 5.4 节、本 workflow 全文和 skill 的 `SKILL.md`。
- Skill 来源（上游 repo `cloudflare/security-audit-skill`）必须先 pin 到固定
  commit 并记录在 `${{ledger_dir}}` 的 run metadata 中。上游会持续迭代：发现
  新 commit 只产生候选信号（检测经 `dependency-freshness` 节奏，不自动升级）；
  升级决策按 `PROJECT_RULES.md` 5.2 受控自我改进执行——先对新 commit 跑一轮
  scoped 对照并产出差异报告，新验证器必须重验既有账本通过，值得升级才换 pin，
  换 pin 本身是独立治理提交。
- `${{project_dir}}` 是干净的专用源码 worktree；审计只读目标。`${{ledger_dir}}` 必须为仓库外新建 run 目录，
  先在外部完成审计，结束后由父任务将经过披露审查的最小治理产物提交到 `.governance/security-audit/run-<N>/`。
  原始 scratch、运行环境、秘密与未复核攻击细节不得随目录整包入库。
- `${{skill_dir}}` 是已按依赖策略 pin 检出的上游 `skills/security-audit` 绝对路径。
- 审计智能体必须支持工具调用与并行子代理；验证器（`validate-findings.cjs`、
  `validate-coverage-ledger.cjs`）需要 Node.js 且 `O_NOFOLLOW` 支持意味着
  Windows 原生 Node 不可用，须在 WSL 或 Linux 下运行。
- 无 OS 沙箱（隔离网络、资源限额、scratch-only 写）时禁止执行目标代码；
  需要动态确认的线索一律记为 `needs_validation` 并写明缺失能力，不得降级为
  "已确认"。

## Steps

### 1. 固定范围、基线与既有账本

```bash
cd "${{project_dir}}"
node "${{governance_dir}}/scripts/security-audit-baseline.mjs" "${{project_dir}}" "${{baseline_ref}}"
```

将输出的 commit/tree/clean 写入 run metadata，结束时重跑且必须与开始时相同。
不匹配或 dirty 时停止，不 reset/stash 他人改动；保存为独立提交或另建干净源码工作树后重新冻结。
治理入口可来自独立工作树，目标源码无需为了加入脚本改变身份；记录该入口的提交身份。
本入口只绑定 Git 跟踪源码；忽略文件不属于输入，不执行或依赖这些文件。

`${{profile}}` 为 `full` 时读取全部既有 run 目录做增量输入；`scoped` 读取所有兼容旧 run 中
与 `${{scope_paths}}` 相关的账本及 findings，比较相关源码而非只比较旧 ref。无账本（首次 full）时
记录"no prior ledger"且不宣称既往覆盖。历史 dirty run 缺完整快照时明确不可完全复现，不追溯伪造证据。

### 2. 侦察与账本播种

按 skill 的 RECONNAISSANCE.md 派出多个只读侦察代理（产品栈、身份授权、
入口面与 sink、执行能力），合成 `architecture.md`；以
表面 × 信任边界 × 子系统 × 攻击类 派生确定性覆盖单元并写入
`coverage-ledger.json`，排序后运行验证器。重复 ID 或编码违规必须修复后
才能进入狩猎。

### 3. 覆盖狩猎波

按 HUNTING.md 为每个单元指派隔离 hunter 子代理；hunter 返回的结构化结果
按单元回写账本（单写者：父进程唯一持有账本写入权）。每波后由独立 coverage
critic 复核缺口；critic 提出的新单元进入下一波。`scoped` 模式只指派
范围内单元，包括 critic 新发现的范围内单元；范围外明确保留为 `out_of_scope`，不得沿用旧 covered
声称本轮覆盖。full 模式持续到 critic 报告无缺口。

信任边界包清单以 `PROJECT_RULES.md` 5.4 触发表为唯一权威，本 workflow 不
复述具体包名，防止双写漂移。

### 4. 候选独立验证

每个 hunter 产出的 candidate 交给未参与狩猎的独立验证代理尝试反驳；
confirmed 必须有完整源码追溯，needs_validation 必须有精确 blocker。
验证者不可是发现者。findings.json 按 skill 的 report-schema 写入并通过
`validate-findings.cjs`。

### 5. 记录核验与报告

对每条 surviving 记录执行独立 Phase-5 记录核验（引用文件:行逐一打开核对）。
最后派生 `REPORT.md`、`FINDINGS-DETAIL.md`、`NEEDS-VALIDATION.md`，与两个
验证器最终结果一并入库。报告必须区分 confirmed / needs_validation / 加固
建议，且明确"机器结论是高可信线索，不是人工安全复核结论"。

### 6. 交付与试行观察

按标准交付包回传：基线、账本变更、findings、成本（代理数/token/时长）和
建议。full 结果同时记入试行观察（见 PROJECT_RULES.md 5.4 的试用退出条款）。
所有 confirmed finding 转入正常开发流程修复，不在审计任务内修复。
在安全审计目录的修复追踪记录中保留 fingerprint、发现 run/source、修复 commit、独立复核与回归证据，
分别核对 RC tag、stable tag 的祖先关系和实际 Release 状态；部署另以验收记录为证。
稳定版尚未公开时状态保持 `pending-stable`，由该版本唯一发布任务在验收时补齐；不能为了关闭 finding
提前删除仍服务 RC 的候选分支。候选处置引用 `docs/release-channels.md`，不在审计流程另定义归档规则。

## Parameters

- `${{project_dir}}`：审计目标 worktree。
- `${{baseline_ref}}`：审计基线（full 默认 `origin/main`，scoped 为任务分支 HEAD）。
- `${{ledger_dir}}`：仓库外的新 run 目录，结束后选择性入库；已有 run 只作为增量输入。
- `${{skill_dir}}`：固定 commit 的上游 skill 绝对路径。
- `${{governance_dir}}`：提供已提交基线检查入口的治理工作树，通常与 project_dir 相同；旧源码复核时可独立指定。
- `${{profile}}`：`guidance` / `scoped` / `full` 之一。
- `${{scope_paths}}`：scoped 模式的包路径列表。

## Verification

```bash
node "${{skill_dir}}/validate-findings.cjs" "${{ledger_dir}}/findings.json"
node "${{skill_dir}}/validate-coverage-ledger.cjs" "${{ledger_dir}}/coverage-ledger.json"
```

两个验证器 PASS 是结构有效性的机器下限；覆盖声明的质量以账本单元与
reviewed_paths 为准，不以代理数量或运行时长为准。
以上两个命令在支持 `O_NOFOLLOW` 的 Linux/WSL 中使用对应 Linux 路径执行；Windows 不静默跳过。

## Notes

- 单次 full 大约只能发现重复运行总发现的一半；never 以"跑过一次未发现"
  宣称安全，覆盖结论只在账本维度上声明。
- 18+ 代理并行读仓时注意与其他并行任务的 worktree/资源冲突；审计本身
  只读源码，不触碰测试环境与部署。
- Linux CI 不运行本 workflow；它是例行安全复核手段，不是提交门禁。
- run-1 基线（45 单元、1 confirmed、12 加固项，输出于
  2026-09-18）应从历史目录读取为增量输入；不得复制到本次 `${{ledger_dir}}` 冒充当前证据。
