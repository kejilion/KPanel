# KPanel Controlled Evolution

## Purpose

把重复缺陷、指标恶化、证据缺口、事故逃逸或反复人工步骤转化为小范围、可证伪、可回滚的工程改进。
本流程只在用户授权实施后产生改进提案、任务分支候选提交和验证证据；规范不能自行放宽门禁，流程
不能自行启动修改、SSH 推送、更新主线、发布或操作生产。

## Prerequisites

- 复杂治理写任务按 `docs/project-management.md` 6.2.1 使用 `scripts/task-preflight.mjs` 成组预检输入与交付。
- 执行效率遵循同文档 6.2.2 / 7.2：治理唯一入口自动做离线前置探测；相同输入的失败先修复原因再重试，
  仅同 SHA、环境、工具和参数的有效证据可复用。局部提速实测不能冒充端到端或长期收益。
- 草案和待复核共用提案日期的 14 天时限；实现进入 main 时更新生命周期，不能用草案逃避复核。
  具体规则以 `PROJECT_RULES.md` 5.2.7 为准；已推送历史证据和 trailer 不改写。

- 已完整阅读 `PROJECT_RULES.md`、`docs/project-management.md` 和 `docs/development-quality-standard.md`。
- `${{project_dir}}` 是独立 KPanel worktree，`${{baseline_ref}}` 是精确且已批准的基线提交或标签。
- 已有至少一种可复核触发证据：重复缺陷、滚动指标退化、验收记录缺口、CI/生产事件或高成本人工步骤。
- 已明确允许修改范围、非目标、验证等级和回滚点；没有用户修改授权时不写入。修改授权包含本地任务
  候选提交，但不包含 SSH 推送、更新主线、发布或操作生产。
- 涉及永久规范、工作流、策略或治理门禁时，已按 `PROJECT_RULES.md` 5.3 冻结规范验收合同；普通业务
  改进不额外创建规范审计。

## Steps

以下四阶段复用 `docs/project-management.md` 1.1。已经完成且身份未变化的启动检查直接引用；
阶段不是额外审批，既有独立复核、CI、权限和观察窗口继续有效。

### 1. 准备：一次固定事实、合同与验收

在 `${{project_dir}}` 核对 `${{baseline_ref}}` 的精确提交和路径所有权，使用现有任务契约。
复用已有原始报告；缺失时运行唯一指标入口，不把标签时间当生产完成时间：

```bash
node scripts/report-release-metrics.mjs --days "${{observation_window}}" \
  --releases "${{release_count}}" --ref "${{baseline_ref}}" --format markdown
```

现有提案续审直接更新原文；新假设才按 `docs/quality-improvement-proposal-template.md` 建立
`docs/quality-improvement-<YYYY-MM-DD>-${{proposal_slug}}.md`。一次记录事实、替代解释、产品约束、
允许范围、非目标、基线/目标、证据缺口、回滚与权限。规范变更按 `PROJECT_RULES.md` 5.3 冻结
六项固定矩阵、正常授权路径、回归集和停止条件。复杂任务用 `scripts/task-preflight.mjs ready`，
不能把 JSON 权限字段当作用户授权。历史原件不可补造，缺数据不记零或成功。

**Expected output:** 一个任务契约与适用提案，输入缺项成组处置；不重复建台账或重跑已有调查。

### 2. 实施：聚焦候选与一次对应等级核验

只在专用工作树修改允许范围；优先修唯一入口，不增加平行工具、不降低门禁。用户授权本地实施
时可先形成候选，尚未独立复核不能宣称正式准入。形成非空候选提交，保持 clean；适用的 OCR、
安全盲审和 acceptance 预览仍按根规范在最终核验前完成。纯治理文本不制造产品预览。

开发中可跑定向测试反馈；最终候选运行唯一变更感知入口：

```bash
node scripts/run-repo-bash.mjs scripts/verify-change.sh "${{baseline_ref}}"
```

风险需要 L2 时使用同一入口提升等级；完整 L3 按 `PROJECT_RULES.md` 5.1 通过
`scripts/run-release-l3.mjs --github-hosted` 执行，本地入口不构成 L3，也不替代远端 Linux CI。
检查原始日志确认冻结回归集确实运行，已有完整入口中的子检查不再次逐条执行。
缺项/环境错误先修前提，产品断言失败先定位；保留首轮失败，按 6.2.2 有限重试。
修复只重验受影响项及冻结回归集；基线和风险边界未变时禁止重新开启无界全量探索。

**Expected output:** 聚焦、可回滚的候选与精确证据；无产品、版本、发布或生产范围扩张。

### 3. 交付：一次独立复核并收口

未编写方案的复核者按 5.3 读取差异和原始证据，核对假设、指标投机、六项矩阵及授权；
按跨工具手册记录提供商与降级理由。复核可由接手集成/发布者承担，不另设常驻监工。
一次汇总阻断和重要事项，修复后补受影响证据；同一身份的门禁不因换角色重跑。
结论只使用 `PASS`、`PASS WITH FOLLOW-UP`、`FAIL`，固定矩阵完成、阻断为零且后续条件明确时结束。

```bash
node scripts/check-collaboration-state.mjs --role writer --base-ref "${{baseline_ref}}" --require-candidate
```

结果写回同一提案；复杂任务把候选与日志回执补入原契约并运行 `task-preflight.mjs handoff`。
没有推送/主线授权时交付本地候选，明确远端 CI、集成和长期效果未完成，不要求为此空提交或创建产品版本。

**Expected output:** 一个交付包和真实复核决定；剩余事项有负责人、证据缺口、触发条件与期限。

### 4. 集成与收尾：授权后单一接管，观察到期决策

仅已明确授权 SSH 推送和更新主线时，核对 `${{candidate_branch}}` 为专用治理分支，依次执行：
精确候选推送 → 同 SHA Linux CI → 唯一集成任务快进 main → 同 SHA 主线 CI → 按第 10.2 节归档。
`scripts/check-governance-candidate-ci.mjs` 继续核对候选证据；候选分支保留到主线 CI 成功。
候选失败在专用分支修复；不把 main 首次失败当候选验证，不创建产品 tag、Release、镜像或生产部署。
接手者按第 10.1 节独立完成剩余工作，不召回已交付 writer、不新增监工，不自行扩大权限。

准入与主线结果写回原提案；采纳须有独立复核和实际验证，长期收益须有相同环境、样本、参数的比较。
在 `${{observation_window}}` 天或约定样本量结束时复核；只能按证据采纳、继续试行、拒绝或回滚，
不以“已实施”替代效果。继续试行写明缺口、负责人、下一次日期/样本触发和退出条件；未完成不算结案。
历史路径已被替代时可拒绝继续采纳旧方案，保留历史证据和替代入口；不能借此关闭仍存在的风险。

**Expected output:** 授权范围内的实际集成状态和原提案决定；长期观察单列，不把本地完成写成主线生效。

## Parameters

- `${{project_dir}}`：KPanel 专用 worktree 绝对路径。
- `${{baseline_ref}}`：改进前精确提交或稳定标签。
- `${{observation_window}}`：观察天数，通常为 `14`，可按风险和样本量调整。
- `${{release_count}}`：滚动正式版本样本，通常为 `20`。
- `${{proposal_slug}}`：只含小写字母、数字和连字符的提案标识。
- `${{candidate_branch}}`：获得推送授权后使用的专用治理候选分支，必须以 `docs/`、`feature/`、`fix/`
  或 `release/` 开头；没有推送授权时不执行候选和主线步骤。

## Verification

核对第 2–3 阶段最终候选的完整证据。没有新差异、失败或未解决风险时，不为本清单再次执行同一入口；
本地成功不代替候选 Linux CI、主线 CI、独立复核或适用的实机验收。结构检查可单独执行：

```bash
git diff --check
py -3 "${CODEX_WORKFLOWS_CLI:-$HOME/.codex/skills/codex-workflows/scripts/workflow.py}" \
  validate evolve-kpanel --project-dir "${{project_dir}}"
```

最终交付必须说明：触发证据、基线和目标、修改文件、验证结果、独立复核、观察窗口、未验证风险、回滚点，
以及提交、推送、发布、生产和知识沉淀状态。

## Notes

- 高频发布、低频发布、测试数量或模型信心都不能单独触发规范变化。
- 指标用于发现问题和验证假设，不是绩效目标；数据缺失必须显式报告，不得按成功计入。
- 安全边界、真实资源真源、双端兼容和授权边界属于硬约束，不能由本流程自行取消。
- 永久治理候选只在同一精确 SHA 的 Linux CI 成功后进入 `main`；主线失败不能冒充候选验收。
- 生产部署和部署安全核对必须进入现有发布通道并获得明确授权，本流程不扩大权限；108 禁用全部 KPanel 操作。
