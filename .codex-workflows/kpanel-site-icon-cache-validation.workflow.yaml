# KPanel 网站图标缓存与系统图标验收

## Purpose

在不替换生产 KPanel、不修改真实网站、不推送镜像的前提下，验证：

- 网站列表只通过 KPanel 同源接口加载实际 favicon；
- Agent 实际连接目标固定为本机 Nginx，缓存跨 Agent 重启仍可复用；
- 图标请求为低优先级懒加载，不阻塞网站列表；
- 缓存头、ETag、失败回退和资源上限符合契约；
- Rocky、AlmaLinux、RHEL、Oracle、Manjaro、openSUSE、SLES 不再被 `ID_LIKE`
  误映射成其他发行版。

## Prerequisites

- `${{candidate_commit}}` 必须是当前独立工作树中已提交、可追溯的候选提交。
- `${{project_dir}}` 是 Windows 工作树路径；`${{project_linux_dir}}` 是同一目录在 WSL
  中的绝对路径；`${{go_module_cache_linux_dir}}` 是已填充且只读挂载的 WSL Go module
  缓存目录。用 Windows Git 校验提交；用关键文件 SHA-256 校验 Windows/WSL 看到的是
  同一份源码。module cache 只校验目录存在，并始终只读挂载，不把它当成源码仓库。
- 用户已授权对 `${{ssh_host}}` 启动隔离的临时 Agent/Panel；本流程不授权发布、替换生产
  容器、修改 `/home/web`、重启 Nginx 或操作业务容器。
- `${{ssh_host}}` 必须登记在 `environment-policy.json` 且允许 `candidate-validation`；`prod-108` 禁用全部 KPanel 操作。
- `${{site_id}}` 必须是 32 位小写十六进制站点 ID；`${{site_domain}}` 必须是该 ID 对应、
  已由 Agent 发现且当前可读的既有主域名；测试只发送 GET。
- `${{validation_run_id}}` 必须是本次执行新生成的 32 位小写十六进制随机值；它与提交共同
  写入 root-only 远端会话 marker，用来隔离同一提交的并发验收。
- 候选 Agent 使用独立 socket、token、状态目录和 systemd transient unit；Docker socket
  指向不存在的测试路径，防止生命周期写操作。
- `${{evidence_dir}}` 位于当前工作树的忽略目录，不能保存 Cookie、CSRF、Agent token、
  bootstrap token 或密码。
- 真实 Chrome 通过回环 SSH 隧道访问候选 Panel，使用独立 Cookie 名和全新 Panel 数据目录。

## Steps

### 1. 锁定代码、网站与生产基线

```bash
node scripts/check-environment-policy.mjs \
  --environment "${{ssh_host}}" \
  --purpose candidate-validation
```

```powershell
$ErrorActionPreference = "Stop"
$candidateCommit = "${{candidate_commit}}"
if ($candidateCommit -notmatch '^[0-9a-f]{40}$') {
  throw "candidate_commit must be a full lowercase Git SHA"
}
if ("${{site_id}}" -notmatch '^[0-9a-f]{32}$') {
  throw "site_id must be 32 lowercase hexadecimal characters"
}
if ("${{validation_run_id}}" -notmatch '^[0-9a-f]{32}$') {
  throw "validation_run_id must be 32 lowercase hexadecimal characters"
}
$head = (git -C "${{project_dir}}" rev-parse HEAD).Trim()
if ($head -ne $candidateCommit) {
  throw "Windows worktree HEAD does not match candidate_commit"
}
$dirty = @(git -C "${{project_dir}}" status --porcelain)
if ($dirty.Count -ne 0) {
  throw "candidate worktree must be clean"
}
git -C "${{project_dir}}" check-ignore --quiet -- "${{evidence_dir}}"
if ($LASTEXITCODE -ne 0) {
  throw "evidence_dir must be inside a Git-ignored path such as .codex-tmp"
}
git -C "${{project_dir}}" show --stat --oneline "${{candidate_commit}}"
git -C "${{project_dir}}" diff --check "${{candidate_commit}}^" "${{candidate_commit}}"

$criticalFiles = @(
  "go.mod",
  "internal/sites/icon_cache.go",
  "internal/agent/server.go",
  "internal/panel/site_icons.go",
  "web/src/components/sites/SiteFavicon.vue",
  "web/src/lib/operatingSystem.ts"
)
foreach ($relativePath in $criticalFiles) {
  $windowsPath = Join-Path "${{project_dir}}" $relativePath
  $linuxPath = "${{project_linux_dir}}/" + $relativePath.Replace("\", "/")
  $windowsHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $windowsPath).Hash.ToLowerInvariant()
  $linuxOutput = wsl.exe -u root -- sha256sum $linuxPath
  if ($LASTEXITCODE -ne 0) {
    throw "WSL cannot read $linuxPath"
  }
  $linuxHash = ($linuxOutput -split '\s+')[0].ToLowerInvariant()
  if ($windowsHash -ne $linuxHash) {
    throw "Windows/WSL source mismatch: $relativePath"
  }
}
wsl.exe -u root -- test -d "${{go_module_cache_linux_dir}}"
if ($LASTEXITCODE -ne 0) {
  throw "Go module cache directory is missing"
}
```

通过 SSH 只读记录生产 Panel 容器 ID/健康状态、生产 Agent unit/版本、Nginx 状态，以及
`${{site_domain}}` 对应的 32 位站点 ID、TLS 状态和当前 favicon URL。确认
`${{candidate_port}}` 只在远端回环使用，`${{local_tunnel_port}}` 本地未占用。任何生产基线
异常都应停止，不得用本流程顺手修复。

**Expected output:** 候选提交唯一；生产资源和测试站点均有脱敏基线。

### 2. 运行确定性和真实回环测试

在 `${{project_dir}}` 运行：

```powershell
Set-Location "${{project_dir}}"
npm.cmd --prefix web test
npm.cmd --prefix web run typecheck
npm.cmd --prefix web run build
wsl.exe -u root -- bash -lc "cd '${{project_linux_dir}}' && bash deploy/tests/install-safety.sh"

wsl.exe -u root -- docker run --rm --network none `
  -v "${{project_linux_dir}}:/src:ro" `
  -v "${{go_module_cache_linux_dir}}:/go/pkg/mod:ro" `
  -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go test ./... -count=1

wsl.exe -u root -- docker run --rm --network none `
  -v "${{project_linux_dir}}:/src:ro" `
  -v "${{go_module_cache_linux_dir}}:/go/pkg/mod:ro" `
  -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 `
  go test -race ./internal/sites ./internal/agent ./internal/panel -count=1
```

在隔离 Linux network namespace 中，以 root 运行真实回环测试：

```bash
docker run --rm --network none \
  -e KPANEL_SITE_ICON_LOOPBACK_TEST=1 \
  -v "${{project_linux_dir}}:/src:ro" \
  -v "${{go_module_cache_linux_dir}}:/go/pkg/mod:ro" \
  -w /src \
  golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 \
  go test ./internal/sites \
    -run TestIconCacheDefaultTransportUsesRealLoopbackHTTP \
    -count=1 -v
```

该测试会在容器自身 `127.0.0.1:80` 启动一次性 HTTP fixture；即使设置了错误环境代理，
默认 Transport 仍必须成功，证明域名没有通过 DNS/代理外联。

**Expected output:** 单元、race、构建和真实 loopback 测试全部通过。

### 3. 准备隔离候选 Agent 和 Panel

使用 `git archive` 上传 `${{candidate_commit}}` 到远端 `mktemp -d` 返回的精确目录，构建
`${{candidate_image}}`，但不得 push 或覆盖 `latest`。从候选镜像提取同提交
`/release/kejilion-agent`。

先在控制端执行以下 PowerShell。源码归档只来自锁定提交；远端构建脚本用 `EXIT` trap
清理源码和完整归档。上传中断产生的部分文件只会留在本次 root-only 会话目录中，并由
步骤 7 按唯一 session marker 清理：

```powershell
$ErrorActionPreference = "Stop"
$candidateCommit = "${{candidate_commit}}"
$candidateImage = "${{candidate_image}}"
$runId = "${{validation_run_id}}"
if ($candidateCommit -notmatch '^[0-9a-f]{40}$') {
  throw "candidate_commit must be a full lowercase Git SHA"
}
if ($runId -notmatch '^[0-9a-f]{32}$') {
  throw "validation_run_id must be 32 lowercase hexadecimal characters"
}
if ($candidateImage -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]*:[A-Za-z0-9][A-Za-z0-9._-]*$') {
  throw "candidate_image must be a unique local tag, not a digest or latest"
}
if ($candidateImage.EndsWith(":latest")) {
  throw "candidate_image must not use latest"
}

New-Item -ItemType Directory -Force -Path "${{evidence_dir}}" | Out-Null
$archiveName = "kpanel-site-icon-source-$runId.tar"
$localArchive = Join-Path "${{evidence_dir}}" $archiveName
if (Test-Path -LiteralPath $localArchive) {
  throw "candidate archive already exists: $localArchive"
}

function ConvertTo-RemoteBash([string] $script) {
  $normalized = $script.Replace("`r`n", "`n")
  return [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($normalized))
}

$initializeScript = @'
set -Eeuo pipefail

COMMIT="$1"
RUN_ID="$2"
[[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
[[ "$RUN_ID" =~ ^[0-9a-f]{32}$ ]]

SESSION_ROOT=""
cleanup_failed_initialization() {
  status=$?
  [ "$status" -eq 0 ] && return
  trap - EXIT
  if [ -n "$SESSION_ROOT" ]; then
    case "$SESSION_ROOT" in
      /var/tmp/kpanel-site-icon-session.*)
        if [ -d "$SESSION_ROOT" ] && [ ! -L "$SESSION_ROOT" ] &&
          [ "$(stat -Lc '%u:%a' "$SESSION_ROOT")" = 0:700 ]; then
          rm -rf -- "$SESSION_ROOT"
        fi
        ;;
    esac
  fi
  exit "$status"
}
trap cleanup_failed_initialization EXIT

SESSION_ROOT="$(mktemp -d /var/tmp/kpanel-site-icon-session.XXXXXX)"
chmod 0700 "$SESSION_ROOT"
printf '%s\n%s\n' "$COMMIT" "$RUN_ID" >"$SESSION_ROOT/.candidate-session"
chmod 0600 "$SESSION_ROOT/.candidate-session"
printf '%s\n' "$SESSION_ROOT"
trap - EXIT
'@

$remoteSession = ""
try {
  git -C "${{project_dir}}" archive `
    --format=tar `
    --output="$localArchive" `
    $candidateCommit
  if ($LASTEXITCODE -ne 0) {
    throw "git archive failed"
  }
  $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $localArchive).Hash.ToLowerInvariant()

  $initializeEncoded = ConvertTo-RemoteBash $initializeScript
  $sessionOutput = & ssh "${{ssh_host}}" `
    "printf '%s' '$initializeEncoded' | base64 --decode | bash -s -- '$candidateCommit' '$runId'"
  $sessionExitCode = $LASTEXITCODE
  $remoteSession = [string]($sessionOutput | Select-Object -Last 1)
  $remoteSession = $remoteSession.Trim()
  if ($sessionExitCode -ne 0 -or
      $remoteSession -notmatch '^/var/tmp/kpanel-site-icon-session\.[A-Za-z0-9]+$') {
    throw "failed to create a private remote validation session"
  }
  Write-Output "REMOTE_SESSION=$remoteSession"

  scp -- $localArchive "${{ssh_host}}:$remoteSession/source.tar.part"
  if ($LASTEXITCODE -ne 0) {
    throw "candidate archive upload failed; run step 7 with this validation_run_id"
  }

  $buildScript = @'
set -Eeuo pipefail

SESSION_ROOT="$1"
COMMIT="$2"
RUN_ID="$3"
IMAGE="$4"
EXPECTED_ARCHIVE_SHA="$5"
[[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
[[ "$RUN_ID" =~ ^[0-9a-f]{32}$ ]]
[[ "$IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*:[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
[[ "$IMAGE" != *:latest ]]
case "$SESSION_ROOT" in
  /var/tmp/kpanel-site-icon-session.*) ;;
  *) echo "unexpected session root" >&2; exit 1 ;;
esac
[ -d "$SESSION_ROOT" ] && [ ! -L "$SESSION_ROOT" ]
[ "$(stat -Lc '%u:%a' "$SESSION_ROOT")" = 0:700 ]
mapfile -t SESSION_MARKER <"$SESSION_ROOT/.candidate-session"
[ "${SESSION_MARKER[0]:-}" = "$COMMIT" ]
[ "${SESSION_MARKER[1]:-}" = "$RUN_ID" ]
[ "${#SESSION_MARKER[@]}" -eq 2 ]

ARCHIVE="$SESSION_ROOT/source.tar.part"
[ -f "$ARCHIVE" ] && [ ! -L "$ARCHIVE" ]
[ "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA" ]
! docker image inspect "$IMAGE" >/dev/null 2>&1

SOURCE_ROOT="$SESSION_ROOT/source"
cleanup_source() {
  status=$?
  trap - EXIT
  if [ -e "$SOURCE_ROOT" ]; then
    mapfile -t SOURCE_MARKER <"$SOURCE_ROOT/.candidate-source" 2>/dev/null || true
    if [ "${SOURCE_MARKER[0]:-}" = "$COMMIT" ] &&
      [ "${SOURCE_MARKER[1]:-}" = "$RUN_ID" ] &&
      [ "${#SOURCE_MARKER[@]}" -eq 2 ]; then
      rm -rf -- "$SOURCE_ROOT"
    elif [ "$SOURCE_ROOT" = "$SESSION_ROOT/source" ] &&
      [ -d "$SOURCE_ROOT" ] && [ ! -L "$SOURCE_ROOT" ]; then
      # The already-validated, root-only session marker still proves
      # ownership if creating the child marker itself was the failure.
      rm -rf -- "$SOURCE_ROOT"
    else
      echo "source marker mismatch; preserving $SOURCE_ROOT" >&2
      status=1
    fi
  fi
  if [ -f "$ARCHIVE" ] && [ ! -L "$ARCHIVE" ] &&
    [ "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA" ]; then
    rm -f -- "$ARCHIVE"
  else
    echo "archive identity mismatch; preserving $ARCHIVE" >&2
    status=1
  fi
  exit "$status"
}
trap cleanup_source EXIT

[ ! -e "$SOURCE_ROOT" ]
install -d -o root -g root -m 0700 "$SOURCE_ROOT"
printf '%s\n%s\n' "$COMMIT" "$RUN_ID" >"$SOURCE_ROOT/.candidate-source"
chmod 0600 "$SOURCE_ROOT/.candidate-source"

tar --extract --file "$ARCHIVE" --directory "$SOURCE_ROOT" \
  --no-same-owner --no-same-permissions
VERSION="$(tr -d '\r\n' <"$SOURCE_ROOT/VERSION")"
[ -n "$VERSION" ]
docker build \
  --label io.kejilion.test-scope=site-icon-cache \
  --label "io.kejilion.source-commit=$COMMIT" \
  --label "io.kejilion.validation-run=$RUN_ID" \
  --build-arg "VERSION=$VERSION" \
  --build-arg "REVISION=$COMMIT" \
  --tag "$IMAGE" \
  "$SOURCE_ROOT"

[ "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
  "$IMAGE")" = "$COMMIT" ]
[ "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' \
  "$IMAGE")" = "$VERSION" ]
[ "$(docker image inspect -f '{{index .Config.Labels "io.kejilion.test-scope"}}' \
  "$IMAGE")" = site-icon-cache ]
[ "$(docker image inspect -f '{{index .Config.Labels "io.kejilion.source-commit"}}' \
  "$IMAGE")" = "$COMMIT" ]
[ "$(docker image inspect -f '{{index .Config.Labels "io.kejilion.validation-run"}}' \
  "$IMAGE")" = "$RUN_ID" ]
'@
  $buildEncoded = ConvertTo-RemoteBash $buildScript
  & ssh "${{ssh_host}}" `
    "printf '%s' '$buildEncoded' | base64 --decode | bash -s -- '$remoteSession' '$candidateCommit' '$runId' '$candidateImage' '$archiveHash'"
  if ($LASTEXITCODE -ne 0) {
    throw "remote candidate image build failed; run step 7 with this validation_run_id"
  }
}
finally {
  if (Test-Path -LiteralPath $localArchive) {
    Remove-Item -LiteralPath $localArchive
  }
}
```

在 root-only 会话目录中，用 `mktemp -d <session>/runtime.XXXXXX` 创建运行目录，并在其中创建：

- `agent-state`、`run`、`secrets`：`root:kejilion-panel`，目录不宽于 `0750`；
- `panel-data`：`65532:65532 / 0700`；
- 32 字节以上的一次性 Agent token：`root:kejilion-panel / 0640`；
- marker：包含 `${{candidate_commit}}`，权限 `0600`。

用 `${{candidate_agent_unit}}` 启动 transient Agent，关键参数固定为：

```text
--socket <temporary-root>/run/agent.sock
--token-file <temporary-root>/secrets/agent.token
--state-dir <temporary-root>/agent-state
--web-root /home/web
--docker-socket <temporary-root>/missing-docker.sock
--allow-docker-socket-activation=false
--enable-system-writes=false
--public-network-lookup=false
```

systemd 必须限制为只读宿主文件系统，仅允许临时 `agent-state/run` 写入，网络地址族只保留
`AF_UNIX AF_INET AF_INET6`。Docker socket 故意不存在；Agent 可报告 Docker degraded，
但网站列表和图标 GET 必须工作。

以下命令是候选 Agent/Panel 的完整启动契约。它按提交与 `validation_run_id` 唯一发现会话；
`TEST_ROOT` 必须直接使用 `mktemp` 的返回值，不得手工拼接；命令执行期间不能输出 token 内容：

```bash
set -Eeuo pipefail

COMMIT="${{candidate_commit}}"
RUN_ID="${{validation_run_id}}"
[[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
[[ "$RUN_ID" =~ ^[0-9a-f]{32}$ ]]

SESSION_ROOT=""
while IFS= read -r -d '' candidate_session; do
  marker="$candidate_session/.candidate-session"
  [ -f "$marker" ] && [ ! -L "$marker" ] || continue
  mapfile -t SESSION_MARKER <"$marker"
  if [ "${SESSION_MARKER[0]:-}" = "$COMMIT" ] &&
    [ "${SESSION_MARKER[1]:-}" = "$RUN_ID" ] &&
    [ "${#SESSION_MARKER[@]}" -eq 2 ]; then
    [ -z "$SESSION_ROOT" ]
    SESSION_ROOT="$candidate_session"
  fi
done < <(find /var/tmp -mindepth 1 -maxdepth 1 -type d \
  -name 'kpanel-site-icon-session.*' -print0)
[ -n "$SESSION_ROOT" ]
case "$SESSION_ROOT" in
  /var/tmp/kpanel-site-icon-session.*) ;;
  *) echo "unexpected session root" >&2; exit 1 ;;
esac
[ ! -L "$SESSION_ROOT" ]
[ "$(stat -Lc '%u:%a' "$SESSION_ROOT")" = 0:700 ]

CONTROL_FILE="$SESSION_ROOT/runtime.path"
TEST_ROOT=""
EXTRACT_CONTAINER="${{candidate_container}}-extract"

cleanup_failed_setup() {
  status=$?
  [ "$status" -eq 0 ] && return
  trap - EXIT
  set +e
  cleanup_residual=false

  if docker inspect "${{candidate_container}}" >/dev/null 2>&1; then
    if [ "$(docker inspect -f '{{index .Config.Labels "io.kejilion.test-scope"}}' \
        "${{candidate_container}}")" = site-icon-cache ] &&
      [ "$(docker inspect -f '{{index .Config.Labels "io.kejilion.source-commit"}}' \
        "${{candidate_container}}")" = "$COMMIT" ] &&
      [ "$(docker inspect -f '{{index .Config.Labels "io.kejilion.validation-run"}}' \
        "${{candidate_container}}")" = "$RUN_ID" ]; then
      docker rm -f "${{candidate_container}}" >/dev/null
    else
      cleanup_residual=true
    fi
  fi
  if docker inspect "${{candidate_container}}" >/dev/null 2>&1; then
    cleanup_residual=true
  fi

  unit_state="$(systemctl show "${{candidate_agent_unit}}.service" \
    -p LoadState --value 2>/dev/null)"
  if [ "$unit_state" != not-found ]; then
    if [ -n "$TEST_ROOT" ] &&
      [ "$(systemctl show "${{candidate_agent_unit}}.service" -p Description --value)" = \
        "KPanel site-icon candidate $COMMIT run $RUN_ID" ] &&
      systemctl show "${{candidate_agent_unit}}.service" -p ExecStart --value |
        grep -F -- "$TEST_ROOT/bin/kejilion-agent" >/dev/null; then
      systemctl stop "${{candidate_agent_unit}}.service"
      systemctl reset-failed "${{candidate_agent_unit}}.service" >/dev/null 2>&1
    else
      cleanup_residual=true
    fi
    for _ in $(seq 1 20); do
      [ "$(systemctl show "${{candidate_agent_unit}}.service" \
        -p LoadState --value 2>/dev/null)" = not-found ] && break
      sleep 0.1
    done
    if [ "$(systemctl show "${{candidate_agent_unit}}.service" \
      -p LoadState --value 2>/dev/null)" != not-found ]; then
      cleanup_residual=true
    fi
  fi

  if docker inspect "$EXTRACT_CONTAINER" >/dev/null 2>&1; then
    if [ "$(docker inspect -f '{{index .Config.Labels "io.kejilion.test-scope"}}' \
        "$EXTRACT_CONTAINER")" = site-icon-cache ] &&
      [ "$(docker inspect -f '{{index .Config.Labels "io.kejilion.source-commit"}}' \
        "$EXTRACT_CONTAINER")" = "$COMMIT" ] &&
      [ "$(docker inspect -f '{{index .Config.Labels "io.kejilion.validation-run"}}' \
        "$EXTRACT_CONTAINER")" = "$RUN_ID" ]; then
      docker rm -f "$EXTRACT_CONTAINER" >/dev/null
    else
      cleanup_residual=true
    fi
  fi
  if docker inspect "$EXTRACT_CONTAINER" >/dev/null 2>&1; then
    cleanup_residual=true
  fi

  test_root_removed=false
  if [ "$cleanup_residual" = false ] && [ -n "$TEST_ROOT" ]; then
    case "$TEST_ROOT" in
      "$SESSION_ROOT"/runtime.*)
        mapfile -t RUNTIME_MARKER <"$TEST_ROOT/.candidate-runtime" 2>/dev/null || true
        if [ "${RUNTIME_MARKER[0]:-}" = "$COMMIT" ] &&
          [ "${RUNTIME_MARKER[1]:-}" = "$RUN_ID" ] &&
          [ "${#RUNTIME_MARKER[@]}" -eq 2 ]; then
          rm -rf -- "$TEST_ROOT"
          [ ! -e "$TEST_ROOT" ] && test_root_removed=true
        elif [ -d "$TEST_ROOT" ] && [ ! -L "$TEST_ROOT" ]; then
          # The parent session marker was already validated before the
          # runtime directory was created.
          rm -rf -- "$TEST_ROOT"
          [ ! -e "$TEST_ROOT" ] && test_root_removed=true
        fi
        ;;
      *) cleanup_residual=true ;;
    esac
  fi
  if [ "$test_root_removed" = true ] &&
    [ -f "$CONTROL_FILE" ] && [ ! -L "$CONTROL_FILE" ] &&
    [ "$(cat "$CONTROL_FILE")" = "$TEST_ROOT" ]; then
    rm -f -- "$CONTROL_FILE"
  fi
  if [ -e "$CONTROL_FILE" ] || [ "$cleanup_residual" = true ]; then
    echo "candidate cleanup left residual resources; preserving runtime control" >&2
  fi
