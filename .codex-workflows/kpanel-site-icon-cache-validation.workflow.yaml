  --socket-group kejilion-panel \
  --token-file "$TEST_ROOT/secrets/agent.token" \
  --state-dir "$TEST_ROOT/agent-state" \
  --web-root /home/web \
  --docker-socket "$TEST_ROOT/missing-docker.sock" \
