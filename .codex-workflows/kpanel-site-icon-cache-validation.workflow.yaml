后续每个远端命令都先按提交与 `validation_run_id` 唯一发现 root-only 会话，再从会话内
`CONTROL_FILE` 读取 `TEST_ROOT`，不能重新推导目录。启动脚本若任一步失败，`EXIT` trap
会按容器标签、unit Description/ExecStart 和 marker 精确清理；定位文件只在确认运行目录
已删除后才移除。不得挂载生产 Panel 数据。

**Expected output:** 候选 Panel/Agent 的 revision 均为 `${{candidate_commit}}`；生产 Panel、
Agent、Nginx 和网站未变化。

### 4. 验证 Agent 真实抓取与磁盘缓存

在远端执行以下 Bash。curl 的认证 header 写入 `0600` 配置文件，token 不出现在命令行、
终端或证据中：

```bash
set -Eeuo pipefail

COMMIT="${{candidate_commit}}"
RUN_ID="${{validation_run_id}}"
SITE_ID="${{site_id}}"
SITE_DOMAIN="${{site_domain}}"
[[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
[[ "$RUN_ID" =~ ^[0-9a-f]{32}$ ]]
[[ "$SITE_ID" =~ ^[0-9a-f]{32}$ ]]
[[ "$SITE_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]

SESSION_ROOT=""
while IFS= read -r -d '' candidate_session; do
  marker="$candidate_session/.candidate-session"
  [ -f "$marker" ] && [ ! -L "$marker" ] || continue
  mapfile -t SESSION_MARKER <"$marker"
  if [ "${SESSION_MARKER[0]:-}" = "$COMMIT" ] &&
    [ "${SESSION_MARKER[1]:-}" = "$RUN_ID" ] &&
    [ "${#SESSION_MARKER[@]}" -eq 2 ]; then
    [ -z "$SESSION_ROOT" ]
    SESSION_ROOT="$candidate_session"
  fi
done < <(find /var/tmp -mindepth 1 -maxdepth 1 -type d \
  -name 'kpanel-site-icon-session.*' -print0)
[ -n "$SESSION_ROOT" ]
[ "$(stat -Lc '%u:%a' "$SESSION_ROOT")" = 0:700 ]

CONTROL_FILE="$SESSION_ROOT/runtime.path"
[ -f "$CONTROL_FILE" ] && [ ! -L "$CONTROL_FILE" ]
TEST_ROOT="$(cat "$CONTROL_FILE")"
case "$TEST_ROOT" in
  "$SESSION_ROOT"/runtime.*) ;;
  *) echo "unexpected TEST_ROOT" >&2; exit 1 ;;
esac
mapfile -t RUNTIME_MARKER <"$TEST_ROOT/.candidate-runtime"
[ "${RUNTIME_MARKER[0]:-}" = "$COMMIT" ]
[ "${RUNTIME_MARKER[1]:-}" = "$RUN_ID" ]
[ "${#RUNTIME_MARKER[@]}" -eq 2 ]

SOCKET="$TEST_ROOT/run/agent.sock"
TOKEN_FILE="$TEST_ROOT/secrets/agent.token"
CACHE_DIR="$TEST_ROOT/agent-state/site-icons"
AUTH_CONFIG="$TEST_ROOT/secrets/agent-curl.conf"
SITES_BODY="$TEST_ROOT/sites.json"
FIRST_BODY="$TEST_ROOT/icon-first.bin"
SECOND_BODY="$TEST_ROOT/icon-second.bin"
THIRD_BODY="$TEST_ROOT/icon-third.bin"
FIRST_HEADERS="$TEST_ROOT/icon-first.headers"
SECOND_HEADERS="$TEST_ROOT/icon-second.headers"
THIRD_HEADERS="$TEST_ROOT/icon-third.headers"

umask 0077
TOKEN="$(cat "$TOKEN_FILE")"
printf 'silent\nshow-error\nfail-with-body\nheader = "Authorization: Bearer %s"\n' \
  "$TOKEN" >"$AUTH_CONFIG"
unset TOKEN
chmod 0600 "$AUTH_CONFIG"

agent_get() {
  path="$1"
  body="$2"
  headers="$3"
  curl --config "$AUTH_CONFIG" \
    --unix-socket "$SOCKET" \
    --dump-header "$headers" \
    --output "$body" \
    "http://localhost$path"
}

agent_get "/v1/sites" "$SITES_BODY" "$TEST_ROOT/sites.headers"
grep -F -- "\"id\":\"$SITE_ID\"" "$SITES_BODY" >/dev/null
grep -F -- "\"primaryDomain\":\"$SITE_DOMAIN\"" "$SITES_BODY" >/dev/null

agent_get "/v1/sites/$SITE_ID/icon" "$FIRST_BODY" "$FIRST_HEADERS"
[ -s "$FIRST_BODY" ]
[ "$(stat -Lc '%s' "$FIRST_BODY")" -le 262144 ]
FIRST_TYPE="$(awk '
  BEGIN { IGNORECASE=1 }
  /^Content-Type:/ {
    sub(/\r$/, "")
    sub(/^[^:]+:[[:space:]]*/, "")
    print tolower($0)
  }
' "$FIRST_HEADERS" | tail -n 1)"
case "$FIRST_TYPE" in
  image/png|image/jpeg|image/gif|image/vnd.microsoft.icon|image/webp) ;;
  *) echo "unsupported icon Content-Type: $FIRST_TYPE" >&2; exit 1 ;;
esac

ICON_FILE="$CACHE_DIR/$SITE_ID.icon"
META_FILE="$CACHE_DIR/$SITE_ID.meta.json"
[ -d "$CACHE_DIR" ] && [ ! -L "$CACHE_DIR" ]
[ "$(stat -Lc '%a' "$CACHE_DIR")" = 700 ]
for cache_file in "$ICON_FILE" "$META_FILE"; do
  [ -f "$cache_file" ] && [ ! -L "$cache_file" ]
  [ "$(stat -Lc '%a' "$cache_file")" = 600 ]
done
[ "$(stat -Lc '%s' "$META_FILE")" -le 4096 ]

ICON_SHA="$(sha256sum "$ICON_FILE" | cut -d' ' -f1)"
FIRST_SHA="$(sha256sum "$FIRST_BODY" | cut -d' ' -f1)"
[ "$ICON_SHA" = "$FIRST_SHA" ]
grep -Eq '"sourceKey":"[0-9a-f]{64}"' "$META_FILE"
grep -F -- "\"contentSha256\":\"$ICON_SHA\"" "$META_FILE" >/dev/null
grep -F -- '"fetchedAt":' "$META_FILE" >/dev/null
ICON_MTIME="$(stat -Lc '%y' "$ICON_FILE")"
META_MTIME="$(stat -Lc '%y' "$META_FILE")"
META_SHA="$(sha256sum "$META_FILE" | cut -d' ' -f1)"

agent_get "/v1/sites/$SITE_ID/icon" "$SECOND_BODY" "$SECOND_HEADERS"
cmp --silent "$FIRST_BODY" "$SECOND_BODY"
[ "$(stat -Lc '%y' "$ICON_FILE")" = "$ICON_MTIME" ]
[ "$(stat -Lc '%y' "$META_FILE")" = "$META_MTIME" ]
[ "$(sha256sum "$META_FILE" | cut -d' ' -f1)" = "$META_SHA" ]

ENTRY_COUNT="$(find "$CACHE_DIR" -maxdepth 1 -type f -name '*.meta.json' -printf '.' | wc -c)"
ICON_BYTES="$(find "$CACHE_DIR" -maxdepth 1 -type f -name '*.icon' -printf '%s\n' |
  awk '{ total += $1 } END { print total + 0 }')"
[ "$ENTRY_COUNT" -le 256 ]
[ "$ICON_BYTES" -le 33554432 ]

systemctl restart "${{candidate_agent_unit}}.service"
for _ in $(seq 1 50); do
  systemctl is-active --quiet "${{candidate_agent_unit}}.service" &&
    [ -S "$SOCKET" ] && break
  sleep 0.2
done
systemctl is-active --quiet "${{candidate_agent_unit}}.service"
agent_get "/v1/sites/$SITE_ID/icon" "$THIRD_BODY" "$THIRD_HEADERS"
cmp --silent "$FIRST_BODY" "$THIRD_BODY"
[ "$(stat -Lc '%y' "$ICON_FILE")" = "$ICON_MTIME" ]
[ "$(stat -Lc '%y' "$META_FILE")" = "$META_MTIME" ]
[ "$(sha256sum "$META_FILE" | cut -d' ' -f1)" = "$META_SHA" ]

rm -f -- \
  "$AUTH_CONFIG" "$SITES_BODY" "$TEST_ROOT/sites.headers" \
  "$FIRST_BODY" "$SECOND_BODY" "$THIRD_BODY" \
  "$FIRST_HEADERS" "$SECOND_HEADERS" "$THIRD_HEADERS"
```

不要通过停止 Nginx、修改网站或清理生产缓存来制造失败。

**Expected output:** 实际站点 favicon 已通过本机入口获取，第二次和 Agent 重启后均命中磁盘缓存。

### 5. 用真实 Chrome 验证页面与效率

建立隧道：

```powershell
ssh -o ExitOnForwardFailure=yes -N `
  -L "127.0.0.2:${{local_tunnel_port}}:127.0.0.1:${{candidate_port}}" `
  "${{ssh_host}}"
```

在真实 Chrome 的新标签页打开候选 Panel，完成一次性初始化后进入网站列表。禁止用 HTTP
脚本、SSR 字符串或组件 `setup()` 代替本步骤。

对 `${{site_domain}}` 校验：

- 图标元素 URL 精确为 `/api/v1/sites/<site-id>/icon`，不能含目标站点远程 URL；
- `loading=lazy`、`fetchpriority=low`、固定宽高存在；
- 返回 `Cache-Control: private, max-age=604800, stale-if-error=604800`、`ETag` 和正确位图 MIME；
- 图标显示后，网站列表 API 已先完成，页面点击/筛选无等待；
- 普通重复进入页面不产生新的图标网络传输，或资源 timing 明确显示浏览器缓存；
- DevTools 控制台无 CSP、mixed-content、CORS、未处理 Promise 或 Vue 错误。

若选择一个已知没有图标的站点，只验证它回退 `Globe2` 且没有连续请求循环；不得改网站来
构造缺失状态。

**Expected output:** 真实浏览器显示实际图标，缓存命中且不阻塞列表；失败站点安全降级。

### 6. 验证系统发行版品牌

在候选概览页读取 API 的 `osId`、`osLike` 和显示文本，再检查 DOM 中系统图标颜色/路径。
若真机为 Rocky：

```text
osId == rocky
osLike may include rhel, centos, fedora
rendered identity == rocky
accent == #10B981
rendered identity != centos
```

真机只能证明自身发行版；其余 AlmaLinux、RHEL、Oracle、Manjaro、openSUSE、SLES 矩阵由
`operatingSystem.test.ts` 的确定性用例验收。未知衍生版必须是通用 Linux，不能根据
`ID_LIKE` 冒充兼容家族品牌。

**Expected output:** 真机发行版与图标一致，完整矩阵测试通过。

### 7. 强制清理并恢复基线

无论成功或失败都按顺序：

1. 关闭 Chrome 候选标签和 SSH 隧道；
2. 核对 `${{candidate_container}}` 的测试标签与 revision 后删除该精确候选容器；
3. 核对 `${{candidate_agent_unit}}` 的 Description 和 ExecStart 位于临时根目录后停止 unit；
4. 核对临时根目录前缀和 marker 均正确后，才删除该精确目录；
5. 可删除精确候选镜像，不得 prune、不得删除生产镜像；
6. 对比步骤 1 的生产 Panel/Agent/Nginx/站点和所有业务容器基线。

禁止 `docker system prune`、`docker compose down`、通配符删除、重启生产 Nginx/Panel/Agent，
也禁止操作任意业务容器。

候选资源使用以下精确清理门禁；先关闭浏览器标签和本地 SSH 隧道，再在远端执行：

