    [ "${SOURCE_MARKER[0]:-}" = "$COMMIT" ]
    [ "${SOURCE_MARKER[1]:-}" = "$RUN_ID" ]
    [ "${#SOURCE_MARKER[@]}" -eq 2 ]
  fi
  # If interruption preceded the child marker, the already-validated
  # root-only session marker and this exact child path remain authoritative.
  rm -rf -- "$SOURCE_ROOT"
fi

ARCHIVE="$SESSION_ROOT/source.tar.part"
if [ -e "$ARCHIVE" ]; then
  [ -f "$ARCHIVE" ] && [ ! -L "$ARCHIVE" ]
  rm -f -- "$ARCHIVE"
fi

if docker image inspect "$IMAGE" >/dev/null 2>&1; then
  [ "$(docker image inspect -f '{{index .Config.Labels "io.kejilion.test-scope"}}' \
    "$IMAGE")" = site-icon-cache ]
  [ "$(docker image inspect -f '{{index .Config.Labels "io.kejilion.source-commit"}}' \
    "$IMAGE")" = "$COMMIT" ]
  [ "$(docker image inspect -f '{{index .Config.Labels "io.kejilion.validation-run"}}' \
    "$IMAGE")" = "$RUN_ID" ]
  docker image rm "$IMAGE" >/dev/null
fi

[ -z "$(docker ps -aq --filter "name=^/${{candidate_container}}$")" ]
[ -z "$(docker ps -aq --filter "name=^/${EXTRACT_CONTAINER}$")" ]
for _ in $(seq 1 20); do
  [ "$(systemctl show "${{candidate_agent_unit}}.service" \
    -p LoadState --value 2>/dev/null || true)" = not-found ] && break
  sleep 0.1
done
[ "$(systemctl show "${{candidate_agent_unit}}.service" \
  -p LoadState --value 2>/dev/null || true)" = not-found ]
! docker image inspect "$IMAGE" >/dev/null 2>&1
! ss -H -ltn "sport = :${{candidate_port}}" | grep -q .

[ "$(find "$SESSION_ROOT" -mindepth 1 -maxdepth 1 -printf '%f\n')" = \
  ".candidate-session" ]
rm -rf -- "$SESSION_ROOT"
[ ! -e "$SESSION_ROOT" ]
```

最后重新执行步骤 1 的全部只读生产基线命令；任一标签、marker 或路径门禁不匹配时立即
停止并报告，不得扩大删除范围。

**Expected output:** 候选容器、unit、目录和隧道均不存在；全部生产 ID、状态和健康值与基线一致。

## Parameters

- `${{project_dir}}`：当前独立 KPanel 工作树绝对路径。
- `${{project_linux_dir}}`：同一工作树在 WSL/Linux 中的绝对路径，例如
  `/mnt/c/GitHub/kejilion-panel-feature`。
- `${{go_module_cache_linux_dir}}`：已填充的 WSL/Linux Go module 缓存绝对路径，只读挂载
  到测试容器。
- `${{candidate_commit}}`：包含实现、测试、文档和本 workflow 的提交。
- `${{candidate_image}}`：仅真机本地使用的唯一候选镜像标签。
- `${{candidate_container}}`：唯一候选 Panel 容器名。
- `${{candidate_agent_unit}}`：唯一 transient Agent unit 名。
- `${{candidate_port}}`：远端候选 Panel 回环端口。
- `${{local_tunnel_port}}`：本地 Chrome 回环端口。
- `${{ssh_host}}`：已配置的 SSH 主机别名。
- `${{validation_run_id}}`：本次执行新生成的 32 位小写十六进制随机值，不得复用。
- `${{site_id}}`：与现有站点主域名对应的 32 位小写十六进制 ID。
- `${{site_domain}}`：只读验证的既有站点主域名。
- `${{evidence_dir}}`：当前工作树内被忽略的脱敏证据目录。

## Verification

- Linux 全量 Go、race、前端测试/typecheck/build 和隔离 loopback 测试通过。
- 真实 Agent 首取、二次读取、Agent 重启后的图标 SHA-256 一致。
- Chrome 只请求 KPanel 同源接口，实际图标显示，7 天缓存头正确且重复页面无额外传输。
- 图标失败显示 Globe，不出现请求循环或控制台错误。
- 真机系统发行版品牌正确；完整发行版矩阵确定性测试通过。
- 没有修改 `/home/web`、Nginx、生产 Panel/Agent、业务容器或远端镜像仓库。
- 清理后生产基线完全一致，证据目录不含秘密。

## Notes

- CSP 仅允许 `img-src 'self' data:`；浏览器直接加载外站 favicon 既会失败，也会泄露访问者
  IP，因此不是可接受的替代方案。
- `ID_LIKE` 是兼容家族，不是品牌。它可用于包管理能力判断，不能用于发行版图标。
- 首次真实站点请求可能经过反向代理上游；4 是全局抓取并发硬上限，可能阻塞的站点发现等待、
  抓取排队和网络请求共用 4 秒预算，首页和单个图标各有 256 KiB 上限。测试不得为了观察失败
  而停止真实上游。
- 浏览器 7 天缓存意味着普通 reload 不一定发请求；需要检验条件请求时，只在候选环境使用
  DevTools 的临时 Disable cache，完成后恢复。不得把禁用缓存当作正常性能结果。
- 生产 Agent 版本不含图标端点时，候选 Panel 会得到 404 并安全显示 Globe；这只能验证
  兼容降级，不能声称实际图标链路已通过。
