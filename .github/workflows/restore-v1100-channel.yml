name: Restore public channel to KPanel 1.10.0

on:
  push:
    branches: [ops/restore-v1100-channel]
    paths: [.github/workflows/restore-v1100-channel.yml]

permissions:
  contents: write

concurrency:
  group: restore-v1100-channel
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: docker.io/kjlion/kejilion-panel
      OLD_DIGEST: sha256:eaecfa6a156c35b106e74820619d35734c6cbdc2fd577465f08ce95bb46e964e
      WITHDRAWN_DIGEST: sha256:dd1a60a20fa89eba4b78f36d7bcc1d091f27ba8dcc51b3ed99bbf7e672411213
    steps:
      - name: Verify historical release targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kejilion/KPanel
          test "$(gh api repos/kejilion/KPanel/git/ref/tags/v1.10.0 --jq .object.sha)" = 5039a56042f7b72abd66026ed547da19832b22b0
          test "$(gh api repos/kejilion/KPanel/git/tags/5039a56042f7b72abd66026ed547da19832b22b0 --jq .object.sha)" = a21d5bfc744b2a9316578dfca83426c001e2ee6d
          latest=$(gh api repos/kejilion/KPanel/releases/latest --jq .tag_name)
          test "$latest" = v1.11.0 || test "$latest" = v1.10.0
          gh release view v1.10.0 --repo kejilion/KPanel --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("invalid rollback release") else "rollback release is stable" end'
      - name: Set up existing pinned Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Authenticate to existing image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'kjlion' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Restore exact historical OCI index
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          test "$(digest "$IMAGE:1.10.0")" = "$OLD_DIGEST"
          current=$(digest "$IMAGE:latest")
          test "$current" = "$WITHDRAWN_DIGEST" || test "$current" = "$OLD_DIGEST"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$OLD_DIGEST"
          test "$(digest "$IMAGE:latest")" = "$OLD_DIGEST"
          test "$(digest "$IMAGE:1.11.0")" = "$WITHDRAWN_DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest"
      - name: Restore GitHub default and mark withdrawn release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.11.0 --repo kejilion/KPanel --prerelease --latest=false --title 'KPanel 1.11.0 (withdrawn; use 1.10.0)'
          gh release edit v1.10.0 --repo kejilion/KPanel --latest
          test "$(gh api repos/kejilion/KPanel/releases/latest --jq .tag_name)" = v1.10.0
          test "$(gh release view v1.11.0 --repo kejilion/KPanel --json isPrerelease --jq .isPrerelease)" = true
          echo 'Public default restored to v1.10.0; immutable tags and assets retained.' >> "$GITHUB_STEP_SUMMARY"
