name: Release L3

on:
  push:
    branches: ["feature/github-release-pipeline"]
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: l3-${{ github.workflow }}-${{ inputs.candidate || github.ref }}
  cancel-in-progress: true

jobs:
  l3:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch the pinned Go module graph for offline governance preflight
        run: go mod download
      - name: Run authoritative L3
        env:
          KPANEL_CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
          KPANEL_L3_EVIDENCE: ${{ runner.temp }}/l3-${{ github.run_id }}-${{ github.run_attempt }}
          GOVERNANCE_CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$KPANEL_CANDIDATE_SHA" GITHUB_REF_NAME=release/validated-candidate
          node scripts/run-release-l3.mjs --github-hosted 2>&1 | tee "$RUNNER_TEMP/l3.log"
      - name: Preserve L3 evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/l3-*/**/*.json
            ${{ runner.temp }}/l3-*/**/*.log
            ${{ runner.temp }}/l3.log
          if-no-files-found: error
          retention-days: 30
