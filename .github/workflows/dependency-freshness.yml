name: Dependency freshness

on:
  push:
    paths:
      - dependency-policy.json
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
      - Dockerfile
      - Makefile
      - scripts/report-dependency-freshness.mjs
      - scripts/security-scan.sh
      - THIRD_PARTY_NOTICES.md
      - .codex-workflows/**
      - .github/workflows/**
  schedule:
    - cron: "17 2 * * 1"
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    if: github.event_name != 'schedule' || github.event.schedule == '17 2 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the locked Node dependency graph
        run: npm ci --prefix web

      - name: Detect stable dependency candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/report-dependency-freshness.mjs \
            --format markdown \
            --output dependency-freshness.md
          status=$?
          if [[ -f dependency-freshness.md ]]; then
            cat dependency-freshness.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  security-advisories:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '43 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit the current dependency graph
        run: make security-audit

      - name: Scan source dependencies and supply-chain configuration
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash scripts/security-scan.sh source
