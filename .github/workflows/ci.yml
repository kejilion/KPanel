name: CI

on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      base:
        required: false
        default: origin/main
        type: string
      main-check:
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "release/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.candidate || github.ref }}-${{ github.job }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Fetch the pinned Go module graph for offline governance preflight
        run: go mod download

      - name: Run change-aware verification
        env:
          GOVERNANCE_CI_TOKEN: ${{ github.token }}
          KPANEL_CI_SHA: ${{ inputs.candidate || github.sha }}
          KPANEL_CI_REF_NAME: ${{ inputs.candidate && (inputs.main-check && 'main' || 'release/validated-candidate') || github.ref_name }}
          VERIFY_BASE_REF: ${{ inputs.base || github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
        run: |
          export GITHUB_SHA="$KPANEL_CI_SHA" GITHUB_REF_NAME="$KPANEL_CI_REF_NAME"
          # Only raise the existing verification floor; L3 still requires the release workflow.
          trailers="$(git log -1 --format=%B | git interpret-trailers --parse)"
          requested_level=""
          while IFS= read -r trailer; do
            [[ "${trailer,,}" == verification-level:* ]] || continue
            if [[ -n "$requested_level" ]]; then
              echo "Duplicate Verification-Level trailer" >&2
              exit 1
            fi
            requested_level="${trailer#*:}"
            requested_level="${requested_level# }"
            case "$requested_level" in
              L0|L1) ;;
              L2|L3) export VERIFY_LEVEL=2 ;;
              *) echo "Invalid Verification-Level trailer" >&2; exit 1 ;;
            esac
          done <<< "$trailers"
          make verify-change

      - name: Detect races in privileged core packages
        run: go test -race ./internal/panel ./internal/auth ./internal/dockerx

      - name: Scan Go call paths for known vulnerabilities
        run: make security-audit-go

      - name: Audit Node dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm audit --prefix web --audit-level=high; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Scan source, dependencies, secrets, and configuration
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash scripts/security-scan.sh source

      - name: Verify kejilion.sh application lifecycle
        run: |
          bash packaging/tests/app-conf-legacy-migration.sh "$PWD"
          docker run --rm \
            -e KPANEL_APP_CONF_TEST_ROOTFS=1 \
            -v "$PWD:/src:ro" \
            alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b \
            sh -ec 'apk add --no-cache bash >/dev/null && bash /src/packaging/tests/app-conf-openrc-lifecycle.sh /src'

  windows-node:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Verify native Windows node boundaries
        shell: pwsh
        run: ./scripts/verify-windows-node.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-node-assets')
